services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_growth
      POSTGRES_USER: ai_growth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_growth -d ai_growth"]
      interval: 5s
      timeout: 5s
      retries: 20

  profile-init:
    build: .
    command: ["python", "-m", "app.intake.profile_store"]
    volumes:
      - company_products:/app/company_products

  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      COMMENT_PLATFORM_PROXY_URL: ${COMMENT_PLATFORM_PROXY_URL:-http://188.120.254.223:8891}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      APP_ENV: production
      STUDIO_ADMIN_USERNAME: ${STUDIO_ADMIN_USERNAME:-}
      RELEASE_SHA: ${RELEASE_SHA:-}
      STUDIO_ADMIN_PASSWORD: ${STUDIO_ADMIN_PASSWORD:-}
      STUDIO_PUBLIC_ORIGIN: ${STUDIO_PUBLIC_ORIGIN:-https://growth.servgo.ru}
      STUDIO_HTPASSWD_FILE: ${STUDIO_HTPASSWD_FILE:-}
      STUDIO_USERS_FILE: ${STUDIO_USERS_FILE:-}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-http://188.120.254.223:8891}
      CONTENT_TELEGRAM_AUTOPOST_ENABLED: ${CONTENT_TELEGRAM_AUTOPOST_ENABLED:-false}
      CONTENT_TELEGRAM_MAX_LATENESS_MINUTES: ${CONTENT_TELEGRAM_MAX_LATENESS_MINUTES:-30}
      DATABASE_URL: postgresql+psycopg://ai_growth:${POSTGRES_PASSWORD}@postgres:5432/ai_growth
      LLM_PROVIDER: xai
      LLM_MODEL: ${LLM_MODEL:-grok-4.7}
      XAI_API_KEY: ${XAI_API_KEY:?XAI_API_KEY is required}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.claudehub.fun/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      WHITEBOARD_STORYBOARD_MODEL: ${WHITEBOARD_STORYBOARD_MODEL:-}
      WHITEBOARD_IMAGE_MODEL: ${WHITEBOARD_IMAGE_MODEL:-}
      WHITEBOARD_SPEECH_MODEL: ${WHITEBOARD_SPEECH_MODEL:-}
      WHITEBOARD_REGIONS_MODEL: ${WHITEBOARD_REGIONS_MODEL:-}
      WHITEBOARD_VOICE: ${WHITEBOARD_VOICE:-}
      WHITEBOARD_PROXY_URL: ${WHITEBOARD_PROXY_URL:-}
      XAI_REASONING_EFFORT: ${XAI_REASONING_EFFORT:-medium}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-gemini-flash-3.8}
      JEFF_API_KEY: ${JEFF_API_KEY:-}
      JEFF_BASE_URL: ${JEFF_BASE_URL:-}
      JEFF_MODEL: ${JEFF_MODEL:-jeff}
      INTELLIGENCE_CONFIDENCE_THRESHOLD: ${INTELLIGENCE_CONFIDENCE_THRESHOLD:-0.8}
      INTELLIGENCE_CAMPAIGN_ENABLED: ${INTELLIGENCE_CAMPAIGN_ENABLED:-true}
      AGENT_CRITIC_ENABLED: ${AGENT_CRITIC_ENABLED:-false}
      AGENT_CRITIC_MAX_CONTEXT_CHARS: ${AGENT_CRITIC_MAX_CONTEXT_CHARS:-24000}
      AGENT_CRITIC_REVIEW_TIMEOUT_SECONDS: ${AGENT_CRITIC_REVIEW_TIMEOUT_SECONDS:-45}
      AGENT_CRITIC_REVISION_TIMEOUT_SECONDS: ${AGENT_CRITIC_REVISION_TIMEOUT_SECONDS:-75}
      MODEL_ROUTER_ADMIN_TOKEN: ${MODEL_ROUTER_ADMIN_TOKEN:-}
      # Disabled unless explicitly configured; no implicit paid search calls.
      MODEL_ROUTER_ENABLED: ${MODEL_ROUTER_ENABLED:-false}
      MODEL_ROUTER_PROFILES: '${MODEL_ROUTER_PROFILES:-}'
      MODEL_ROUTER_OVERRIDES: '${MODEL_ROUTER_OVERRIDES:-{}}'
      MODEL_ROUTER_MAX_CALL_USD: '${MODEL_ROUTER_MAX_CALL_USD:-}'
      PRODUCTS_ROOT: /app/company_products
      SKILLS_ROOT: /app/skills
    volumes:
      - company_products:/app/company_products
      - ${STUDIO_HTPASSWD_HOST_FILE:-/etc/nginx/.htpasswd-growth-studio}:/run/studio.htpasswd:ro
    depends_on:
      profile-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AI_GROWTH_PORT:-8091}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 10

  telegram:
    build:
      context: .
    restart: unless-stopped
    command: ["python", "-m", "app.telegram_control_bot"]
    profiles: ["telegram"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ai_growth:${POSTGRES_PASSWORD}@postgres:5432/ai_growth
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:-}
      LLM_PROVIDER: xai
      LLM_MODEL: ${TEAM_LLM_MODEL:-kimi-2.7}
      XAI_API_KEY: ${XAI_API_KEY:?XAI_API_KEY is required}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.claudehub.fun/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      WHITEBOARD_STORYBOARD_MODEL: ${WHITEBOARD_STORYBOARD_MODEL:-}
      WHITEBOARD_IMAGE_MODEL: ${WHITEBOARD_IMAGE_MODEL:-}
      WHITEBOARD_SPEECH_MODEL: ${WHITEBOARD_SPEECH_MODEL:-}
      WHITEBOARD_REGIONS_MODEL: ${WHITEBOARD_REGIONS_MODEL:-}
      WHITEBOARD_VOICE: ${WHITEBOARD_VOICE:-}
      WHITEBOARD_PROXY_URL: ${WHITEBOARD_PROXY_URL:-}
      XAI_REASONING_EFFORT: ${TEAM_XAI_REASONING_EFFORT:-low}
      LLM_FALLBACK_MODELS: ${TEAM_LLM_FALLBACK_MODELS:-grok-4.7}
      JEFF_API_KEY: ${JEFF_API_KEY:-}
      JEFF_BASE_URL: ${JEFF_BASE_URL:-}
      JEFF_MODEL: ${JEFF_MODEL:-jeff}
      INTELLIGENCE_CONFIDENCE_THRESHOLD: ${INTELLIGENCE_CONFIDENCE_THRESHOLD:-0.8}
      INTELLIGENCE_CAMPAIGN_ENABLED: ${INTELLIGENCE_CAMPAIGN_ENABLED:-true}
      AGENT_CRITIC_ENABLED: ${AGENT_CRITIC_ENABLED:-false}
      AGENT_CRITIC_MAX_CONTEXT_CHARS: ${AGENT_CRITIC_MAX_CONTEXT_CHARS:-24000}
      AGENT_CRITIC_REVIEW_TIMEOUT_SECONDS: ${AGENT_CRITIC_REVIEW_TIMEOUT_SECONDS:-45}
      AGENT_CRITIC_REVISION_TIMEOUT_SECONDS: ${AGENT_CRITIC_REVISION_TIMEOUT_SECONDS:-75}
      # Disabled unless explicitly configured; no implicit paid search calls.
      MODEL_ROUTER_ENABLED: ${MODEL_ROUTER_ENABLED:-false}
      MODEL_ROUTER_PROFILES: '${MODEL_ROUTER_PROFILES:-}'
      MODEL_ROUTER_OVERRIDES: '${MODEL_ROUTER_OVERRIDES:-{}}'
      MODEL_ROUTER_MAX_CALL_USD: '${MODEL_ROUTER_MAX_CALL_USD:-}'
      PRODUCTS_ROOT: /app/company_products
      SKILLS_ROOT: /app/skills
      TELEGRAM_POLL_TIMEOUT_SECONDS: ${TELEGRAM_POLL_TIMEOUT_SECONDS:-25}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-http://188.120.254.223:8891}
      CONTENT_TELEGRAM_AUTOPOST_ENABLED: ${CONTENT_TELEGRAM_AUTOPOST_ENABLED:-false}
      CONTENT_TELEGRAM_MAX_LATENESS_MINUTES: ${CONTENT_TELEGRAM_MAX_LATENESS_MINUTES:-30}
    volumes:
      - company_products:/app/company_products
    depends_on:
      profile-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
    restart: unless-stopped
    command: ["python", "-m", "app.team_worker"]
    environment:
      COMMENT_PLATFORM_PROXY_URL: ${COMMENT_PLATFORM_PROXY_URL:-http://188.120.254.223:8891}
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ai_growth:${POSTGRES_PASSWORD}@postgres:5432/ai_growth
      LLM_PROVIDER: xai
      LLM_MODEL: ${TEAM_LLM_MODEL:-kimi-2.7}
      XAI_API_KEY: ${XAI_API_KEY:?XAI_API_KEY is required}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.claudehub.fun/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      WHITEBOARD_STORYBOARD_MODEL: ${WHITEBOARD_STORYBOARD_MODEL:-}
      WHITEBOARD_IMAGE_MODEL: ${WHITEBOARD_IMAGE_MODEL:-}
      WHITEBOARD_SPEECH_MODEL: ${WHITEBOARD_SPEECH_MODEL:-}
      WHITEBOARD_REGIONS_MODEL: ${WHITEBOARD_REGIONS_MODEL:-}
      WHITEBOARD_VOICE: ${WHITEBOARD_VOICE:-}
      WHITEBOARD_PROXY_URL: ${WHITEBOARD_PROXY_URL:-}
      XAI_REASONING_EFFORT: ${TEAM_XAI_REASONING_EFFORT:-low}
      LLM_FALLBACK_MODELS: ${TEAM_LLM_FALLBACK_MODELS:-grok-4.7}
      JEFF_API_KEY: ${JEFF_API_KEY:-}
      JEFF_BASE_URL: ${JEFF_BASE_URL:-}
      JEFF_MODEL: ${JEFF_MODEL:-jeff}
      INTELLIGENCE_CONFIDENCE_THRESHOLD: ${INTELLIGENCE_CONFIDENCE_THRESHOLD:-0.8}
      INTELLIGENCE_CAMPAIGN_ENABLED: ${INTELLIGENCE_CAMPAIGN_ENABLED:-true}
      AGENT_CRITIC_ENABLED: ${AGENT_CRITIC_ENABLED:-false}
      AGENT_CRITIC_MAX_CONTEXT_CHARS: ${AGENT_CRITIC_MAX_CONTEXT_CHARS:-24000}
      AGENT_CRITIC_REVIEW_TIMEOUT_SECONDS: ${AGENT_CRITIC_REVIEW_TIMEOUT_SECONDS:-45}
      AGENT_CRITIC_REVISION_TIMEOUT_SECONDS: ${AGENT_CRITIC_REVISION_TIMEOUT_SECONDS:-75}
      # Disabled unless explicitly configured; no implicit paid search calls.
      MODEL_ROUTER_ENABLED: ${MODEL_ROUTER_ENABLED:-false}
      MODEL_ROUTER_PROFILES: '${MODEL_ROUTER_PROFILES:-}'
      MODEL_ROUTER_OVERRIDES: '${MODEL_ROUTER_OVERRIDES:-{}}'
      MODEL_ROUTER_MAX_CALL_USD: '${MODEL_ROUTER_MAX_CALL_USD:-}'
      PRODUCTS_ROOT: /app/company_products
      SKILLS_ROOT: /app/skills
      TEAM_WORKER_BATCH_SIZE: ${TEAM_WORKER_BATCH_SIZE:-1}
      TEAM_WORKER_IDLE_POLL_SECONDS: ${TEAM_WORKER_IDLE_POLL_SECONDS:-20}
      TEAM_WORKER_BUSY_POLL_SECONDS: ${TEAM_WORKER_BUSY_POLL_SECONDS:-2}
      CONTENT_TELEGRAM_AUTOPOST_ENABLED: ${CONTENT_TELEGRAM_AUTOPOST_ENABLED:-false}
      CONTENT_TELEGRAM_MAX_LATENESS_MINUTES: ${CONTENT_TELEGRAM_MAX_LATENESS_MINUTES:-30}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:-}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-http://188.120.254.223:8891}
    volumes:
      - company_products:/app/company_products
    depends_on:
      profile-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  company_products:
