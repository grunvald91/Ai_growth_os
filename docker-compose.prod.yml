services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_growth
      POSTGRES_USER: ai_growth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_growth -d ai_growth"]
      interval: 5s
      timeout: 5s
      retries: 20

  profile-init:
    build: .
    command: ["python", "-m", "app.intake.profile_store"]
    volumes:
      - company_products:/app/company_products

  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      STUDIO_ADMIN_USERNAME: ${STUDIO_ADMIN_USERNAME:-}
      STUDIO_ADMIN_PASSWORD: ${STUDIO_ADMIN_PASSWORD:-}
      STUDIO_PUBLIC_ORIGIN: ${STUDIO_PUBLIC_ORIGIN:-https://growth.servgo.ru}
      DATABASE_URL: postgresql+psycopg://ai_growth:${POSTGRES_PASSWORD}@postgres:5432/ai_growth
      LLM_PROVIDER: xai
      LLM_MODEL: ${LLM_MODEL:-grok-4.7}
      XAI_API_KEY: ${XAI_API_KEY:?XAI_API_KEY is required}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.claudehub.fun/v1}
      XAI_REASONING_EFFORT: ${XAI_REASONING_EFFORT:-medium}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-gemini-flash-3.8}
      PRODUCTS_ROOT: /app/company_products
      SKILLS_ROOT: /app/skills
    volumes:
      - company_products:/app/company_products
    depends_on:
      profile-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AI_GROWTH_PORT:-8091}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 10

  telegram:
    build:
      context: .
    restart: unless-stopped
    command: ["python", "-m", "app.telegram_control_bot"]
    profiles: ["telegram"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ai_growth:${POSTGRES_PASSWORD}@postgres:5432/ai_growth
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:-}
      LLM_PROVIDER: xai
      LLM_MODEL: ${TEAM_LLM_MODEL:-kimi-2.7}
      XAI_API_KEY: ${XAI_API_KEY:?XAI_API_KEY is required}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.claudehub.fun/v1}
      XAI_REASONING_EFFORT: ${TEAM_XAI_REASONING_EFFORT:-low}
      LLM_FALLBACK_MODELS: ${TEAM_LLM_FALLBACK_MODELS:-grok-4.7}
      PRODUCTS_ROOT: /app/company_products
      SKILLS_ROOT: /app/skills
      TELEGRAM_POLL_TIMEOUT_SECONDS: ${TELEGRAM_POLL_TIMEOUT_SECONDS:-25}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-http://188.120.254.223:8891}
    volumes:
      - company_products:/app/company_products
    depends_on:
      profile-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
    restart: unless-stopped
    command: ["python", "-m", "app.team_worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ai_growth:${POSTGRES_PASSWORD}@postgres:5432/ai_growth
      LLM_PROVIDER: xai
      LLM_MODEL: ${TEAM_LLM_MODEL:-kimi-2.7}
      XAI_API_KEY: ${XAI_API_KEY:?XAI_API_KEY is required}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.claudehub.fun/v1}
      XAI_REASONING_EFFORT: ${TEAM_XAI_REASONING_EFFORT:-low}
      LLM_FALLBACK_MODELS: ${TEAM_LLM_FALLBACK_MODELS:-grok-4.7}
      PRODUCTS_ROOT: /app/company_products
      SKILLS_ROOT: /app/skills
      TEAM_WORKER_BATCH_SIZE: ${TEAM_WORKER_BATCH_SIZE:-1}
      TEAM_WORKER_IDLE_POLL_SECONDS: ${TEAM_WORKER_IDLE_POLL_SECONDS:-20}
      TEAM_WORKER_BUSY_POLL_SECONDS: ${TEAM_WORKER_BUSY_POLL_SECONDS:-2}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:-}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-http://188.120.254.223:8891}
    volumes:
      - company_products:/app/company_products
    depends_on:
      profile-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  company_products:
