services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_growth
      POSTGRES_USER: ai_growth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_growth -d ai_growth"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ai_growth:${POSTGRES_PASSWORD}@postgres:5432/ai_growth
      LLM_PROVIDER: xai
      LLM_MODEL: ${LLM_MODEL:-grok-4.7}
      XAI_API_KEY: ${XAI_API_KEY:?XAI_API_KEY is required}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.claudehub.fun/v1}
      XAI_REASONING_EFFORT: ${XAI_REASONING_EFFORT:-medium}
      PRODUCTS_ROOT: /app/products
      SKILLS_ROOT: /app/skills
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AI_GROWTH_PORT:-8091}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
