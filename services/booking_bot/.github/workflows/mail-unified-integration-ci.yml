name: ServGo unified Mail integration check
on:
  push:
    branches:
      - integration/servgo-mail-main-20261102
    paths:
      - '.github/workflows/mail-unified-integration-ci.yml'
permissions:
  contents: read
concurrency:
  group: servgo-mail-unified-check
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      BOT_TOKEN: test-token
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install mail backend test dependencies
        run: python -m pip install -r requirements.txt -r web/api/requirements.txt pytest aiosqlite
      - name: Compile changed backend
        run: |
          python -m py_compile web/api/routes/mail_company_search.py web/api/routes/mail_campaign_dispatch.py web/api/routes/mail_campaign_review.py web/api/routes/mail_pwa.py
      - name: Test mail, PWA auth, protection and routing
        run: |
          python -m pytest -q tests/test_mail_company_search.py tests/test_mail_campaign_safety_v4.py tests/test_mail_air_v2.py tests/test_mail_same_origin.py tests/test_mail_pwa_navigation_contract.py
      - name: Check Mail HTML scripts and duplicate IDs
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, subprocess, tempfile
          class Ids(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set(); self.duplicates=[]
              def handle_starttag(self, tag, attrs):
                  i=dict(attrs).get("id")
                  if i in self.ids:self.duplicates.append(i)
                  if i:self.ids.add(i)
          for name in ("mail_campaign_dashboard.html", "owner_mail_ui.html"):
              html=(Path("web/api/routes")/name).read_text(encoding="utf-8")
              scan=Ids();scan.feed(html)
              assert not scan.duplicates, (name,scan.duplicates)
              scripts=re.findall(r"<script>(.*?)</script>",html,re.S)
              assert len(scripts)==1, name
              with tempfile.NamedTemporaryFile(mode="w",suffix=".js") as f:
                  f.write(scripts[0]);f.flush()
                  subprocess.run(["node","--check",f.name],check=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Frontend production build and Mail PWA route tests
        working-directory: web/frontend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build
          node --test tests/auth-route.test.mjs tests/studio-workspace-entry.test.mjs
