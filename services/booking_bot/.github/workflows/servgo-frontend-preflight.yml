name: ServGo frontend atomic release preflight (read-only)
on:
  push:
    branches: [integration/servgo-unified-fixed-20261031]
    paths:
      - 'scripts/deploy_servgo_frontend_atomic.py'
      - 'tests/test_servgo_frontend_atomic.py'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/servgo-frontend-preflight.yml'
permissions:
  contents: read
concurrency:
  group: servgo-frontend-readonly-preflight
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
      APPLY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Build the actual candidate frontend
        working-directory: web/frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preflight dependencies
        run: python -m pip install 'paramiko==3.5.1' 'pytest>=8,<9'
      - name: Validate release script safety
        run: python -m pytest -q tests/test_servgo_frontend_atomic.py
      - name: Inspect live layout and dependent API without changes
        run: python scripts/deploy_servgo_frontend_atomic.py
