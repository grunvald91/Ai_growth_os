name: Preflight foreign relay 89 without changing it
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
      RELAY_PASSWORD: ${{ secrets.RELAY89_SSH_PASSWORD }}
    steps:
      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Compare relay host keys then run read-only checks
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, logging, os, shlex, socket, time
          import paramiko
          logging.getLogger('paramiko').setLevel(logging.CRITICAL)
          IP='89.125.90.101'
          SERVGO_IP='155.212.162.47'
          SERVGO_FP='uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'
          if not os.environ.get('SERVGO_PASSWORD') or not os.environ.get('RELAY_PASSWORD'):
              raise RuntimeError('Required GitHub Actions secrets are not both configured')
          class PinnedServGo(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self, client, hostname, key):
                  fp=base64.b64encode(hashlib.sha256(key.asbytes()).digest()).decode().rstrip('=')
                  if fp!=SERVGO_FP:raise paramiko.SSHException('ServGo host key mismatch')
                  client.get_host_keys().add(hostname,key.get_name(),key)
          servgo=None
          for attempt in range(3):
              c=paramiko.SSHClient();c.set_missing_host_key_policy(PinnedServGo())
              try:
                  c.connect(SERVGO_IP,username='root',password=os.environ['SERVGO_PASSWORD'],port=22,
                            look_for_keys=False,allow_agent=False,timeout=12,banner_timeout=25,auth_timeout=15)
                  servgo=c;break
              except (paramiko.SSHException,OSError,EOFError):
                  c.close()
                  if attempt==2:raise RuntimeError('ServGo unavailable') from None
                  time.sleep(3)
          try:
              _,out,err=servgo.exec_command('ssh-keyscan -4 -T 7 -t ed25519 -p 22 89.125.90.101',timeout=12)
              scan=out.read().decode('ascii','replace').strip().splitlines()
              if out.channel.recv_exit_status()!=0 or len(scan)!=1 or len(scan[0].split())!=3 or scan[0].split()[1]!='ssh-ed25519':
                  raise RuntimeError('ServGo-to-relay SSH host-key probe failed')
              servgo_key=base64.b64decode(scan[0].split()[2],validate=True)
              source_probe="import importlib.util,importlib.metadata,subprocess,pathlib; p=subprocess.run(['ip','-4','route','get','89.125.90.101'],capture_output=True,text=True,timeout=5); print('route_to_89='+p.stdout.strip() if p.returncode==0 else 'route_to_89=unavailable'); print('aiogram_version='+importlib.metadata.version('aiogram')); print('aiohttp_socks_present='+str(importlib.util.find_spec('aiohttp_socks') is not None)); print('dedicated_ssh_key_present='+str(pathlib.Path('/root/.ssh/servgo_89_ed25519').is_file()))"
              _,probe_out,probe_err=servgo.exec_command('/opt/booking_bot/venv/bin/python -c '+shlex.quote(source_probe),timeout=15)
              source_result=probe_out.read().decode('utf-8','replace')
              if probe_out.channel.recv_exit_status():raise RuntimeError('ServGo route prerequisites unavailable')
              print(source_result)
              state_probe="import pathlib,subprocess; names={'known_hosts':'/etc/booking-bot-relay89/known_hosts','known_hosts_tmp':'/etc/booking-bot-relay89/known_hosts.tmp','relay_unit':'/etc/systemd/system/booking-bot-relay89.service'}; [print(n+'_exists='+str(pathlib.Path(p).exists())+' size='+str(pathlib.Path(p).stat().st_size if pathlib.Path(p).exists() else 0)) for n,p in names.items()]; [print(u+'_'+a+'='+subprocess.run(['systemctl',a,u],capture_output=True,text=True,timeout=5).stdout.strip()) for u in ('booking-bot-relay89.service','booking-bot.service') for a in ('is-active','is-enabled')]; s=subprocess.run(['ss','-lnt'],capture_output=True,text=True,timeout=5); print('socks_listener='+str('127.0.0.1:1089' in s.stdout))"
              _,state_out,state_err=servgo.exec_command('/opt/booking_bot/venv/bin/python -c '+shlex.quote(state_probe),timeout=20)
              state_body=state_out.read().decode('utf-8','replace')
              if state_out.channel.recv_exit_status():raise RuntimeError('ServGo relay state inspection failed')
              print(state_body)
              code_probe="import pathlib,hashlib,subprocess; p=pathlib.Path('/opt/booking_bot/bot/main.py'); print('production_main_sha256='+hashlib.sha256(p.read_bytes()).hexdigest()); print('production_transport_file_present='+str(pathlib.Path('/opt/booking_bot/bot/telegram_transport.py').exists())); [print('bot_'+k+'='+subprocess.run(['systemctl','show','booking-bot.service','--value','-p',k],capture_output=True,text=True,timeout=5).stdout.strip()) for k in ('User','WorkingDirectory','DropInPaths')]; p=subprocess.run(['curl','-4','-sS','--proxy','socks5h://127.0.0.1:1089','--noproxy','','--max-time','12','-o','/dev/null','-w','%{http_code}','https://api.telegram.org/'],capture_output=True,text=True,timeout=15); print('socks_telegram_http='+p.stdout.strip()+' curl_exit='+str(p.returncode))"
              _,code_out,code_err=servgo.exec_command('/opt/booking_bot/venv/bin/python -c '+shlex.quote(code_probe),timeout=25)
              code_body=code_out.read().decode('utf-8','replace')
              if code_out.channel.recv_exit_status():raise RuntimeError('Production bot source inspection failed')
              print(code_body)
          finally:servgo.close()
          sock=socket.create_connection((IP,22),timeout=8)
          transport=paramiko.Transport(sock)
          transport.get_security_options().key_types=['ssh-ed25519']
          try:
              transport.start_client(timeout=8)
              key=transport.get_remote_server_key()
              if key.get_name()!='ssh-ed25519' or key.asbytes()!=servgo_key:
                  raise RuntimeError('Relay host keys disagree across two paths; no login attempted')
          finally:transport.close()
          fp=base64.b64encode(hashlib.sha256(key.asbytes()).digest()).decode().rstrip('=')
          print('relay_ssh_host_key_matches_two_paths=yes; sha256='+fp,flush=True)
          client=paramiko.SSHClient()
          client.get_host_keys().add(IP,key.get_name(),key)
          client.set_missing_host_key_policy(paramiko.RejectPolicy())
          try:
              try:
                  client.connect(IP,username='root',password=os.environ['RELAY_PASSWORD'],port=22,
                                 look_for_keys=False,allow_agent=False,timeout=8,banner_timeout=15,auth_timeout=10)
              except Exception as exc:
                  raise RuntimeError('Single relay authentication attempt failed: '+type(exc).__name__) from None
              # No writes, restarts, firewall changes, or queries to the blocked 188 server.
              command="python3 -c 'import subprocess; p=subprocess.run([\"curl\",\"-4\",\"-sS\",\"--noproxy\",\"*\",\"--connect-timeout\",\"4\",\"--max-time\",\"8\",\"-o\",\"/dev/null\",\"-w\",\"%{http_code}\",\"https://api.telegram.org/\"],capture_output=True,text=True,timeout=12); print(\"relay_telegram_api_http=\"+p.stdout.strip()+\" curl_exit=\"+str(p.returncode)); s=subprocess.run([\"ss\",\"-lnt\"],capture_output=True,text=True,timeout=5); print(\"relevant_listeners=\"+\",\".join(x.split()[3] for x in s.stdout.splitlines() if len(x.split())>3 and any(x.split()[3].endswith(\":\"+str(n)) for n in (443,3128,1080,7890,8080))))'"
              _,out,err=client.exec_command(command,timeout=22)
              body=out.read().decode('utf-8','replace')
              if out.channel.recv_exit_status():raise RuntimeError('Relay read-only check failed')
              print('relay_authenticated=yes')
              print(body)
              relay_probe="import subprocess,pathlib; p=subprocess.run(['/usr/sbin/sshd','-T','-C','user=root,host=89.125.90.101,addr=155.212.162.47'],capture_output=True,text=True,timeout=7); print('sshd_check_exit='+str(p.returncode)); print('sshd_settings='+','.join(x for x in p.stdout.splitlines() if x.split(' ',1)[0] in ('permitrootlogin','allowtcpforwarding','pubkeyauthentication','authorizedkeysfile'))); path=pathlib.Path('/root/.ssh/authorized_keys'); print('authorized_keys_present='+str(path.is_file()))"
              _,check_out,check_err=client.exec_command('python3 -c '+shlex.quote(relay_probe),timeout=12)
              check_body=check_out.read().decode('utf-8','replace')
              if check_out.channel.recv_exit_status():raise RuntimeError('Relay SSH setting inspection failed')
              print(check_body)
              key_probe="import pathlib; p=pathlib.Path('/root/.ssh/authorized_keys'); lines=p.read_text().splitlines() if p.is_file() else []; matching=[line for line in lines if line.endswith(' servgo-bot-egress-89')]; print('restricted_key_count='+str(len(matching))); print('restricted_key_scoped='+str(len(matching)==1 and matching[0].startswith('from=\"155.212.162.47\",restrict,port-forwarding,permitopen=\"api.telegram.org:443\" ssh-ed25519 ')))"
              _,key_out,key_err=client.exec_command('python3 -c '+shlex.quote(key_probe),timeout=12)
              key_body=key_out.read().decode('utf-8','replace')
              if key_out.channel.recv_exit_status():raise RuntimeError('Relay key inspection failed')
              print(key_body)
          finally:client.close()
          PY
