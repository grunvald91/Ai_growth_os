name: Inspect bot relay rollback and redacted traceback
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Read only source hashes, service state and exception classes
        run: python scripts/inspect_bot_relay_polling.py
