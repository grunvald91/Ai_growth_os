name: Guarded insights API release tests

on:
  pull_request:
    paths:
      - 'scripts/servgo_insights_api_release.py'
      - 'tests/test_servgo_insights_api_release.py'
      - '.github/workflows/servgo-insights-release-ci.yml'

permissions:
  contents: read

concurrency:
  group: insights-release-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only the release guard dependencies
        run: python -m pip install 'pytest>=8,<9' 'paramiko==3.5.1' 'PyYAML>=6,<7'
      - name: Validate release script and safe preflight tests
        run: |
          python -m py_compile scripts/servgo_insights_api_release.py
          python -m pytest -q tests/test_servgo_insights_api_release.py
          git diff --check HEAD^ HEAD
