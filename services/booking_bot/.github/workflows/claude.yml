name: Claude Code — ServGo

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, edited]

jobs:
  claude:
    if: github.actor == 'grunvald91'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    env:
      ANTHROPIC_BASE_URL: https://api.claudehub.fun
    outputs:
      branch_name: ${{ steps.claude.outputs.branch_name }}

    steps:
      - name: Verify ClaudeHub API secret
        env:
          CLAUDEHUB_API_KEY: ${{ secrets.API }}
        run: |
          if [ -z "$CLAUDEHUB_API_KEY" ]; then
            echo "::error::Repository Actions secret 'API' is missing or unavailable."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.API }}
          github_token: ${{ github.token }}
          trigger_phrase: "@claude"
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools Edit,Read,Write,Bash

  finalize:
    name: Open PR and dispatch CI
    needs: claude
    if: >-
      needs.claude.result == 'success' &&
      needs.claude.outputs.branch_name != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      CLAUDE_BRANCH: ${{ needs.claude.outputs.branch_name }}
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}

    steps:
      - name: Resolve or create pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail

          PR_NUMBER=""
          ISSUE_NUMBER=""
          ISSUE_TITLE="Claude Code change"

          case "$EVENT_NAME" in
            issues)
              ISSUE_NUMBER="$(jq -r '.issue.number // empty' "$GITHUB_EVENT_PATH")"
              ISSUE_TITLE="$(jq -r '.issue.title // "Claude Code change"' "$GITHUB_EVENT_PATH")"
              ;;
            issue_comment)
              if jq -e '.issue.pull_request != null' "$GITHUB_EVENT_PATH" >/dev/null; then
                PR_NUMBER="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
              else
                ISSUE_NUMBER="$(jq -r '.issue.number // empty' "$GITHUB_EVENT_PATH")"
                ISSUE_TITLE="$(jq -r '.issue.title // "Claude Code change"' "$GITHUB_EVENT_PATH")"
              fi
              ;;
            pull_request_review_comment|pull_request_review)
              PR_NUMBER="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")"
              ;;
          esac

          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(gh pr list \
              --repo "$REPOSITORY" \
              --head "$CLAUDE_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty')"
          fi

          if [ -z "$PR_NUMBER" ]; then
            if [ -z "$ISSUE_NUMBER" ]; then
              echo "::error::Could not resolve an issue or pull request for branch $CLAUDE_BRANCH."
              exit 1
            fi

            BODY_FILE="$(mktemp)"
            {
              printf 'Automated implementation for #%s.\n\n' "$ISSUE_NUMBER"
              printf 'Created by the ServGo Claude Code workflow.\n\n'
              printf 'Closes #%s.\n' "$ISSUE_NUMBER"
            } > "$BODY_FILE"

            PR_URL="$(gh pr create \
              --repo "$REPOSITORY" \
              --head "$CLAUDE_BRANCH" \
              --base "${{ github.event.repository.default_branch }}" \
              --title "$ISSUE_TITLE" \
              --body-file "$BODY_FILE")"
            PR_NUMBER="$(gh pr view "$PR_URL" --repo "$REPOSITORY" --json number --jq '.number')"
          fi

          PR_HEAD="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefName --jq '.headRefName')"
          if [ "$PR_HEAD" != "$CLAUDE_BRANCH" ]; then
            echo "::error::Resolved PR #$PR_NUMBER uses branch $PR_HEAD, expected $CLAUDE_BRANCH."
            exit 1
          fi

          HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid --jq '.headRefOid')"
          BASE_SHA="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json baseRefOid --jq '.baseRefOid')"

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Dispatch independent PR CI
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          gh workflow run pr-ci.yml \
            --repo "$REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f pr_number="$PR_NUMBER" \
            -f expected_sha="$HEAD_SHA" \
            -f base_sha="$BASE_SHA"
