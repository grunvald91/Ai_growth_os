name: Install dynamic sitemap generator on ServGo server

# Ставит scripts/ops/servgo_sitemap.py на сервер и cron, который раз в час
# пересобирает dist/sitemap.xml из живого списка бизнесов (локальный API).
# Запускается только при изменении генератора или этого файла, либо вручную.
# Дальше sitemap обновляется на сервере сам — минуты Actions не тратятся.
# Откат: rm /etc/cron.d/servgo-sitemap (статичный sitemap.xml останется как есть).

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ops/servgo_sitemap.py'
      - '.github/workflows/servgo-sitemap-install.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Paramiko
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Upload generator, install hourly cron, generate and verify
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, pathlib, time
          import paramiko

          SOURCE = 'scripts/ops/servgo_sitemap.py'
          DEST = '/opt/booking_bot/scripts/ops/servgo_sitemap.py'
          CRON = '/etc/cron.d/servgo-sitemap'
          EXPECTED = 'uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU'

          class Pinned(paramiko.MissingHostKeyPolicy):
              def missing_host_key(self, client, hostname, key):
                  actual = base64.b64encode(hashlib.sha256(key.asbytes()).digest()).decode().rstrip('=')
                  if actual != EXPECTED:
                      raise paramiko.SSHException('Host key mismatch')
                  client.get_host_keys().add(hostname, key.get_name(), key)

          if not os.environ.get('SERVER_PASSWORD'):
              raise RuntimeError('SSH secret unavailable')
          data = pathlib.Path(SOURCE).read_bytes()

          ssh = None
          for attempt in range(3):
              conn = paramiko.SSHClient()
              conn.set_missing_host_key_policy(Pinned())
              try:
                  conn.connect('155.212.162.47', username='root', port=22,
                               password=os.environ['SERVER_PASSWORD'], look_for_keys=False, allow_agent=False,
                               timeout=12, banner_timeout=25, auth_timeout=15)
                  ssh = conn
                  break
              except (paramiko.SSHException, OSError, EOFError):
                  conn.close()
                  if attempt == 2:
                      raise
                  time.sleep(3)

          def run(cmd, timeout=60):
              _, out, err = ssh.exec_command(cmd, timeout=timeout)
              body = out.read().decode(errors='replace')
              status = out.channel.recv_exit_status()
              return status, body, err.read().decode(errors='replace')

          try:
              status, py, _ = run('command -v python3')
              py = py.strip()
              if status or not py:
                  raise RuntimeError('python3 not found on server')
              print('server_python=' + py)

              run('mkdir -p /opt/booking_bot/scripts/ops')
              temp = DEST + '.tmp.' + str(int(time.time()))
              sftp = ssh.open_sftp()
              sftp.put(SOURCE, temp)
              with sftp.open(temp, 'rb') as f:
                  uploaded = f.read()
              if hashlib.sha256(uploaded).digest() != hashlib.sha256(data).digest():
                  sftp.remove(temp)
                  raise RuntimeError('Uploaded generator checksum mismatch')
              sftp.chmod(temp, 0o755)
              sftp.close()
              status, _, err = run(f"mv -f '{temp}' '{DEST}'")
              if status:
                  raise RuntimeError('Could not place generator: ' + err)
              print('generator_installed=yes; sha256=' + hashlib.sha256(data).hexdigest())

              cron_body = (
                  'SHELL=/bin/sh\n'
                  'PATH=/usr/sbin:/usr/bin:/sbin:/bin\n'
                  f'7 * * * * root {py} {DEST} >> /var/log/servgo-sitemap.log 2>&1\n'
              )
              sftp = ssh.open_sftp()
              with sftp.open(CRON + '.tmp', 'w') as f:
                  f.write(cron_body)
              sftp.chmod(CRON + '.tmp', 0o644)
              sftp.close()
              status, _, err = run(f'mv -f {CRON}.tmp {CRON}')
              if status:
                  raise RuntimeError('Could not install cron: ' + err)
              _, state, _ = run('systemctl is-active cron 2>/dev/null || systemctl is-active crond 2>/dev/null || true')
              print('cron_installed=hourly; cron_service=' + (state.strip() or 'unknown'))

              status, out, err = run(f'{py} {DEST}')
              print((out or err).strip())
              if status:
                  raise RuntimeError('Generator run failed')

              status, body, _ = run('curl -kfsS --max-time 15 --resolve servgo.ru:443:127.0.0.1 https://servgo.ru/sitemap.xml')
              if status or '<urlset' not in body or '/business/' not in body:
                  raise RuntimeError('Public sitemap verification failed')
              print('public_sitemap_urls=' + str(body.count('<loc>')))
          finally:
              ssh.close()
          PY
