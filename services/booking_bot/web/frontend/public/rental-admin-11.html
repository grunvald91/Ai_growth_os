<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявки 100boats ДЕМО — ServGo</title><style>body{font:16px system-ui,sans-serif;background:#101827;color:#eef3ff;max-width:850px;margin:24px auto;padding:16px}a{color:#84c8ff}article{background:#1b293e;border:1px solid #334964;border-radius:14px;padding:18px;margin:14px 0}input,button{font:inherit;padding:10px;border:1px solid #7186a0;border-radius:8px;margin:4px;background:#fff;color:#17263b}input[type=number]{width:140px}button{cursor:pointer;background:#8ce3cb}button:disabled{opacity:.5;cursor:default}.error{color:#ffa9a9}small{color:#b8c9dd}#message{min-height:1.5em}</style></head><body><a href="/admin/schedule">← Расписание ServGo</a><h1>Заявки яхт — 100boats ДЕМО</h1><p>Войдите как владелец бизнеса в ServGo. Здесь можно утвердить цену и предоплату, затем подтвердить либо отменить заявку. Платежи не выполняются.</p><label>Начало периода <input type="date" id="from"></label><label>Конец периода <input type="date" id="to"></label><button id="refresh">Загрузить</button><p id="message" role="status"></p><main id="results"></main><script>
const $=id=>document.getElementById(id), token=localStorage.getItem('token');
const fmt=n=>Number(n).toLocaleString('ru-RU')+' ₽';
const d=new Date();$('from').value=d.toISOString().slice(0,10);d.setDate(d.getDate()+30);$('to').value=d.toISOString().slice(0,10);
async function call(path,method='GET',body){const r=await fetch('/api'+path,{method,headers:{'Authorization':'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'Ошибка API '+r.status);return data}
async function load(){const main=$('results');main.replaceChildren();$('message').textContent='Загрузка…';if(!token){$('message').textContent='Войдите в панель ServGo и откройте эту страницу снова.';return}try{const list=await call('/admin/bookings?business_id=11&start_date='+encodeURIComponent($('from').value)+'&end_date='+encodeURIComponent($('to').value));const rentals=list.filter(b=>b.is_rental);$('message').textContent=rentals.length?'Заявок: '+rentals.length:'Заявок за этот период нет.';for(const b of rentals){const card=document.createElement('article');const header=document.createElement('h2');header.textContent='Заявка №'+b.id+' · '+b.employee_name+' · '+b.date+' '+b.time;card.append(header);const p=document.createElement('p');p.textContent=b.client_name+' · '+b.client_phone+' · '+Math.round(b.service_duration/60)+' ч · статус: '+b.status;card.append(p);const notes=document.createElement('p');notes.style.whiteSpace='pre-wrap';notes.textContent=b.notes||'';card.append(notes);const price=document.createElement('label');price.textContent='Итоговая цена, ₽ ';const value=document.createElement('input');value.type='number';value.min='0';value.step='1';value.value=b.price==null?'':String(b.price);price.append(value);card.append(price);const deposit=document.createElement('label');deposit.textContent='Предоплата, ₽ (до 20%) ';const amount=document.createElement('input');amount.type='number';amount.min='0';amount.step='1';amount.value=b.prepayment_amount==null?'0':String(b.prepayment_amount);deposit.append(amount);card.append(deposit);const info=document.createElement('p');info.textContent=b.price_requires_confirmation?'Цена требует согласования менеджером.':'Предварительно: '+(b.price==null?'по согласованию':fmt(b.price))+'. Размер предоплаты подтверждается отдельно.';card.append(info);if(b.status!=='cancelled'&&b.status!=='completed'){const save=document.createElement('button');save.textContent='Сохранить цену и предоплату';save.onclick=()=>run(async()=>{const p=Number(value.value),a=Number(amount.value);if(value.value===''||!Number.isInteger(p)||p<0||!Number.isInteger(a)||a<0||a>p*.2)throw Error('Укажите целую стоимость и предоплату не выше 20%.');await call('/admin/rental/bookings/'+b.id+'/quote','PATCH',{estimated_price:p,prepayment_amount:a})});card.append(save);if(b.status==='pending'){const confirm=document.createElement('button');confirm.textContent='Подтвердить';confirm.onclick=()=>run(()=>call('/admin/bookings/'+b.id+'/status','PATCH',{status:'confirmed'}));card.append(confirm)}const cancel=document.createElement('button');cancel.textContent='Отменить';cancel.onclick=()=>{if(window.confirm('Отменить заявку №'+b.id+'?'))run(()=>call('/admin/bookings/'+b.id+'/status','PATCH',{status:'cancelled'}))};card.append(cancel)}main.append(card)}}catch(e){$('message').textContent=e.message;$('message').className='error'}}
async function run(fn){$('message').textContent='Сохраняю…';try{await fn();await load()}catch(e){$('message').textContent=e.message;$('message').className='error'}}
$('refresh').onclick=load;load();
</script></body></html>
