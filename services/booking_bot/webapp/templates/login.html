<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вход для владельцев · ServGo</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/static/favicon.svg?v=2">
    <style>
        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --hint: #999999;
            --accent: #2481cc;
            --accent-hover: #1d6fb0;
            --error: #e53935;
            --border: #e0e0e0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --card-bg: #2a2a2a;
                --text: #ffffff;
                --hint: #888888;
                --border: #3a3a3a;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--hint);
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--hint);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        .error-msg {
            color: var(--error);
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }

        .error-msg.visible {
            display: block;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover { background: var(--accent-hover); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .login-help {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--hint);
            text-align: center;
            line-height: 1.5;
        }

        .nav-links {
            margin-top: 16px;
            text-align: center;
        }

        .nav-links a {
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-title">CityService</div>
        <div class="login-subtitle">Вход для владельцев бизнеса</div>

        <form id="loginForm" onsubmit="doLogin(event)">
            <div class="form-group">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" placeholder="+7 (999) 123-45-67" required autocomplete="tel">
            </div>
            <div class="form-group">
                <label for="pin">PIN-код</label>
                <input type="text" id="pin" placeholder="6-значный код" maxlength="6" inputmode="numeric" required autocomplete="off">
            </div>
            <div class="error-msg" id="errorMsg"></div>
            <button type="submit" class="login-btn" id="loginBtn">Войти</button>
        </form>

        <div class="login-help">
            PIN-код можно получить в Telegram-боте<br>
            командой /weblogin
        </div>

        <div class="nav-links">
            <a href="https://servgo.ru/">Записаться как клиент</a>
        </div>
    </div>

    <script>
        // Check if already logged in
        fetch('/api/auth/check').then(r => {
            if (r.ok) window.location.href = '/schedule';
        });

        // Show error from URL params
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === 'invalid_token') {
            showError('Недействительная ссылка для входа');
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('visible');
        }

        async function doLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const phone = document.getElementById('phone').value.trim();
            const pin = document.getElementById('pin').value.trim();

            btn.disabled = true;
            btn.textContent = 'Вход...';
            document.getElementById('errorMsg').classList.remove('visible');

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ phone, pin })
                });

                const data = await resp.json();

                if (resp.ok && data.success) {
                    const redirectTo = urlParams.get('to') || '/schedule';
                    window.location.href = redirectTo;
                } else {
                    showError(data.error || 'Ошибка входа');
                }
            } catch (err) {
                showError('Ошибка сети');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Войти';
            }
        }
    </script>
</body>
</html>
