<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Календарь записей · ServGo</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/static/favicon.svg?v=2">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/calendar.css">
    <style>
        /* Fallback styles in case CSS doesn't load */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: #000;
            margin: 0;
            padding: 16px;
        }
        .init-message {
            text-align: center;
            padding: 40px 20px;
        }
        .init-message h2 {
            margin-bottom: 16px;
        }
        .debug-info {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 12px;
            text-align: left;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Initial loading message (will be replaced by JS) -->
        <div class="init-message" id="initMessage">
            <h2>Загрузка календаря...</h2>
            <p>Если это сообщение не исчезает, возможна проблема с загрузкой.</p>
            <div class="debug-info" id="debugInfo">
                <div>Проверка...</div>
            </div>
        </div>

        <!-- Header (hidden until loaded) -->
        <header class="header" id="mainContent" style="display: none;">
            <div class="header-content">
                <button class="nav-btn" id="prevMonth">&lt;</button>
                <h1 class="month-title" id="monthTitle">Январь 2025</h1>
                <button class="nav-btn" id="nextMonth">&gt;</button>
            </div>
            <div class="header-actions">
                <button class="today-btn" id="todayBtn">Сегодня</button>
                <select class="master-filter" id="masterFilter">
                    <option value="">Все мастера</option>
                </select>
            </div>
        </header>

        <!-- Calendar -->
        <div class="calendar-container" id="calendarContainer" style="display: none;">
            <div class="weekdays">
                <div class="weekday">Пн</div>
                <div class="weekday">Вт</div>
                <div class="weekday">Ср</div>
                <div class="weekday">Чт</div>
                <div class="weekday">Пт</div>
                <div class="weekday weekend">Сб</div>
                <div class="weekday weekend">Вс</div>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- Days will be rendered here -->
            </div>
        </div>

        <!-- Day view modal -->
        <div class="modal" id="dayModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title" id="dayModalTitle">Записи на 1 января</h2>
                    <button class="close-btn" id="closeDayModal">&times;</button>
                </div>
                <div class="modal-body" id="dayBookingsList">
                    <!-- Bookings list -->
                </div>
            </div>
        </div>

        <!-- Booking details modal -->
        <div class="modal" id="bookingModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title">Детали записи</h2>
                    <button class="close-btn" id="closeBookingModal">&times;</button>
                </div>
                <div class="modal-body" id="bookingDetails">
                    <!-- Booking details -->
                </div>
                <div class="modal-footer" id="bookingActions">
                    <!-- Action buttons -->
                </div>
            </div>
        </div>

        <!-- Loading overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        // Early debug info
        const debugInfo = document.getElementById('debugInfo');
        function addDebug(text) {
            debugInfo.innerHTML += '<div>' + text + '</div>';
        }

        addDebug('Page loaded: ' + new Date().toLocaleTimeString());
        addDebug('Location: ' + window.location.href);

        // Check Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            addDebug('Telegram WebApp: OK');
            addDebug('Version: ' + tg.version);
            addDebug('Platform: ' + tg.platform);
            addDebug('initData length: ' + (tg.initData ? tg.initData.length : 0));
            addDebug('initDataUnsafe: ' + JSON.stringify(tg.initDataUnsafe || {}));

            if (!tg.initData) {
                addDebug('WARNING: initData is empty!');
            }
        } else {
            addDebug('ERROR: Telegram WebApp not loaded!');
        }
    </script>
    <script src="/static/js/calendar.js"></script>
</body>
</html>
