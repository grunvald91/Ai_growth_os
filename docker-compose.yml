services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_growth
      POSTGRES_USER: ai_growth
      POSTGRES_PASSWORD: ai_growth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_growth -d ai_growth"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ai_growth:ai_growth@postgres:5432/ai_growth
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
