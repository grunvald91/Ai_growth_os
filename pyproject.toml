[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-growth-os"
version = "0.1.0"
description = "Safe, auditable AI growth operating system"
requires-python = ">=3.12"
dependencies = [
  "passlib>=1.7.4,<2",
  "defusedxml>=0.7,<1",
  "pypdf>=6,<7",
  "openpyxl>=3.1,<4",
  "xlrd>=2,<3",
  "Pillow>=11,<13",
  "cryptography>=44,<48",
  "alembic>=1.13,<2",
  "anthropic>=0.40,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.18,<1",
  "pydantic-settings>=2.6,<3",
  "jsonschema>=4.23,<5",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "httpx2>=2,<3",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
