.shell{max-width:none}
.sidebar{overflow-y:auto;scrollbar-width:thin}
.nav-label{padding-top:16px}

function analytics(){return head('Аналитика','Важное для бизнеса','Без перегруженных отчётов. Сначала вывод, затем подробности.',`<button class="btn ghost" data-open="analytics-info">${icon('info')} Об источниках</button>`)+`<div class="kpi-grid">${[['Выручка','24 300 ₽','Пример'],['Загрузка','82%','Пример'],['Свободные окна','3','Пример']].map(([a,b,c])=>`<div class="kpi surface"><div class="kpi-label">${a}</div><div class="kpi-figure">${b}</div><div class="kpi-bottom">${c} · из демонстрационного профиля</div></div>`).join('')}</div><div class="chart-card surface"><div class="split mb14"><div><h2>Загрузка по дням</h2><p class="subline">Иллюстративные значения, не реальные данные</p></div><span class="chip blue">Неделя</span></div><div class="chart-grid">${[['Пн',68],['Вт',43],['Ср',71],['Чт',82],['Пт',93],['Сб',86],['Вс',61]].map(([label,n])=>`<div class="bar-wrap"><div class="bar" style="--h:${n}%" title="${n}%"></div><small>${label}</small></div>`).join('')}</div></div><div class="soft panel-pad mt14"><b>Вывод команды · пример</b><p class="subline">Сначала стоит проверить дни с низкой загрузкой. После подключения реальных данных выводы будут иметь ссылки на исходные показатели.</p><button class="link mt14" data-command="Предложи план заполнения пустых окон">Предложить действие ${icon('arrow','sm')}</button></div>`}
function renderRail(){const home=state.page==='home';const seo=state.page==='seo';document.getElementById('rail').innerHTML=`<div class="rail-head"><h2>${seo?'Контекст SEO':home?'Ваш помощник':'Контекст задачи'}</h2><span>ServGo AI</span></div><div class="assistant-box"><div class="assistant-avatar">${icon('spark','lg')}</div><h3>${seo?'SEO-завод под контролем':'Добро пожаловать в Growth'}</h3><p>${seo?'Контролируйте этапы и проверку качества. Автопубликация требует подтверждённого заключения критика.':'Можно сказать обычными словами, что вы хотите сделать. Помощник покажет результат и предложит следующий шаг.'}</p><button class="btn blue sm" data-open="assistant">${icon('mic','sm')} Поговорить с помощником</button></div><div class="rail-card"><div class="split"><h3>${seo?'О проверке контента':'Сегодня в фокусе'}</h3><span class="chip blue">Демо</span></div><div class="rail-list">${seo?`<div class="rail-line"><div class="rail-icon">${icon('search','sm')}</div><div><b>Запросы из подсказок</b><p>Без выдуманной частотности</p></div></div><div class="rail-line"><div class="rail-icon">${icon('shield','sm')}</div><div><b>Заключение критика</b><p>Проверяем итоговую версию</p></div></div><div class="rail-line"><div class="rail-icon">${icon('globe','sm')}</div><div><b>Публикация в блог</b><p>Только после допуска</p></div></div>`:`<div class="rail-line"><div class="rail-icon">${icon('pen','sm')}</div><div><b>Проверить материал</b><p>Пост ждёт вашего решения</p></div></div><div class="rail-line"><div class="rail-icon">${icon('clock','sm')}</div><div><b>Свободные окна</b><p>3 интервала в примере расписания</p></div></div><div class="rail-line"><div class="rail-icon">${icon('globe','sm')}</div><div><b>SEO-завод</b><p>Подготовьте поисковую стратегию</p></div></div>`}</div></div><div class="rail-card"><div class="split"><h3>Что дальше?</h3>${icon('spark','sm')}</div><p class="desc">Конкретные действия вместо десятков настроек.</p><div class="stack mt14" style="gap:8px"><button class="btn ghost sm" data-page="${seo?'materials':'seo'}">${seo?'Просмотреть материалы':'Открыть SEO-завод'} ${icon('arrow','sm')}</button><button class="btn ghost sm" data-page="work">Посмотреть задания ${icon('arrow','sm')}</button></div></div><p class="rail-footer">Концепт интерфейса. Реальные действия и подключение к серверу не выполняются.</p>`}
function render(){document.body.classList.toggle('dark',state.theme==='dark');renderNav();document.getElementById('crumbTitle').textContent=tabs.find(t=>t[0]===state.page)?.[1]||'Главная';document.getElementById('main').innerHTML=({home,seo,work,materials,create,analytics}[state.page]||home)();renderRail();}
function openModal(title,html,actions=''){document.getElementById('modalHost').innerHTML=`<div class="overlay" id="overlay" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="modal-head"><h2>${escapeHtml(title)}</h2><button class="close" data-close aria-label="Закрыть">${icon('close','sm')}</button></div>${html}${actions?`<div class="modal-actions">${actions}</div>`:''}</section></div>`;const f=document.querySelector('.modal button,.modal input');if(f)f.focus()}
function closeModal(){document.getElementById('modalHost').innerHTML=''}
function inspectTask(id){const task=state.tasks.find(t=>t.id==id);if(!task)return;openModal(task.title,`<div class="row mb14">${statusBadge(task.status)}<span class="chip">${escapeHtml(task.group)}</span></div><p>${escapeHtml(task.detail)}</p><div class="soft panel-pad"><b style="font-size:11px">Что можно сделать</b><p>В прототипе статус изменяется только локально, серверных операций нет.</p></div>`,`<button class="btn ghost" data-close>Закрыть</button>${task.status==='review'?`<button class="btn danger" data-update-task="${id}:work">На доработку</button><button class="btn blue" data-update-task="${id}:approved">Утвердить · демо</button>`:`<button class="btn blue" data-update-task="${id}:review">Отправить на проверку · демо</button>`}`)}
function showMaterial(id){const m=state.materials.find(x=>x.id==id);if(!m)return;openModal(m.title,`<div class="row">${statusBadge(m.status)}<span class="chip">${escapeHtml(m.type)}</span></div><p>${escapeHtml(m.description)}</p><div class="soft panel-pad"><b style="font-size:12px">Предпросмотр · демо</b><p>Здесь появится подготовленный материал, его версии, замечания критика и действия по согласованию. Текст статьи не генерируется при открытии макета.</p></div>`,`<button class="btn ghost" data-close>Закрыть</button><button class="btn blue" data-markmaterial="${id}">Пометить готовым · демо</button>`)}
let seoTimer=null;function startSeoDemo(){if(seoTimer){clearInterval(seoTimer)}state.seoActive=true;state.seoIndex=0;state.selectedStage=0;state.seoTab='pipeline';render();toast('Демонстрация конвейера: серверные задания не запускаются');seoTimer=setInterval(()=>{if(state.seoIndex>=5){clearInterval(seoTimer);seoTimer=null;state.seoActive=false;render();toast('Демонстрационный цикл завершён. Ничего не опубликовано.');return}state.seoIndex++;state.selectedStage=state.seoIndex;if(state.page==='seo')render()},1700)}
function sendCommand(raw){const q=String(raw||'').trim();if(!q){toast('Напишите или произнесите задачу');return}if(/seo|сео|поиск|стат|блог/i.test(q)){go('seo');state.voiceReply='Открываю SEO-завод. Реальную генерацию можно будет запускать после подключения backend и подтверждения затрат.';render();toast('Открыт SEO-завод · демонстрация');return}if(/пост|контент|видео|созда|подготов/i.test(q)){go('create');document.getElementById('taskTopic').value=q;toast('Задача перенесена в форму создания · демо');return}if(/решени|провер|работ|задан/i.test(q)){go('work');toast('Открыты задачи команды · демо');return}state.voiceReply=`Вы сказали: «${q}». Это UI-прототип: для выполнения команд нужно подключить голосового диспетчера ServGo.`;render();toast('Команда показана в демо-режиме')}
let recognizer;function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){openModal('Голосовой ввод',`<p>В этом браузере распознавание речи не поддерживается или недоступно при локальном открытии файла. Можно вводить команды текстом.</p><div class="field"><label>Задача</label><input id="voiceFallback" placeholder="Например: сделай пост"/></div>`,`<button class="btn ghost" data-close>Закрыть</button><button class="btn blue" data-action="send-fallback">Отправить</button>`);return}if(state.voice&&recognizer){recognizer.stop();return}try{recognizer=new SR();recognizer.lang='ru-RU';recognizer.interimResults=false;recognizer.continuous=false;recognizer.onstart=()=>{state.voice=true;document.querySelector('#micBtn')?.classList.add('listening');document.querySelector('.wave')?.classList.add('active')};recognizer.onend=()=>{state.voice=false;document.querySelector('#micBtn')?.classList.remove('listening');document.querySelector('.wave')?.classList.remove('active')};recognizer.onresult=e=>{const t=e.results[0][0].transcript;sendCommand(t)};recognizer.onerror=e=>toast('Не получилось распознать речь: '+e.error);recognizer.start();}catch(e){toast('Голосовой ввод недоступен в этом браузере')}}
function handleAction(a,el){if(a==='seo-start'){startSeoDemo();return}if(a==='next-stage'){state.selectedStage=(state.selectedStage+1)%6;render();return}if(a==='create-task'){let field=document.getElementById('taskTopic');let title=field?.value?.trim();if(!title){field?.focus();toast('Добавьте тему или описание задачи');return}const id=Date.now();state.tasks.unshift({id,title:`${state.format}: ${title}`,status:'work',group:state.format,detail:`Пример локальной задачи для площадки ${document.getElementById('taskChannel').value}. Никаких API-вызовов нет.`});toast('Задача добавлена в демонстрационную очередь');go('work');return}if(a==='send-fallback'){let q=document.getElementById('voiceFallback')?.value||'';closeModal();sendCommand(q);return}}
function showDialog(type){if(type==='assistant')return openModal('Голосовой помощник ServGo',`<p>Сформулируйте задачу обычными словами. В этом макете диспетчер демонстрирует навигацию и реакцию интерфейса — без API-вызовов.</p><div class="field"><label>Что хотите сделать?</label><input id="dialogCommand" placeholder="Например: покажи SEO-завод"/></div>`,`<button class="btn ghost" data-close>Закрыть</button><button class="btn blue" data-action="dialog-send">Отправить · демо</button>`);if(type==='notifications')return openModal('Уведомления',`<div class="stack">${state.notifs.map(n=>`<div class="soft panel-pad split"><div><b style="font-size:12px">${escapeHtml(n.text)}</b><p style="margin:4px 0 0">${escapeHtml(n.sub)}</p></div>${!n.read?'<span class="pulse-dot"></span>':''}</div>`).join('')}</div>`,`<button class="btn ghost" data-close>Закрыть</button><button class="btn blue" data-action="mark-read">Прочитать все</button>`);if(type==='settings')return openModal('Настройки · концепт',`<p>Здесь будут управление профилем компании, каналами публикации, доступами и моделями. В этом прототипе доступна смена оформления.</p><div class="soft panel-pad"><b>Тема интерфейса</b><p>Текущая: ${state.theme==='light'?'светлая':'тёмная'}</p></div>`,`<button class="btn ghost" data-close>Закрыть</button><button class="btn blue" data-action="theme">Переключить тему</button>`);if(type==='fact')return openModal('Что делать со свободными окнами?',`<p>Демонстрационный вывод: в некоторые дни записи могут быть заполнены слабее. Настоящая система должна проверить это по данным BookingBot и предложить адресное действие.</p><div class="soft panel-pad"><b>Возможный эксперимент</b><p>Подготовить пост о свободных интервалах и измерить, сколько записей он принёс. Не путать просмотры с подтверждёнными визитами.</p></div>`,`<button class="btn ghost" data-close>Закрыть</button><button class="btn blue" data-open-page="create">Создать публикацию · демо</button>`);if(type==='analytics-info')return openModal('Источники аналитики',`<p>В этой версии используются демонстрационные показатели. После интеграции цифры должны приходить из BookingBot, а рядом с выводами — отображаться источник, период и уровень уверенности.</p>`,`<button class="btn blue" data-close>Понятно</button>`);}
function openSearch(){openModal('Быстрый переход',`<input class="modal-input" id="searchInput" placeholder="Найти раздел, задание или материал…" autocomplete="off"/><div id="searchResults" class="kbd-results"></div>`);document.getElementById('searchInput').focus();searchResults('')}
function searchResults(q){let t=q.toLowerCase().trim();const data=[...tabs.map(([id,name,ic])=>({name,type:'Раздел',page:id,icon:ic})),...state.tasks.map(x=>({name:x.title,type:'Задача',task:x.id,icon:'clock'})),...state.materials.map(x=>({name:x.title,type:'Материал',material:x.id,icon:x.icon}))].filter(x=>!t||x.name.toLowerCase().includes(t)).slice(0,10);document.getElementById('searchResults').innerHTML=data.map(x=>`<button class="kbd-result" data-search-result="${escapeHtml(JSON.stringify(x))}">${icon(x.icon,'sm')} <span style="flex:1">${escapeHtml(x.name)}</span><span class="muted" style="font-size:10px">${x.type}</span></button>`).join('')||`<p class="muted">Совпадений нет</p>`}
document.addEventListener('click',e=>{const target=e.target.closest('button,[data-task],[data-material]');if(!target){if(e.target.id==='overlay')closeModal();return}if(target.matches('[data-close]'))return closeModal();if(target.dataset.page)return go(target.dataset.page);if(target.dataset.openPage){closeModal();go(target.dataset.openPage);return}if(target.dataset.task){inspectTask(+target.dataset.task);return}if(target.dataset.material){showMaterial(+target.dataset.material);return}if(target.dataset.seotab){state.seoTab=target.dataset.seotab;render();return}if(target.dataset.stage!==undefined){state.selectedStage=+target.dataset.stage;render();return}if(target.dataset.filter){state.materialFilter=target.dataset.filter;render();return}if(target.dataset.format){state.format=target.dataset.format;render();return}if(target.dataset.seoarticle!==undefined){let i=+target.dataset.seoarticle;let s=['Как выбрать цвет волос под свой тип внешности','Уход за окрашенными волосами дома','Сколько держится тонирование волос'][i];openModal(s,`<p>Пример SEO-статьи. Здесь будут поисковый запрос, структура, статус генерации, заключение критика и ссылка на публикацию.</p>`,`<button class="btn blue" data-close>Закрыть</button>`);return}if(target.dataset.updateTask){let [id,status]=target.dataset.updateTask.split(':');let t=state.tasks.find(x=>x.id==id);if(t){t.status=status;closeModal();render();toast('Статус локальной демо-задачи изменён')}return}if(target.dataset.markmaterial){let m=state.materials.find(x=>x.id==target.dataset.markmaterial);if(m){m.status='ready';closeModal();render();toast('Материал помечен как готовый · демо')}return}if(target.dataset.open){showDialog(target.dataset.open);return}if(target.hasAttribute('data-focusvoice')){go('home');document.getElementById('voiceInput')?.focus();return}if(target.dataset.command){sendCommand(target.dataset.command);return}if(target.id==='openSearch'){openSearch();return}if(target.id==='notifyBtn'){showDialog('notifications');return}if(target.id==='bizBtn'){toast('В демо доступен один бизнес: «Мята»');return}if(target.id==='themeTop'||target.id==='themeMenu'){toggleTheme();return}if(target.id==='micBtn'){voice();return}if(target.id==='sendVoice'){const v=document.getElementById('voiceInput')?.value||'';sendCommand(v);return}if(target.dataset.searchResult){let d=JSON.parse(target.dataset.searchResult);closeModal();if(d.page)return go(d.page);if(d.task)return inspectTask(d.task);if(d.material)return showMaterial(d.material)}if(target.dataset.action==='dialog-send'){let v=document.getElementById('dialogCommand')?.value||'';closeModal();sendCommand(v);return}if(target.dataset.action==='mark-read'){state.notifs.forEach(x=>x.read=true);closeModal();render();toast('Демонстрационные уведомления прочитаны');return}if(target.dataset.action==='theme'){toggleTheme();closeModal();return}if(target.dataset.action){handleAction(target.dataset.action,target);return}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')closeModal();if(e.key==='Enter'&&document.activeElement?.id==='voiceInput'){e.preventDefault();sendCommand(document.activeElement.value)}if(e.key==='Enter'&&document.activeElement?.id==='dialogCommand'){e.preventDefault();let v=document.activeElement.value;closeModal();sendCommand(v)}if(e.key==='Enter'&&document.activeElement?.hasAttribute('data-task'))inspectTask(document.activeElement.dataset.task)});

function reviewV4(){let candidates=state.tasks.filter(t=>t.status==='review');return head('Входящие решения','Согласование','Материалы, планы и публикации, где нужно решение владельца.',act('Все задания','work'))+`<div class="stack">${candidates.length?candidates.map(t=>`<section class="panel-section"><div class="split"><h2>${escapeHtml(t.title)}</h2>${statusBadge(t.status)}</div><p class="intro-note mt14">${escapeHtml(t.detail)}</p><div class="action-line"><button class="btn ghost" data-task="${t.id}">Проверить</button><button class="btn blue" data-v4-action="confirm-review" data-id="${t.id}">Утвердить · демо</button></div></section>`).join(''):`<section class="panel-section">Нет ожидающих решений в демонстрационном списке.</section>`}</div><p class="footnote">В рабочей версии публикация не должна происходить без допустимого основания и проверенного финального материала.</p>`}
function intelligenceV4(){return head('Исследования','Бизнес-разведка','Конкуренты, источники, гипотезы, отчёты и последующие исследования.',`<button class="btn blue" data-v4-action="intel-start">${icon('search')} Начать исследование</button>`)+`<div class="workflow-grid"><section class="panel-section"><h2>Новое исследование</h2><div class="demo-fields"><label>Что изучить <textarea id="intelTopic" placeholder="Проанализируй 3 конкурента и найди слабые места предложений"></textarea></label><label>Глубина <select><option>Краткая разведка</option><option>Подробная разведка</option></select></label><button class="btn blue" data-v4-action="intel-start">Запустить · демо</button></div></section><section class="panel-section"><h2>Отчёты и доказательства</h2><div class="res-grid"><div class="res-stat"><b>0</b><small>Реальных поисков</small></div><div class="res-stat"><b>—</b><small>Источники</small></div><div class="res-stat"><b>—</b><small>Гипотезы</small></div></div><p class="intro-note mt14">В существующем API есть просмотр источников, отчёта, событий, дополнительные запросы и экспорт.</p></section></div>`}
function channelsV4(){return head('Публикации','Каналы','Подключения, согласование, расписание, отмена и сверка доставок.',act('Календарь','calendar'))+`<div class="module-grid">${[['Telegram','Посты и уведомления','message'],['ВКонтакте','Посты, медиа, OAuth','message'],['Дзен','Статьи и публикации','file'],['Собственный блог','SEO-статьи','globe'],['Видео','MP4 для объяснений','video'],['Email','Персональные письма','mail']].map(([name,d,ic])=>`<section class="module-card surface"><div class="module-icon">${icon(ic)}</div><h3>${name}</h3><p>${d}<br/><span class="muted">Подключение не проверено · демо</span></p><button class="btn ghost sm" data-v4-action="channel-connect" data-name="${name}">Управлять</button></section>`).join('')}</div><div class="module-divider">Очередь отправки</div><section class="panel-section"><p class="intro-note">Публикации, статусы, ручное согласование, время отправки, повторная сверка с каналом и журнал ошибок.</p>${act('Открыть согласование','review')}</section>`}
function settingsV4(){const groups=[['business','Компания'],['brand','Бренд'],['access','Доступы'],['voice','Голос'],['system','Система']];return head('Платформа','Настройки','Профиль бизнеса, бренд, аккаунты, голос, безопасность и интеграции.')+tabButtons(groups,state.settingsTab,'settings')+(state.settingsTab==='business'?`<section class="panel-section"><h2>Профиль бизнеса</h2><div class="demo-fields"><label>Название <input value="Студия «Мята»" /></label><label>Услуги и особенности <textarea placeholder="Описание компании, услуги, цены, ограничения"></textarea></label><label>Город <input value="Сочи"/></label><button class="btn blue" data-v4-action="save-settings">Сохранить · демо</button></div></section>`:state.settingsTab==='brand'?`<section class="panel-section"><h2>Бренд и стиль материалов</h2><div class="demo-fields"><label>Тон коммуникации <select><option>Дружелюбный и профессиональный</option><option>Деловой</option><option>Лёгкий с юмором</option></select></label><label>Фирменные требования <textarea placeholder="Цвета, логотип, запрещённые фразы, призывы"></textarea></label><button class="btn blue" data-v4-action="save-settings">Сохранить · демо</button></div></section>`:state.settingsTab==='access'?`<section class="panel-section"><h2>Участники и безопасность</h2>${settingToggle('Подтверждение публикаций','Владелец контролирует публикации, массовые рассылки и расходы')}<div class="soft panel-pad mt14">Единый вход BookingBot / Growth OS, разрешения администраторов и ограничения по бизнесу. Настоящие права меняются только на сервере.</div></section>`:state.settingsTab==='voice'?`<section class="panel-section"><h2>Голосовое управление</h2>${settingToggle('Голосовые ответы','Озвучивать короткие ответы помощника')}<div class="soft panel-pad mt14">Микрофон, резервный текстовый ввод, разрешение браузера, история диалога и подтверждение значимых действий.</div></section>`:`<section class="panel-section"><h2>Интеграции и состояние</h2>${[['BookingBot','Расписание и записи'],['Смена','Персонал и табели'],['Growth OS','Контент и ИИ-команда'],['Mail','Почта и кампании'],['SEO','Блог и индексация']].map(([a,b])=>`<div class="setting-row"><div><strong>${a}</strong><p>${b}</p></div><span class="chip amber">Не подключено в прототипе</span></div>`).join('')}</section>`)}
function moreV4(){return head('Все инструменты','Разделы ServGo','На телефоне они собраны здесь, чтобы главная оставалась чистой.')+`<div class="module-grid">${tabs.filter(t=>!['home','more'].includes(t[0])).map(([id,label,ic])=>`<section class="surface module-card"><div class="module-icon">${icon(ic)}</div><h3>${label}</h3><p>Открыть рабочий раздел</p>${act('Перейти',id)}</section>`).join('')}</div>`}
function createV4(){const cards=[['Пост','pen','Для Telegram, VK и других каналов'],['Контент-план','calendar','Публикации по датам'],['Простое видео','video','Для объяснений и простой анимированной рекламы'],['SEO-статья','globe','Поисковые запросы и блог'],['Кампания','layers','Цель, аудитория, каналы, KPI'],['Email-рассылка','mail','Письма и сегменты контактов'],['Разведка','search','Конкуренты и гипотезы'],['Отчёт','chart','Показатели и выводы']];return head('Создание','Что хотите создать?','Выберите результат — или начните с голосовой команды.',act('Запустить SEO-завод','seo'))+`<section class="surface form-card"><h2>Формат</h2><div class="format-grid mt14">${cards.map(([n,ic,d])=>`<button class="format-option ${state.format===n?'active':''}" data-format="${n}"><span class="type-icon" style="width:30px;height:30px">${icon(ic)}</span><b>${n}</b><span>${d}</span></button>`).join('')}</div><div class="demo-fields"><label>Тема или задача <textarea id="taskTopic" placeholder="Например: подготовь простое видео для объяснения онлайн-записи"></textarea></label><label>Канал <select id="taskChannel"><option>Telegram</option><option>ВКонтакте</option><option>Дзен</option><option>Блог</option><option>Email</option><option>Видео MP4</option></select></label>${state.format==='Простое видео'?`<div class="soft panel-pad"><h3>Простое видео</h3><p class="intro-note">Подходит для объяснений, инструкций, наглядных схем и несложной анимированной рекламы. Не является генератором реалистичных кинематографических сцен.</p><div class="form-inline mt14"><label>Длительность <select><option>Около 30 секунд</option><option>Около 60 секунд</option></select></label><label>Формат <select><option>Вертикальное 9:16</option><option>Горизонтальное 16:9</option></select></label></div><p class="footnote">Подготовка видео может расходовать платные API. Запуск требует подтверждения.</p></div>`:''}<div class="split" style="flex-wrap:wrap"><small class="muted">Создание только в демонстрационной очереди</small><button class="btn blue" data-action="create-task">Создать задачу · демо</button></div></div></section>`}
// Keep old SEO, work, materials and analytics display; rename ambiguous 'Видео' wherever user sees labels.
function renderNavV4(){const groupA=['home','create','work','review','materials','calendar'];const names=tabs.filter(x=>groupA.includes(x[0]));const modules=tabs.filter(x=>!groupA.includes(x[0])&&!['more','settings'].includes(x[0]));const build=items=>items.map(([id,name,ic])=>`<button class="nav-btn ${state.page===id?'active':''}" data-page="${id}">${icon(ic)} ${name}${id==='work'?`<span class="count">${state.tasks.filter(t=>t.status==='work').length}</span>`:''}</button>`).join('');document.getElementById('leftNav').innerHTML=build(names)+`<div class="nav-label">Модули</div>`+build(modules)+`<div class="nav-label">Управление</div>`+build(tabs.filter(x=>x[0]==='settings'));document.getElementById('mobileNav').innerHTML=mobileTabs.map(id=>{const t=tabs.find(x=>x[0]===id);return `<button class="${state.page===id?'active':''}" data-page="${id}">${icon(t[2])}<span>${id==='mail'?'Почта':t[1]}</span></button>`}).join('')}
function renderV4(){document.body.classList.toggle('dark',state.theme==='dark');document.body.classList.toggle('home-empty',state.page==='home'&&!state.homeResult);renderNavV4();document.getElementById('crumbTitle').textContent=tabs.find(t=>t[0]===state.page)?.[1]||'Главная';const pages={home:homeV4,create:createV4,work,review:reviewV4,materials,calendar:calendarV4,campaigns:campaignsV4,seo,mail:mailV4,intelligence:intelligenceV4,team:teamV4,channels:channelsV4,analytics,settings:settingsV4,more:moreV4};document.getElementById('main').innerHTML=(pages[state.page]||homeV4)();if(state.page==='home'){document.getElementById('rail').innerHTML=''}else{renderRail()} if(state.page==='team'){document.querySelectorAll('[data-v4-model]').forEach(el=>el.value=state.teamModels[el.dataset.v4Model]||'По умолчанию')}}
render=renderV4;
sendCommand=function(raw){const q=String(raw||'').trim();if(!q){toast('Введите команду или используйте микрофон');return;}state.homeQuery=q;state.homeResult=/свободн|окн|загрузк|запис/i.test(q)?'slots':/seo|сео|стат|поиск|блог/i.test(q)?'seo':/mail|письм|рассыл|email|почт/i.test(q)?'mail':/видео|ролик|аним/i.test(q)?'video':/команд|модел|критик|задан/i.test(q)?'team':/кампан|реклам/i.test(q)?'campaign':/аналит|выруч|отчёт|показат/i.test(q)?'analytics':/пост|контент/i.test(q)?'campaign':'other';go('home')}
function v4newAction(target){const type=target.dataset.v4Action;if(!type)return false;
if(type==='new-campaign'){campaignWizard();return true}
if(type==='save-campaign'){let name=document.getElementById('campaignName')?.value.trim();if(!name){toast('Укажите название кампании');return true}state.marketingCampaigns.unshift({name,type:document.getElementById('campaignChannel').value,status:'Черновик',progress:0});closeModal();go('campaigns');toast('Демо-кампания сохранена локально');return true}
if(type==='campaign-detail'){campaignWizard();const f=document.getElementById('campaignName');if(f)f.value=target.dataset.name||'';return true}
if(type==='mail-search'){state.mailSearchDone=true;render();toast('Показан пример; внешний поиск не выполнен');return true}
if(type==='compose'){openModal('Написать письмо · демо',`<div class="demo-fields"><label>Получатель <input id="composeTo" type="email" placeholder="name@example.com"/></label><label>Тема <input id="composeSubject" placeholder="Тема письма"/></label><label>Письмо <textarea id="composeBody" placeholder="Текст письма"></textarea></label><p class="intro-note">Никакая отправка не выполняется. Сохраните черновик для просмотра.</p></div>`,`<button class="btn ghost" data-close>Отмена</button><button class="btn blue" data-v4-action="compose-save">Сохранить черновик</button>`);return true}
if(type==='compose-save'){state.mailDraft=(document.getElementById('composeSubject')?.value||'Без темы')+'\n'+(document.getElementById('composeBody')?.value||'');closeModal();state.mailTab='drafts';go('mail');toast('Черновик сохранён в демо');return true}
if(type==='import-contacts'){openModal('Импорт контактов',`<p>В работающей версии — CSV-файл с проверкой полей, источника email, согласия/основания обработки и дубликатов. В данном прототипе загрузка не выполняется.</p>`,`<button class="btn blue" data-close>Понятно</button>`);return true}
if(type==='mail-campaign'){let name=document.getElementById('mailCampaignTitle')?.value.trim();if(!name){toast('Введите тему рассылки');return true}state.marketingCampaigns.unshift({name,type:'Email',status:'Черновик',progress:0});toast('Создан демонстрационный черновик рассылки — писем не отправлено');return true}
if(type==='ai-mail'){state.mailDraft='Тема: Короткое приглашение\n\nЗдравствуйте! Предлагаем обсудить, подходит ли наш сервис вашей компании.\n\nЭто демонстрационный текст. Факты и адресата необходимо проверить.';render();toast('Подставлен пример письма, ИИ не вызывался');return true}
if(type==='save-draft'){state.mailDraft=document.getElementById('mailDraftEdit')?.value||'';toast('Черновик сохранён локально');return true}
if(type==='channel-connect'){openModal('Канал: '+target.dataset.name,`<p>Здесь будут статус подключения, разрешения, OAuth/токен, тест публикации, очередь и ошибки. В этом макете реальные подключения не выполняются.</p>`,`<button class="btn blue" data-close>Понятно</button>`);return true}
if(type==='calendar-slot'){openModal('Календарь: '+target.dataset.day,`<p>Здесь можно просматривать публикации дня, переносить, согласовывать и ставить на паузу. Данные демонстрационные.</p>`,`<button class="btn ghost" data-close>Закрыть</button><button class="btn blue" data-open-page="create">Создать материал</button>`);return true}
if(type==='intel-start'){let q=document.getElementById('intelTopic')?.value?.trim()||'Разведка конкурентов';state.tasks.unshift({id:Date.now(),title:'Разведка: '+q,status:'work',group:'Анализ',detail:'Демонстрационный запрос, без интернет-поиска'});go('work');toast('Демо-задача добавлена');return true}
if(type==='confirm-review'){let task=state.tasks.find(t=>t.id==target.dataset.id);if(task){task.status='approved';render();toast('Утверждено в демонстрационной очереди — не опубликовано')}return true}
if(type==='save-settings'||type==='plan-approve'||type==='plan-pause'){toast('Демонстрационное действие · сервер не изменён');return true}
return false}
document.addEventListener('click',function(e){const el=e.target.closest('[data-v4-action],[data-v4-reset],[data-v4-mail],[data-v4-team],[data-v4-settings],[data-v4-campaigns],button[data-open="settings"]');if(!el)return;if(el.matches('button[data-open="settings"]')){e.stopImmediatePropagation();go('settings');return}if(el.hasAttribute('data-v4-reset')){e.stopImmediatePropagation();state.homeResult=null;state.homeQuery='';go('home');return}for(const [k,s] of [['mail','mailTab'],['team','teamTab'],['settings','settingsTab'],['campaigns','campaignTab']]){const attr='v4'+k[0].toUpperCase()+k.slice(1);if(el.dataset[attr]!==undefined){e.stopImmediatePropagation();state[s]=el.dataset[attr];if(k==='mail'&&state.page!=='mail')go('mail');else render();return}}if(el.dataset.v4Action){e.stopImmediatePropagation();v4newAction(el)}},true);
document.addEventListener('change',function(e){if(e.target.dataset.v4Toggle){state.permissions[e.target.dataset.v4Toggle]=e.target.checked;toast('Параметр изменён в демо');}if(e.target.dataset.v4Model){state.teamModels[e.target.dataset.v4Model]=e.target.value;toast('Роль изменена локально · без обращения к модели')}});
// Fix UX label on prior screens and task status without changing historical code.
const oldStatusBadge=statusBadge;
statusBadge=function(s){return oldStatusBadge(s)};

render();
</script>
</body>
</html>
