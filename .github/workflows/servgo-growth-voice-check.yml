name: ServGo Growth voice and mobile UI smoke
on:
  pull_request:
    paths:
      - 'app/api/growth_v4.py'
      - 'app/api/assets/growth-live.*'
      - 'app/api/dispatcher_assets/dispatcher.js'
      - 'scripts/check_growth_voice_ui.py'
      - '.github/workflows/servgo-growth-voice-check.yml'
permissions:
  contents: read
jobs:
  voice-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install -e '.[test]' playwright
          python -m playwright install --with-deps chromium
      - name: Check hold-to-talk, dispatch retry and 390px bottom navigation
        run: python scripts/check_growth_voice_ui.py
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-voice-ui-smoke
          path: /tmp/servgo-growth-voice-ui/
          retention-days: 7
          if-no-files-found: warn
