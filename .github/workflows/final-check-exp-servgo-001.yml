name: Final check EXP-SERVGO-001

on:
  push:
    branches:
      - ops/check-exp-servgo-001-final

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      REMOTE_ROOT: /opt/ai_growth_os
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Inspect production experiment
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "REMOTE_ROOT='$REMOTE_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_ROOT/current"
          docker compose --env-file "$REMOTE_ROOT/.env" -p ai-growth-os -f docker-compose.prod.yml exec -T api python - <<'PY'
          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models.domain import AgentRun, Approval, Artifact, Decision, Experiment, Prospect, Task

          with SessionLocal() as db:
              exp = db.scalar(select(Experiment).where(Experiment.experiment_key=="EXP-SERVGO-001"))
              print("experiment_status=", exp.status)
              print("starts_at=", exp.starts_at)
              print("ends_at=", exp.ends_at)

              prospects = list(db.scalars(select(Prospect).where(Prospect.experiment_id==exp.id)))
              print("prospects=", len(prospects))
              print("validated=", sum(p.validation_status=="validated" for p in prospects))
              print("with_email=", sum(bool(p.email) for p in prospects))
              print("with_whatsapp=", sum(bool(p.whatsapp) for p in prospects))
              print("with_telegram=", sum(bool(p.telegram) for p in prospects))
              print("with_website=", sum(bool(p.website) for p in prospects))
              print("contacted=", sum(p.outreach_status!="not_contacted" for p in prospects))

              tasks = list(db.scalars(
                  select(Task).where(
                      Task.product_id==exp.product_id,
                      Task.title.like("EXP-SERVGO-001:%")
                  ).order_by(Task.created_at.asc())
              ))
              print("task_count=", len(tasks))
              for task in tasks:
                  status = task.status.value if hasattr(task.status, "value") else task.status
                  print("TASK", status, task.assigned_agent, task.title)

              task_ids=[t.id for t in tasks]
              runs=list(db.scalars(select(AgentRun).where(AgentRun.task_id.in_(task_ids)).order_by(AgentRun.started_at.asc()))) if task_ids else []
              print("run_count=", len(runs))
              for run in runs:
                  print("RUN", run.agent_name, run.status, run.error or "")

              artifacts=list(db.scalars(select(Artifact).where(Artifact.task_id.in_(task_ids)).order_by(Artifact.created_at.asc()))) if task_ids else []
              print("artifact_count=", len(artifacts))
              for artifact in artifacts:
                  status = artifact.status.value if hasattr(artifact.status, "value") else artifact.status
                  print("ARTIFACT", artifact.kind, status, artifact.title)

              approvals=list(db.scalars(select(Approval).where(Approval.product_id==exp.product_id, Approval.status=="pending").order_by(Approval.created_at.asc())))
              print("pending_approvals=", len(approvals))
              for approval in approvals:
                  print("APPROVAL", approval.action_type, approval.risk_level, (approval.reason or "")[:300].replace("\n"," "))

              decisions=list(db.scalars(select(Decision).where(Decision.experiment_id==exp.id).order_by(Decision.created_at.asc())))
              print("decisions=", len(decisions))
          PY

          echo "=== worker container ==="
          docker ps --filter name=ai-growth-os-worker-1 --format 'name={{.Names}} status={{.Status}}'
          echo "=== worker recent logs ==="
          docker logs --tail 160 ai-growth-os-worker-1 2>&1 | sed -E 's#bot[0-9]+:[A-Za-z0-9_-]+#bot***#g' || true
          REMOTE
