name: Deploy AI Growth OS to server

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/server

permissions:
  contents: read

concurrency:
  group: ai-growth-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      REMOTE_ROOT: /opt/ai_growth_os
      AI_GROWTH_PORT: "8091"
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      HUB_API_KEY: ${{ secrets.API }}
      TG_BOT_TOKEN: ${{ secrets.AI_GROWTH_TELEGRAM_BOT_TOKEN }}
      TG_OWNER_CHAT_ID: ${{ secrets.AI_GROWTH_TELEGRAM_OWNER_CHAT_ID }}

    steps:
      - name: Guard required secrets
        run: |
          set -euo pipefail
          [ -n "$SSHPASS" ] || { echo "::error::Missing SERVER_SSH_PASSWORD"; exit 1; }
          [ -n "$HUB_API_KEY" ] || { echo "::error::Missing API (ClaudeHub key)"; exit 1; }

      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Server preflight
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" '
            set -e
            docker --version
            docker compose version
            echo "--- memory ---"
            free -m
            echo "--- disk ---"
            df -h /
            if ss -ltn | awk "{print \$4}" | grep -Eq "(:|^)8091$"; then
              if ! docker ps --filter label=com.docker.compose.project=ai-growth-os --format "{{.Names}}" | grep -q .; then
                echo "Port 8091 is occupied by another service" >&2
                exit 23
              fi
            fi
          '

      - name: Upload release
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          RELEASE="$REMOTE_ROOT/releases/$GITHUB_SHA"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$RELEASE'"
          tar --exclude=.git --exclude=.env -czf - . | sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "tar -xzf - -C '$RELEASE'"

      - name: Install production secrets
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          printf '%s' "$HUB_API_KEY" | sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "umask 077; mkdir -p '$REMOTE_ROOT'; cat > '$REMOTE_ROOT/.xai_key.new'"
          printf '%s' "$TG_BOT_TOKEN" | sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "umask 077; cat > '$REMOTE_ROOT/.telegram_token.new'"
          printf '%s' "$TG_OWNER_CHAT_ID" | sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "umask 077; cat > '$REMOTE_ROOT/.telegram_owner.new'"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" '
            set -euo pipefail
            ROOT=/opt/ai_growth_os
            KEY=$(cat "$ROOT/.xai_key.new")
            TG_TOKEN=$(cat "$ROOT/.telegram_token.new" 2>/dev/null || true)
            TG_OWNER=$(cat "$ROOT/.telegram_owner.new" 2>/dev/null || true)
            rm -f "$ROOT/.xai_key.new" "$ROOT/.telegram_token.new" "$ROOT/.telegram_owner.new"
            DB_PASSWORD=""
            OLD_TG_TOKEN=""
            OLD_TG_OWNER=""
            if [ -f "$ROOT/.env" ]; then
              DB_PASSWORD=$(grep "^POSTGRES_PASSWORD=" "$ROOT/.env" | head -n1 | cut -d= -f2- || true)
              OLD_TG_TOKEN=$(grep "^TELEGRAM_BOT_TOKEN=" "$ROOT/.env" | head -n1 | cut -d= -f2- || true)
              OLD_TG_OWNER=$(grep "^TELEGRAM_OWNER_CHAT_ID=" "$ROOT/.env" | head -n1 | cut -d= -f2- || true)
            fi
            [ -n "$TG_TOKEN" ] || TG_TOKEN="$OLD_TG_TOKEN"
            [ -n "$TG_OWNER" ] || TG_OWNER="$OLD_TG_OWNER"
            if [ -z "$DB_PASSWORD" ]; then
              DB_PASSWORD=$(openssl rand -hex 24)
            fi
            umask 077
            {
              echo "APP_ENV=production"
              echo "POSTGRES_PASSWORD=$DB_PASSWORD"
              echo "LLM_PROVIDER=xai"
              echo "LLM_MODEL=grok-4.7"
              echo "XAI_API_KEY=$KEY"
              echo "XAI_BASE_URL=https://api.claudehub.fun/v1"
              echo "XAI_REASONING_EFFORT=medium"
              echo "AI_GROWTH_PORT=8091"
              if [ -n "$TG_TOKEN" ] && [ -n "$TG_OWNER" ]; then
                printf "TELEGRAM_BOT_TOKEN=%s\n" "$TG_TOKEN"
                printf "TELEGRAM_OWNER_CHAT_ID=%s\n" "$TG_OWNER"
                echo "TELEGRAM_POLL_TIMEOUT_SECONDS=25"
              fi
            } > "$ROOT/.env.new"
            mv "$ROOT/.env.new" "$ROOT/.env"
            chmod 600 "$ROOT/.env"
          '

      - name: Build, migrate and start
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          RELEASE="$REMOTE_ROOT/releases/$GITHUB_SHA"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "REMOTE_ROOT='$REMOTE_ROOT' RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$RELEASE"
          dc() {
            docker compose --env-file "$REMOTE_ROOT/.env" -p ai-growth-os -f docker-compose.prod.yml "$@"
          }
          dc build api
          dc up -d postgres
          dc run -T --rm api alembic upgrade head </dev/null
          dc run -T --rm api python -m app.bootstrap </dev/null
          if [ -f products/servgo/research_sources/initial-voc-2026-09-29.json ]; then
            dc run -T --rm api python -m app.ingest_research_sources \
              --product servgo \
              --file /app/products/servgo/research_sources/initial-voc-2026-09-29.json </dev/null
          fi
          dc up -d api
          if grep -q "^TELEGRAM_BOT_TOKEN=." "$REMOTE_ROOT/.env" && grep -q "^TELEGRAM_OWNER_CHAT_ID=." "$REMOTE_ROOT/.env"; then
            dc --profile telegram build telegram
            dc --profile telegram up -d telegram
          fi
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8091/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8091/health
          REMOTE

      - name: Verify Telegram control bot
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          RELEASE="$REMOTE_ROOT/releases/$GITHUB_SHA"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "REMOTE_ROOT='$REMOTE_ROOT' RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$RELEASE"
          if ! grep -q "^TELEGRAM_BOT_TOKEN=." "$REMOTE_ROOT/.env" || ! grep -q "^TELEGRAM_OWNER_CHAT_ID=." "$REMOTE_ROOT/.env"; then
            echo "Telegram control bot is not configured; skipping verification."
            exit 0
          fi
          docker inspect -f '{{.State.Running}}' ai-growth-os-telegram-1 | grep -qx true
          docker compose --env-file "$REMOTE_ROOT/.env" -p ai-growth-os -f docker-compose.prod.yml --profile telegram exec -T telegram python - <<'PY'
          import asyncio
          from app.core.config import get_settings
          from app.telegram_control_bot import TelegramAPI

          async def main():
              settings = get_settings()
              assert settings.telegram_bot_token
              assert settings.telegram_owner_chat_id is not None
              bot = await TelegramAPI(settings.telegram_bot_token).call("getMe")
              assert bot.get("id")
              print("Telegram control bot API OK")

          asyncio.run(main())
          PY
          REMOTE

      - name: Smoke test Grok 4.7
        continue-on-error: true
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          RELEASE="$REMOTE_ROOT/releases/$GITHUB_SHA"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "REMOTE_ROOT='$REMOTE_ROOT' RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$RELEASE"
          docker compose --env-file "$REMOTE_ROOT/.env" -p ai-growth-os -f docker-compose.prod.yml exec -T api python - <<'PY'
          import asyncio
          from app.core.composition import build_llm_provider
          from app.core.config import get_settings
          from app.llm.schemas import LLMMessage, LLMRequest

          async def main():
              provider = build_llm_provider(get_settings())
              result = await provider.generate(LLMRequest(
                  messages=[LLMMessage(role="user", content="Reply with exactly: OK")],
                  max_tokens=64,
              ))
              if not result.content.strip():
                  raise SystemExit("empty model response")
              print("Grok smoke OK:", result.model)

          asyncio.run(main())
          PY
          REMOTE

      - name: Activate release
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          RELEASE="$REMOTE_ROOT/releases/$GITHUB_SHA"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "REMOTE_ROOT='$REMOTE_ROOT' RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          ln -sfn "$RELEASE" "$REMOTE_ROOT/current"
          cd "$REMOTE_ROOT/releases"
          ls -1dt */ 2>/dev/null | tail -n +4 | xargs -r rm -rf
          echo "AI Growth OS active release: $(basename "$RELEASE")"
          docker ps --filter label=com.docker.compose.project=ai-growth-os --format 'table {{.Names}}	{{.Status}}	{{.Ports}}'
          REMOTE
