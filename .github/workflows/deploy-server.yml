name: Deploy AI Growth OS to server

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/server

permissions:
  contents: read

concurrency:
  group: ai-growth-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      REMOTE_ROOT: /opt/ai_growth_os
      AI_GROWTH_PORT: "8091"
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      HUB_API_KEY: ${{ secrets.API }}
      TG_BOT_TOKEN: ${{ secrets.AI_GROWTH_TELEGRAM_BOT_TOKEN }}
      TG_OWNER_CHAT_ID: ${{ secrets.AI_GROWTH_TELEGRAM_OWNER_CHAT_ID }}

    steps:
      - name: Guard required secrets
        run: |
          set -euo pipefail
          [ -n "$SSHPASS" ] || { echo "::error::Missing SERVER_SSH_PASSWORD"; exit 1; }
          [ -n "$HUB_API_KEY" ] || { echo "::error::Missing API (ClaudeHub key)"; exit 1; }

      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Server preflight
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" '
            set -e
            docker --version
            docker compose version
            echo "--- memory ---"
            free -m
            echo "--- disk ---"
            df -h /
            if ss -ltn | awk "{print \$4}" | grep -Eq "(:|^)8091$"; then
              if ! docker ps --filter label=com.docker.compose.project=ai-growth-os --format "{{.Names}}" | grep -q .; then
                echo "Port 8091 is occupied by another service" >&2
                exit 23
              fi
            fi
          '

      - name: Upload release
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          RELEASE="$REMOTE_ROOT/releases/$GITHUB_SHA"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$RELEASE'"
          tar --exclude=.git --exclude=.env -czf - . | sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "tar -xzf - -C '$RELEASE'"

      - name: Install production secrets
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          printf '%s' "$HUB_API_KEY" | sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "umask 077; mkdir -p '$REMOTE_ROOT'; cat > '$REMOTE_ROOT/.xai_key.new'"
          printf '%s' "$TG_BOT_TOKEN" | sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "umask 077; cat > '$REMOTE_ROOT/.telegram_token.new'"
          printf '%s' "$TG_OWNER_CHAT_ID" | sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "umask 077; cat > '$REMOTE_ROOT/.telegram_owner.new'"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" '
            set -euo pipefail
            ROOT=/opt/ai_growth_os
            KEY=$(cat "$ROOT/.xai_key.new")
            TG_TOKEN=$(cat "$ROOT/.telegram_token.new" 2>/dev/null || true)
            TG_OWNER=$(cat "$ROOT/.telegram_owner.new" 2>/dev/null || true)
            rm -f "$ROOT/.xai_key.new" "$ROOT/.telegram_token.new" "$ROOT/.telegram_owner.new"
            DB_PASSWORD=""
            OLD_TG_TOKEN=""
            OLD_TG_OWNER=""
            if [ -f "$ROOT/.env" ]; then
              DB_PASSWORD=$(grep "^POSTGRES_PASSWORD=" "$ROOT/.env" | head -n1 | cut -d= -f2- || true)
              OLD_TG_TOKEN=$(grep "^TELEGRAM_BOT_TOKEN=" "$ROOT/.env" | head -n1 | cut -d= -f2- || true)
              OLD_TG_OWNER=$(grep "^TELEGRAM_OWNER_CHAT_ID=" "$ROOT/.env" | head -n1 | cut -d= -f2- || true)
            fi
            [ -n "$TG_TOKEN" ] || TG_TOKEN="$OLD_TG_TOKEN"
            [ -n "$TG_OWNER" ] || TG_OWNER="$OLD_TG_OWNER"
            if [ -z "$DB_PASSWORD" ]; then
              DB_PASSWORD=$(openssl rand -hex 24)
            fi
            umask 077
            {
              echo "APP_ENV=production"
              echo "POSTGRES_PASSWORD=$DB_PASSWORD"
              echo "LLM_PROVIDER=xai"
              echo "LLM_MODEL=grok-4.7"
              echo "XAI_API_KEY=$KEY"
              echo "XAI_BASE_URL=https://api.claudehub.fun/v1"
              echo "XAI_REASONING_EFFORT=medium"
              echo "AI_GROWTH_PORT=8091"
              if [ -n "$TG_TOKEN" ] && [ -n "$TG_OWNER" ]; then
                printf "TELEGRAM_BOT_TOKEN=%s\n" "$TG_TOKEN"
                printf "TELEGRAM_OWNER_CHAT_ID=%s\n" "$TG_OWNER"
                echo "TELEGRAM_POLL_TIMEOUT_SECONDS=25"
              fi
            } > "$ROOT/.env.new"
            mv "$ROOT/.env.new" "$ROOT/.env"
            chmod 600 "$ROOT/.env"
          '

      - name: Build, migrate and start
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          RELEASE="$REMOTE_ROOT/releases/$GITHUB_SHA"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "REMOTE_ROOT='$REMOTE_ROOT' RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$RELEASE"
          dc() {
            docker compose --env-file "$REMOTE_ROOT/.env" -p ai-growth-os -f docker-compose.prod.yml "$@"
          }
          dc build profile-init api worker
          # Refresh packaged assets in the persistent store, preserving approved profiles.
          dc up --no-deps --abort-on-container-exit --exit-code-from profile-init profile-init </dev/null
          dc up -d postgres
          dc run -T --rm api alembic upgrade head </dev/null
          dc run -T --rm api python -m app.bootstrap </dev/null
          if [ -f products/servgo/research_sources/initial-voc-2026-09-29.json ]; then
            dc run -T --rm api python -m app.ingest_research_sources \
              --product servgo \
              --file /app/products/servgo/research_sources/initial-voc-2026-09-29.json </dev/null
          fi
          if [ -f products/servgo/experiments/EXP-SERVGO-001/enrichment.json ]; then
            dc run -T --rm api python -m app.apply_prospect_enrichment \
              --experiment EXP-SERVGO-001 \
              --file /app/products/servgo/experiments/EXP-SERVGO-001/enrichment.json \
              --prepare-outreach </dev/null
          fi
          # Queue content only while the old worker is stopped: it must not claim
          # a task immediately before its container is replaced.
          dc stop worker
          dc run -T --rm api python -m app.content.bootstrap </dev/null
          dc up -d api worker
          if grep -q "^TELEGRAM_BOT_TOKEN=." "$REMOTE_ROOT/.env" && grep -q "^TELEGRAM_OWNER_CHAT_ID=." "$REMOTE_ROOT/.env"; then
            dc --profile telegram build telegram
            dc --profile telegram up -d telegram
          fi
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8091/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8091/health
          REMOTE

      - name: Verify Telegram control bot
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          RELEASE="$REMOTE_ROOT/releases/$GITHUB_SHA"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "REMOTE_ROOT='$REMOTE_ROOT' RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$RELEASE"
          if ! grep -q "^TELEGRAM_BOT_TOKEN=." "$REMOTE_ROOT/.env" || ! grep -q "^TELEGRAM_OWNER_CHAT_ID=." "$REMOTE_ROOT/.env"; then
            echo "Telegram control bot is not configured; skipping verification."
            exit 0
          fi
          docker inspect -f '{{.State.Running}}' ai-growth-os-telegram-1 | grep -qx true
          docker compose --env-file "$REMOTE_ROOT/.env" -p ai-growth-os -f docker-compose.prod.yml --profile telegram exec -T telegram python - <<'PY'
          import asyncio
          from app.core.config import get_settings
          from app.telegram_control_bot import TelegramAPI

          async def main():
              settings = get_settings()
              assert settings.telegram_bot_token
              assert settings.telegram_owner_chat_id is not None
              bot = await TelegramAPI(settings.telegram_bot_token).call("getMe")
              assert bot.get("id")
              print("Telegram control bot API OK")

          asyncio.run(main())
          PY
          REMOTE

      - name: Verify Company Intake runtime
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          RELEASE="$REMOTE_ROOT/releases/$GITHUB_SHA"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "REMOTE_ROOT='$REMOTE_ROOT' RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$RELEASE"
          docker compose --env-file "$REMOTE_ROOT/.env" -p ai-growth-os -f docker-compose.prod.yml exec -T api python - <<'PY'
          import json
          import urllib.request
          from app.core.config import get_settings
          from app.company_profile import load_company_profile

          base = "http://127.0.0.1:8000"
          def read(path):
              return json.loads(urllib.request.urlopen(base + path, timeout=10).read())
          paths = read("/openapi.json")["paths"]
          assert "/products/{product_id}/company-profile" in paths
          assert "/products/{product_id}/intake" in paths
          for product in read("/products"):
              result = read("/products/" + product["id"] + "/company-profile")
              assert not result["validation_errors"], "Invalid runtime company profile"
          loaded = load_company_profile(get_settings().products_root, "servgo")
          assert loaded.profile is not None and not loaded.validation_errors
          print("Company Profile and Intake API OK; shared profile store OK")
          import shutil
          from app.content.render import FONT
          from pathlib import Path
          assert shutil.which('ffmpeg') and shutil.which('ffprobe') and Path(FONT).exists()
          from app.communications.mail import MailStore
          assert MailStore(get_settings().products_root).root.parent == get_settings().products_root
          print('Content renderer and persistent integrations store OK')
          from app.content.calendar import tick_calendar, EditorialPlan, plan_record
          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models.domain import Task, Artifact
          from app.models.domain import TaskStatus
          with SessionLocal() as db:
              planning = db.scalar(select(Task).where(Task.assigned_agent == 'editorial_planner').order_by(Task.created_at.desc()).limit(1))
              assert planning is not None, 'Editorial planner was not queued'
              print('Editorial planner runtime:', planning.id, planning.status.value)
              draft = db.scalar(select(Artifact).where(Artifact.kind == 'editorial_plan').order_by(Artifact.created_at.desc()).limit(1))
              if draft:
                  value = json.loads(draft.content)
                  print('Editorial calendar state:', value['approval_state'], 'slots:', len(value['slots']))
                  assert value['approval_state'] in {'draft', 'active', 'paused', 'superseded'}
          print('Editorial planner and durable calendar modules OK')
          import asyncio, io, subprocess
          from PIL import Image, ImageDraw, ImageFont
          from app.intake.sources import parse_file_async, MAX_FILE_BYTES
          assert MAX_FILE_BYTES == 20_000_000
          assert shutil.which('tesseract') and shutil.which('pdftoppm')
          langs = subprocess.run(['tesseract', '--list-langs'], capture_output=True, text=True, check=True).stdout
          assert 'rus' in langs and 'eng' in langs
          image = Image.new('RGB', (1200, 160), 'white')
          ImageDraw.Draw(image).text((20, 40), 'МАССАЖ ЦЕНА 5000', fill='black', font=ImageFont.truetype(FONT, 48))
          output = io.BytesIO()
          image.save(output, format='PNG')
          parsed = asyncio.run(parse_file_async('runtime-smoke.png', output.getvalue(), 'runtime-smoke'))
          assert parsed.status == 'read' and '5000' in parsed.text and 'МАССАЖ' in parsed.text
          print('Company file parser subprocess and Russian OCR OK; file limit 20 MB')
          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models.domain import Task, AgentRun, Artifact
          with SessionLocal() as db:
              task = db.scalar(select(Task).where(Task.assigned_agent == 'content_factory').order_by(Task.created_at.desc()).limit(1))
              assert task is not None, 'First content package was not queued'
              print('First content task:', task.id, task.status.value)
              for run in db.scalars(select(AgentRun).where(AgentRun.task_id == task.id)):
                  print('Content stage:', run.agent_name, run.model, run.status, run.error or '-')

          PY
          docker inspect -f '{{.State.Running}}' ai-growth-os-worker-1 | grep -qx true
          if grep -q "^TELEGRAM_BOT_TOKEN=." "$REMOTE_ROOT/.env" && grep -q "^TELEGRAM_OWNER_CHAT_ID=." "$REMOTE_ROOT/.env"; then
            docker compose --env-file "$REMOTE_ROOT/.env" -p ai-growth-os -f docker-compose.prod.yml --profile telegram exec -T telegram python - <<'PY'
          from app.core.config import get_settings
          from app.company_profile import load_company_profile
          from app.telegram_control_bot import MAIN_MENU
          assert any(button["text"] == "🏢 Компания" for row in MAIN_MENU["keyboard"] for button in row)
          loaded = load_company_profile(get_settings().products_root, "servgo")
          assert loaded.profile is not None and not loaded.validation_errors
          print("Telegram Company menu and shared profile store OK")
          for label in ('📝 Контент', '📇 Контакты', '📧 Почта'):
              assert any(button['text'] == label for row in MAIN_MENU['keyboard'] for button in row)
          print('Telegram Content, Contacts and Mail menus OK')
          PY
          fi
          REMOTE

      - name: Smoke test Grok 4.7
        continue-on-error: true
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          RELEASE="$REMOTE_ROOT/releases/$GITHUB_SHA"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "REMOTE_ROOT='$REMOTE_ROOT' RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$RELEASE"
          docker compose --env-file "$REMOTE_ROOT/.env" -p ai-growth-os -f docker-compose.prod.yml exec -T api python - <<'PY'
          import asyncio
          from app.core.composition import build_llm_provider
          from app.core.config import get_settings
          from app.llm.schemas import LLMMessage, LLMRequest

          async def main():
              provider = build_llm_provider(get_settings())
              result = await provider.generate(LLMRequest(
                  messages=[LLMMessage(role="user", content="Reply with exactly: OK")],
                  max_tokens=64,
              ))
              if not result.content.strip():
                  raise SystemExit("empty model response")
              print("Grok smoke OK:", result.model)

          asyncio.run(main())
          PY
          REMOTE

      - name: Run requested company content package
        if: ${{ hashFiles('.github/deploy-request.json') != '' }}
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          RELEASE="$REMOTE_ROOT/releases/$GITHUB_SHA"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "REMOTE_ROOT='$REMOTE_ROOT' RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$RELEASE"
          dc() { docker compose --env-file "$REMOTE_ROOT/.env" -p ai-growth-os -f docker-compose.prod.yml "$@"; }
          dc exec -T api python - <<'PY'
          import json
          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models.domain import Product
          from app.content.service import queue_content
          req=json.load(open('/app/.github/deploy-request.json', encoding='utf-8'))
          with SessionLocal() as db:
              products=list(db.scalars(select(Product).order_by(Product.name)))
              needle=req['product_name_contains'].casefold()
              matches=[p for p in products if needle in p.name.casefold()]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one company matching {needle!r}; found {[p.name for p in matches]}")
              p=matches[0]
              task=queue_content(db,p.id,req['topic'],dedupe_key=req['dedupe_key'])
              print("Requested company:",p.name)
              print("Content task:",task.id,task.status.value)
          PY
          REMOTE

      - name: Activate release
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          RELEASE="$REMOTE_ROOT/releases/$GITHUB_SHA"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "REMOTE_ROOT='$REMOTE_ROOT' RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          ln -sfn "$RELEASE" "$REMOTE_ROOT/current"
          cd "$REMOTE_ROOT/releases"
          ls -1dt */ 2>/dev/null | tail -n +4 | xargs -r rm -rf
          echo "AI Growth OS active release: $(basename "$RELEASE")"
          docker ps --filter label=com.docker.compose.project=ai-growth-os --format 'table {{.Names}}	{{.Status}}	{{.Ports}}'
          REMOTE
