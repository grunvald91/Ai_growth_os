name: One-shot ServGo seven-day SEO recovery and observation

on:
  push:
    branches: [audit/seo-servgo-readonly-20261103]
    paths: [.github/workflows/seo-servgo-resume-week.yml]

permissions:
  contents: read

concurrency:
  group: servgo-seo-owner-approved-weekly-recovery
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
      HOST_FP: uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU
    steps:
      - name: Confirm release, requeue only failed original task and observe results
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$SSHPASS" ] || { echo "::error::SERVER_SSH_PASSWORD unavailable"; exit 1; }
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > /tmp/keys
          while IFS= read -r line; do
            printf '%s\n' "$line" > /tmp/one
            ssh-keygen -lf /tmp/one 2>/dev/null | grep -q "SHA256:$HOST_FP " && printf '%s\n' "$line" >> ~/.ssh/known_hosts
          done < /tmp/keys
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Pinned host key mismatch"; exit 1; }
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          image=$(docker inspect -f '{{.Config.Image}}' ai-growth-os-api-1)
          case "$image" in
            *2b4e4ff55e9d*) echo "VERIFIED_RELEASE=2b4e4ff55e9d" ;;
            *) echo "ERROR: expected patched application not running"; exit 1 ;;
          esac
          docker exec -i ai-growth-os-api-1 python - <<'PY'
          import json,sys,time
          from collections import Counter
          from uuid import UUID
          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models.domain import Product,Task,TaskStatus,Artifact
          from app.seo.activation import is_enabled
          from app.seo.control import change_seo_run
          from app.api.seo_run_view import seo_runs

          task_id=UUID("2144a9c0-4e83-4e56-80b2-be61b3c738b3")
          with SessionLocal() as db:
              product=db.scalar(select(Product).where(Product.slug=="servgo"))
              if not product or not is_enabled(db,product.id):
                  raise SystemExit("ERROR: ServGo SEO is not enabled")
              task=db.get(Task,task_id)
              if not task or task.product_id!=product.id or task.assigned_agent!="seo_factory":
                  raise SystemExit("ERROR: original ServGo SEO task not found")
              request=db.scalar(select(Artifact).where(
                  Artifact.product_id==product.id,Artifact.task_id==task.id,
                  Artifact.kind=="seo_factory_request"))
              params=json.loads(request.content) if request else {}
              print("REQUEST_HORIZON_DAYS="+str(params.get("horizon_days",7)),flush=True)
              if params.get("horizon_days",7)!=7:
                  raise SystemExit("ERROR: original run is not a 7-day plan")
              active=list(db.scalars(select(Task).where(
                  Task.product_id==product.id,Task.assigned_agent=="seo_factory",
                  Task.status.in_([TaskStatus.QUEUED,TaskStatus.RUNNING]))))
              if task.status==TaskStatus.FAILED and not active:
                  state=change_seo_run(db,product_id=product.id,task_id=task.id,action="retry")
                  print("OWNER_APPROVED_RETRY="+state,flush=True)
              elif task.status in (TaskStatus.QUEUED,TaskStatus.RUNNING,TaskStatus.COMPLETED):
                  print("NO_DUPLICATE_RETRY="+task.status.value,flush=True)
              else:
                  raise SystemExit("ERROR: conflicting active run or unsupported task status")
              product_id=product.id

          for pass_number in range(1,19):
              with SessionLocal() as db:
                  current=db.get(Task,task_id)
                  rows=seo_runs(db,product_id,limit=4)
                  row=next((item for item in rows if item["id"]==str(task_id)),None)
                  if not row:
                      raise SystemExit("ERROR: task missing after retry")
                  articles=row["articles"]
                  result=dict(
                      poll=pass_number,status=current.status.value,
                      stage=row.get("current_stage"),
                      attempts=row.get("attempts"),
                      semantic_ready=row.get("semantic_ready"),
                      plan_ready=row.get("plan_ready"),
                      articles_queued=row.get("articles_queued"),
                      article_rows=len(articles),
                      article_states=dict(Counter(item["task_status"] for item in articles)),
                      scheduled=[item.get("scheduled_at") for item in articles[:9]],
                      sources=row.get("source_progress"),
                      error_code=row.get("last_error_code") if current.status==TaskStatus.FAILED else None,
                      error_stage=row.get("last_error_stage") if current.status==TaskStatus.FAILED else None,
                  )
                  print("SEO_LIVE="+json.dumps(result,ensure_ascii=False,default=str),flush=True)
                  if current.status==TaskStatus.COMPLETED:
                      if not articles or not row.get("articles_queued"):
                          raise SystemExit("ERROR: factory completed without article tasks")
                      print("SEO_PLAN_RECOVERY_OK articles_queued="+str(row["articles_queued"]),flush=True)
                      break
                  if current.status==TaskStatus.FAILED:
                      raise SystemExit("ERROR: SEO factory failed again; inspect SEO_LIVE failure code")
              time.sleep(20)
          else:
              print("SEO_PLAN_STILL_IN_PROGRESS (not yet complete)",flush=True)
          PY
          REMOTE
