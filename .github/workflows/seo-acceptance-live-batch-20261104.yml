name: One-time ServGo SEO E2E acceptance batch — production owner profile
on:
  push:
    branches: [qa/seo-e2e-readonly-20261104]
    paths:
      - .github/workflows/seo-acceptance-live-batch-20261104.yml
permissions:
  contents: read
concurrency:
  group: seo-acceptance-three-b2b-20261104
  cancel-in-progress: false
jobs:
  fault-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application test dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify five fault scenarios and buyer-intent release gate
        run: |
          python -m pytest -q \
            tests/test_fallback_provider.py::test_fallback_switches_model_after_transient_http_failure \
            tests/test_seo_factory.py::test_transient_article_provider_error_schedules_only_one_delayed_retry \
            tests/test_seo_publishing.py::test_retry_recovers_stale_article_state_without_creating_second_publication \
            tests/test_seo_publishing.py::test_fabricated_servgo_price_rejected_by_author_requires_owner_review \
            tests/test_seo_activation.py::test_disable_cancels_only_queued_seo_jobs_and_keeps_other_tasks \
            tests/test_seo_connected_company_journey.py::test_connected_company_article_reaches_own_blog_with_critic_and_demo_stays_off \
            tests/test_seo_publishing.py::test_servgo_consumer_query_blocked_with_clean_critic_and_owner_approval
  queue-real-b2b:
    needs: fault-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
      HOST_FP: uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the one-time acceptance batch script syntax
        run: python -m py_compile scripts/seo_acceptance_queue_servgo_20261104.py
      - name: Submit exactly three source-verified buyer topics to live SEO worker
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$SSHPASS" ] || { echo "::error::SERVER_SSH_PASSWORD is unavailable"; exit 1; }
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > /tmp/seo-live-keys
          while IFS= read -r line; do
            printf '%s\n' "$line" > /tmp/seo-live-key
            ssh-keygen -lf /tmp/seo-live-key 2>/dev/null | grep -q "SHA256:$HOST_FP " &&
              printf '%s\n' "$line" >> ~/.ssh/known_hosts
          done < /tmp/seo-live-keys
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Server fingerprint mismatch"; exit 1; }
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" \
            'docker exec -i ai-growth-os-api-1 python -' < scripts/seo_acceptance_queue_servgo_20261104.py
