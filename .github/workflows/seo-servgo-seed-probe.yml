name: One-shot SEO exact checkpoint seed probe
on:
  push:
    branches: [audit/seo-servgo-readonly-20261103]
    paths: [.github/workflows/seo-servgo-seed-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
      HOST_FP: uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU
    steps:
      - name: Check two real seed query responses; redact full response
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > /tmp/keys
          while read -r line; do
            echo "$line" > /tmp/key
            ssh-keygen -lf /tmp/key 2>/dev/null | grep -q "SHA256:$HOST_FP " && echo "$line" >> ~/.ssh/known_hosts
          done < /tmp/keys
          test -s ~/.ssh/known_hosts
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" 'docker exec -i ai-growth-os-api-1 python -' <<'PY'
          import asyncio,json
          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models.domain import Product,Task,Artifact
          from app.seo.suggest import ENDPOINTS,parse_suggestions
          import httpx
          with SessionLocal() as db:
              product=db.scalar(select(Product).where(Product.slug=='servgo'))
              task=db.scalar(select(Task).where(Task.product_id==product.id,Task.assigned_agent=='seo_factory'))
              chk=db.scalar(select(Artifact).where(Artifact.task_id==task.id,Artifact.kind=='seo_suggest_checkpoint'))
              seeds=json.loads(chk.content)['seeds'] if chk else []
          print('SEED_META='+json.dumps([{'length':len(s),'prefix':s[:60]} for s in seeds[:10]],ensure_ascii=False))
          async def go():
              async with httpx.AsyncClient(timeout=10.0,follow_redirects=False,
                  headers={'User-Agent':'Mozilla/5.0 (compatible; GrowthOS/1.0)'}) as client:
                  for seed in seeds[:2]:
                      for name,(url,fixed,param) in ENDPOINTS.items():
                          try:
                              r=await client.get(url,params={**fixed,param:seed})
                              print('SEED_PROBE='+json.dumps(dict(seed_prefix=seed[:35],engine=name,
                                  status=r.status_code,content_type=r.headers.get('content-type'),
                                  body_prefix=r.text[:180],parsed=len(parse_suggestions(r.text))),ensure_ascii=False))
                          except Exception as exc:
                              print('SEED_PROBE='+json.dumps(dict(engine=name,error=type(exc).__name__)))
          asyncio.run(go())
          PY
