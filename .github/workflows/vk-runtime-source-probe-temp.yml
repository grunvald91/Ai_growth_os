name: VK runtime source probe (temporary read-only)
on:
  push:
    branches: [fix/vk-operational-readiness-20261120]
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'paramiko>=3.4,<4'
      - name: Report VK configuration sources without secrets
        env:
          HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
          SERVER_SSH_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, hashlib, os, shlex, socket
          import paramiko
          if not os.environ.get('SERVER_SSH_PASSWORD'):
              raise SystemExit('ssh_password_missing')
          sock = socket.create_connection((os.environ['HOST'], 22), timeout=20)
          t = paramiko.Transport(sock)
          try:
              t.start_client(timeout=20)
              fp = base64.b64encode(hashlib.sha256(t.get_remote_server_key().asbytes()).digest()).decode().rstrip('=')
              if fp != 'uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU':
                  raise RuntimeError('host_fingerprint_mismatch')
              t.auth_password('root', os.environ['SERVER_SSH_PASSWORD'])
              if not t.is_authenticated():
                  raise RuntimeError('authentication_failed')
              commands = (
                  "import json, pathlib, subprocess; "
                  "p=pathlib.Path('/opt/ai_growth_os/deploy/deploy.json'); "
                  "v=json.loads(p.read_text()).get('overlay_env',{}); "
                  "print('overlay_vk_autopost='+str(v.get('CONTENT_VK_AUTOPOST_ENABLED','NOT_SET')).lower()); "
                  "print('overlay_vk_service_token_present='+str(bool(v.get('SOCIAL_VK_SERVICE_TOKEN'))).lower()); "
                  "print('overlay_vk_client_id_present='+str(bool(v.get('SOCIAL_VK_CLIENT_ID'))).lower()); "
                  "c='import os; from app.core.config import get_settings; s=get_settings(); "
                  "print(\"api_effective_vk_autopost=\"+str(s.content_vk_autopost_enabled).lower()); "
                  "print(\"api_env_vk_autopost_present=\"+str(\"CONTENT_VK_AUTOPOST_ENABLED\" in os.environ).lower()); "
                  "print(\"api_vk_service_token_present=\"+str(bool(s.social_vk_service_token)).lower())'; "
                  "r=subprocess.run(['docker','exec','ai-growth-os-api-1','python','-c',c],capture_output=True,text=True,timeout=30); "
                  "print(r.stdout.strip()); "
                  "print('probe_exit='+str(r.returncode))"
              )
              ch = t.open_session(timeout=20)
              ch.exec_command("python3 -c " + shlex.quote(commands))
              output = ch.makefile('r', -1).read(4096).decode('utf-8', 'replace')
              print(output.strip())
              if ch.recv_exit_status():
                  raise RuntimeError('probe_command_failed')
          finally:
              t.close()
          PY
