name: Deploy Growth (production)

# Manual only. The "production" environment should require the owner's approval
# (Settings -> Environments). Tests run first; the server builds the commit itself.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: growth-production
  cancel-in-progress: false

jobs:
  test:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install media tools
        # The GitHub mirror sometimes stalls for the whole job; give each try 4 minutes and retry.
        run: |
          for attempt in 1 2 3; do
            sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
              && sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq \
                ffmpeg fonts-dejavu-core poppler-utils tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng && exit 0
            echo "apt attempt $attempt failed"
          done
          exit 1
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Tests
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      # The repository is private: the server gets the tested commit's sources over SSH.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.sha }}
          fetch-depth: 0  # the drift check compares against the commit's history
      - name: Deploy (restricted key, or SERVER_SSH_PASSWORD when no key is set)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
          HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
          # SHA256 fingerprint of the server host key, pinned like the booking_bot workflows.
          HOST_FP: uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU
          SHA: ${{ needs.test.outputs.sha }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          if [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            # Preferred: the key's forced command only allows "deploy <sha>" or "rollback".
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            git archive --format=tar.gz "$SHA" app alembic/versions pyproject.toml products \
              | ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes "root@$HOST" "deploy $SHA"
            exit 0
          fi
          [ -n "$SSHPASS" ] || { echo "::error::Set DEPLOY_SSH_KEY + DEPLOY_KNOWN_HOSTS, or SERVER_SSH_PASSWORD"; exit 1; }
          sudo apt-get install -y -qq sshpass >/dev/null
          # Trust only the pinned host key.
          # Few unauthenticated connections: the server's SSH protection blocked a
          # runner after a full keyscan plus three separate logins (run 39144465115).
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > /tmp/scanned
          while read -r line; do
            printf '%s\n' "$line" > /tmp/one
            ssh-keygen -lf /tmp/one 2>/dev/null | grep -q "SHA256:$HOST_FP " && printf '%s\n' "$line" >> ~/.ssh/known_hosts
          done < /tmp/scanned
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Server host key does not match the pinned fingerprint"; exit 1; }
          # One authenticated connection shared by every command below.
          SSH_OPTS=(-o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ControlMaster=auto
                    -o ControlPath=/tmp/ssh-growth-%C -o ControlPersist=600)
          run() { sshpass -e ssh "${SSH_OPTS[@]}" "root@$HOST" "$@"; }
          # Drift check: refuse if the running code has files not in this commit's history.
          run "docker exec ai-growth-os-api-1 sh -c 'cd /app && find app products -type f \( -name \"*.py\" -o -name \"*.json\" -o -name \"*.md\" -o -name \"*.html\" -o -name \"*.css\" -o -name \"*.js\" \) ! -path \"*/__pycache__/*\" -exec sha256sum {} +'" > running.txt
          python3 - "$SHA" <<'PY2'
          import hashlib, subprocess, sys
          sha = sys.argv[1]
          def blob(rev, path):
              r = subprocess.run(["git", "show", f"{rev}:{path}"], capture_output=True)
              return hashlib.sha256(r.stdout).hexdigest() if r.returncode == 0 else None
          unknown = []
          for line in open("running.txt"):
              digest, path = line.split(None, 1)
              path = path.strip()
              if blob(sha, path) == digest:
                  continue
              revs = subprocess.run(["git", "log", "--format=%H", "-n", "300", sha, "--", path],
                                    capture_output=True, text=True).stdout.split()
              if not any(blob(rev, path) == digest for rev in revs):
                  unknown.append(path)
          for path in unknown:
              print("  NOT IN HISTORY:", path)
          if unknown:
              print("::error::Running code contains files that are not in this commit's history; not deploying.")
              sys.exit(1)
          print("drift check: ok")
          PY2
          git archive --format=tar.gz "$SHA" app alembic/versions pyproject.toml products \
            | run "python3 /opt/ai_growth_os/deploy/deploy_growth.py deploy $SHA"
          run "docker ps --filter label=com.docker.compose.project=ai-growth-os --format '{{.Names}} {{.Image}} {{.Status}}'; curl -s -o /dev/null -w 'health %{http_code}\n' http://127.0.0.1:8091/health"
