name: Studio inline post review (UI SDK)

on:
  push:
    branches: [feature/studio-post-inline-review-20261115]
  pull_request:
    branches: [main]
    paths:
      - 'studio_ui_sdk/**'
      - 'app/api/dispatcher_assets/**'
      - 'app/dispatcher/materials.py'
      - 'app/dispatcher/blocks.py'
      - 'app/dispatcher/registry.py'
      - 'tests/test_dispatcher_api.py'
      - 'tests/test_studio_ui_sdk_pilot.py'
      - '.github/workflows/studio-inline-review.yml'

permissions:
  contents: write

concurrency:
  group: studio-inline-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.repository == 'grunvald91/Ai_growth_os'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ github.event_name == 'push' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned SDK
        working-directory: studio_ui_sdk
        run: npm ci --no-audit --no-fund
      - name: Compile self-hosted UI component
        working-directory: studio_ui_sdk
        run: npm run build
      - name: Verify browser bundle
        run: |
          node --check app/api/dispatcher_assets/ui-sdk-pilot.bundle.js
          if grep -Eq 'https?://ui-sdk.dev|https?://cdn\.' app/api/dispatcher_assets/ui-sdk-pilot.bundle.js; then
            echo 'Unexpected runtime dependency on remote SDK CDN'
            exit 1
          fi
      - name: Exercise UI in Chrome
        working-directory: studio_ui_sdk
        run: |
          command -v google-chrome
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          SERVGO_CHROME_PATH="$(command -v google-chrome)" node browser-smoke.mjs
      - name: Save browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-post-inline-review
          path: studio-ui-sdk-mobile-smoke.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: python -m pip install -e . pytest
      - name: Verify scoped review and existing dispatcher API
        run: python -m pytest -q tests/test_studio_ui_sdk_pilot.py tests/test_dispatcher_api.py
      - name: Commit generated bundle only to the isolated feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/studio-post-inline-review-20261115'
        run: |
          git add app/api/dispatcher_assets/ui-sdk-pilot.bundle.js
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'build(studio): vendor reviewed UI SDK post preview bundle'
            git push origin HEAD:feature/studio-post-inline-review-20261115
          fi
      - name: Check committed and built assets are identical
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- app/api/dispatcher_assets/ui-sdk-pilot.bundle.js
