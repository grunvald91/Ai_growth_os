name: ServGo SEO and ProResultat planner read-only diagnostic
on:
  push:
    branches:
      - ops/seo-prod-diagnostics-20261108
    paths:
      - .github/workflows/seo-planner-readonly-20261108.yml
      - scripts/ops/seo_planner_readonly_20261108.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-planner-readonly-20261108
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
      HOST_FP: uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production task statuses (read-only, redacted output)
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$SSHPASS" ] || { echo "::error::SERVER_SSH_PASSWORD unavailable"; exit 1; }
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > /tmp/seo-planner-host-keys
          while read -r line; do
            printf '%s\n' "$line" > /tmp/seo-planner-host-key
            ssh-keygen -lf /tmp/seo-planner-host-key 2>/dev/null | grep -q "SHA256:$HOST_FP " && printf '%s\n' "$line" >> ~/.ssh/known_hosts
          done < /tmp/seo-planner-host-keys
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Pinned server host key mismatch"; exit 1; }
          echo "== Running Growth service container (read-only)"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST"             "docker ps --filter name=ai-growth-os --format '{{.Names}} {{.Status}}'"
          echo "== Company-scoped statuses / error categories"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST"             'docker exec -i ai-growth-os-api-1 python -' < scripts/ops/seo_planner_readonly_20261108.py
