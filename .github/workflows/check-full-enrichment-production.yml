name: Check full enrichment production

on:
  push:
    branches:
      - ops/check-full-enrichment-production

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      REMOTE_ROOT: /opt/ai_growth_os
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Inspect enrichment and outreach package
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "REMOTE_ROOT='$REMOTE_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_ROOT/current"
          docker compose --env-file "$REMOTE_ROOT/.env" -p ai-growth-os -f docker-compose.prod.yml exec -T api python - <<'PY'
          import json
          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models.domain import Approval, Artifact, Experiment, Prospect
          from app.services.prospects import ProspectService

          with SessionLocal() as db:
              exp=db.scalar(select(Experiment).where(Experiment.experiment_key=="EXP-SERVGO-001"))
              stats=ProspectService(db).stats_for_experiment(exp.id)
              print("STATS="+json.dumps(stats,sort_keys=True))
              prospects=list(db.scalars(select(Prospect).where(Prospect.experiment_id==exp.id)))
              print("CONTACTED="+str(sum(p.outreach_status!="not_contacted" for p in prospects)))
              pending=list(db.scalars(select(Approval).where(
                  Approval.product_id==exp.product_id,
                  Approval.action_type=="send_outreach_batch",
                  Approval.status=="pending",
              ).order_by(Approval.created_at.desc())))
              print("PENDING_SEND_APPROVALS="+str(len(pending)))
              for approval in pending[:1]:
                  print("APPROVAL_REASON="+(approval.reason or ""))
                  if approval.artifact_id:
                      artifact=db.get(Artifact,approval.artifact_id)
                      if artifact:
                          payload=json.loads(artifact.content)
                          print("PACKAGE_MESSAGES="+str(len(payload.get("messages",[]))))
                          channels={}
                          for msg in payload.get("messages",[]):
                              channels[msg["channel"]]=channels.get(msg["channel"],0)+1
                          print("PACKAGE_CHANNELS="+json.dumps(channels,sort_keys=True))
          PY
          REMOTE
