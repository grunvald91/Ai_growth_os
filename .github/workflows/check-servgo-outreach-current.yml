name: Check current ServGo outreach

on:
  push:
    branches:
      - ops/check-servgo-outreach-current

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      REMOTE_ROOT: /opt/ai_growth_os
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Inspect outreach state
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "REMOTE_ROOT='$REMOTE_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_ROOT/current"
          docker compose --env-file "$REMOTE_ROOT/.env" -p ai-growth-os -f docker-compose.prod.yml exec -T api python - <<'PY'
          import json
          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models.domain import Approval, Artifact, Experiment, Prospect

          with SessionLocal() as db:
              exp=db.scalar(select(Experiment).where(Experiment.experiment_key=="EXP-SERVGO-001"))
              prospects=list(db.scalars(select(Prospect).where(Prospect.experiment_id==exp.id)))
              print("status=", exp.status)
              print("prospects=", len(prospects))
              print("validated=", sum(p.validation_status=="validated" for p in prospects))
              print("ready_direct=", sum(p.validation_status=="validated" and p.preferred_channel in {"email","whatsapp","telegram"} and bool(getattr(p,p.preferred_channel,None)) for p in prospects))
              print("email=", sum(bool(p.email) for p in prospects))
              print("whatsapp=", sum(bool(p.whatsapp) for p in prospects))
              print("telegram=", sum(bool(p.telegram) for p in prospects))
              print("website=", sum(bool(p.website) for p in prospects))
              print("contacted=", sum(p.outreach_status!="not_contacted" for p in prospects))

              approvals=list(db.scalars(select(Approval).where(Approval.product_id==exp.product_id, Approval.status=="pending").order_by(Approval.created_at.desc())))
              print("pending_approvals=", len(approvals))
              for a in approvals:
                  print("APPROVAL", a.action_type, a.risk_level, (a.reason or "").replace("\n"," ")[:500])
                  if a.artifact_id:
                      art=db.get(Artifact,a.artifact_id)
                      if art and art.kind=="outreach_package":
                          payload=json.loads(art.content)
                          print("outreach_messages=", len(payload.get("messages",[])))
                          for item in payload.get("messages",[]):
                              print("MSG", item.get("lead_id"), item.get("business_name"), item.get("channel"), item.get("target"))
          PY

          echo "=== worker env ==="
          docker compose --env-file "$REMOTE_ROOT/.env" -p ai-growth-os -f docker-compose.prod.yml exec -T worker python - <<'PY'
          import os
          print("worker_model=", os.environ.get("LLM_MODEL"))
          print("worker_fallback=", os.environ.get("LLM_FALLBACK_MODELS"))
          print("worker_reasoning=", os.environ.get("XAI_REASONING_EFFORT"))
          PY
          REMOTE
