name: Growth whiteboard diagnostics (read-only)

# One-off read-only diagnostics: prints only stage names, error codes,
# exception types, HTTP statuses and call durations. No content, env or keys.
on:
  push:
    branches: [ccr-545c5158-rcd05z]
    paths: ['.github/workflows/growth-diag-once.yml']

permissions:
  contents: read

env:
  HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}

jobs:
  diag:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: SSH setup
        run: |
          set -euo pipefail
          [ -n "$SSHPASS" ] || { echo "::error::SERVER_SSH_PASSWORD is missing"; exit 1; }
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null | sort > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts
      - name: Last whiteboard jobs
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=yes "root@$HOST" \
            "docker exec -i ai-growth-os-api-1 python -" <<'PY'
          import json, re
          from pathlib import Path
          from sqlalchemy import select
          from app.core.config import get_settings
          from app.db.session import SessionLocal
          from app.models.domain import AgentRun, Artifact, Task
          from app.content.whiteboard.jobs import AGENT, job_directory
          SAFE = re.compile(r'[^A-Za-z0-9_:.\- ]')
          def safe(v):
              return SAFE.sub('', str(v))[:120]
          settings = get_settings()
          with SessionLocal() as db:
              tasks = list(db.scalars(select(Task).where(Task.assigned_agent == AGENT)
                                      .order_by(Task.created_at.desc()).limit(4)))
              for t in tasks:
                  state = db.scalar(select(Artifact).where(Artifact.task_id == t.id, Artifact.kind == 'whiteboard_job_state'))
                  v = json.loads(state.content) if state else {}
                  print('TASK', t.id, 'created', t.created_at, 'status', safe(t.status.value),
                        'stage', safe(v.get('stage')), 'failed_stage', safe(v.get('failed_stage')),
                        'error', safe(v.get('error')), 'diag', safe(json.dumps(v.get('diagnostic'))))
                  for r in db.scalars(select(AgentRun).where(AgentRun.task_id == t.id).order_by(AgentRun.started_at)):
                      d = (r.finished_at - r.started_at).total_seconds() if r.finished_at and r.started_at else None
                      print('   RUN', safe(r.agent_name), safe(r.model), safe(r.status), 'sec', d, 'err', safe(r.error))
                  stages = job_directory(settings.products_root, t.product_id, t.id) / 'stages'
                  for f in sorted(stages.glob('provider-error-response-*.json')) if stages.exists() else []:
                      data = json.loads(f.read_text())
                      body = data.get('body') or ''
                      try:
                          err = json.loads(body).get('error', {})
                          err = {k: err.get(k) for k in ('type', 'code')} if isinstance(err, dict) else {}
                      except Exception:
                          err = {}
                      print('   PROVIDER_ERROR http', data.get('http_status'), safe(json.dumps(err)))
          PY
      - name: Worker failure lines (codes only)
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=yes "root@$HOST" \
            "docker logs --since 6h ai-growth-os-worker-1 2>&1 | grep -oE 'whiteboard_failed \{[^}]*\}|[A-Za-z]+(Timeout|Error)\b' | sort | uniq -c | tail -30"
