name: Growth accounts and mail diagnostics (read-only)

# One-off read-only diagnostics: prints only stage names, error codes,
# exception types, HTTP statuses and call durations. No content, env or keys.
on:
  push:
    branches: [ccr-545c5158-rcd05z]
    paths: ['.github/workflows/growth-diag-once.yml']

permissions:
  contents: read

env:
  HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}

jobs:
  diag:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: SSH setup
        run: |
          set -euo pipefail
          [ -n "$SSHPASS" ] || { echo "::error::SERVER_SSH_PASSWORD is missing"; exit 1; }
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null | sort > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts
      - name: Login chain, mounts and migrations (names and directives only)
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=yes "root@$HOST" 'bash -s' <<'SH'
          echo "== nginx growth server blocks (auth/server/proxy directives only)"
          grep -rlE "growth\.servgo|8091" /etc/nginx/ 2>/dev/null | while read f; do echo "-- $f"; grep -nE "server_name|auth_basic|proxy_pass|location" "$f"; done
          echo "== api env names (STUDIO_*) set?"
          docker exec ai-growth-os-api-1 sh -c 'for n in STUDIO_USERS_FILE STUDIO_HTPASSWD_FILE STUDIO_ADMIN_USERNAME STUDIO_ADMIN_PASSWORD STUDIO_PUBLIC_ORIGIN APP_ENV; do eval v=\$$n; [ -n "$v" ] && echo "$n=set" || echo "$n=empty"; done; echo "STUDIO_USERS_FILE path: ${STUDIO_USERS_FILE:-none}"; echo "STUDIO_HTPASSWD_FILE path: ${STUDIO_HTPASSWD_FILE:-none}"'
          echo "== api mounts"
          docker inspect ai-growth-os-api-1 --format '{{range .Mounts}}{{.Destination}} rw={{.RW}}{{"\n"}}{{end}}'
          echo "== htpasswd user count"
          for f in /etc/nginx/.htpasswd*; do echo "$f users: $(grep -c : "$f")"; done
          echo "== deploy_growth.py migration handling"
          grep -nE "alembic|upgrade" /opt/ai_growth_os/deploy/deploy_growth.py | head
          echo "== alembic current"
          docker exec ai-growth-os-postgres-1 psql -U ai_growth -d ai_growth -tAc "select version_num from alembic_version"
          SH
