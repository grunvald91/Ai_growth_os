name: Growth whiteboard render diagnostics (read-only)

# One-off read-only diagnostics: prints only stage names, error codes,
# exception types, HTTP statuses and call durations. No content, env or keys.
on:
  push:
    branches: [ccr-545c5158-rcd05z]
    paths: ['.github/workflows/growth-diag-once.yml']

permissions:
  contents: read

env:
  HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}

jobs:
  diag:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - name: SSH setup
        run: |
          set -euo pipefail
          [ -n "$SSHPASS" ] || { echo "::error::SERVER_SSH_PASSWORD is missing"; exit 1; }
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null | sort > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts
      - name: Reproduce render offline on a copy of saved stages (no provider calls)
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=yes "root@$HOST" \
            "docker exec -i ai-growth-os-worker-1 python -" <<'PY'
          import asyncio, json, re, shutil, tempfile, traceback
          from pathlib import Path
          from uuid import UUID
          from sqlalchemy import select
          from app.core.config import get_settings
          from app.db.session import SessionLocal
          from app.models.domain import Task
          from app.privacy import PrivacyGateway
          from app.content.whiteboard.jobs import AGENT, job_directory, records
          from app.content.whiteboard.checkpoints import CheckpointStore
          from app.content.whiteboard.pipeline import WhiteboardPipeline
          from app.content.whiteboard.render import MarkerSweepRenderer
          def clean(v, n=400):
              return re.sub(r'\s+', ' ', str(v))[:n]
          settings = get_settings()
          with SessionLocal() as db:
              task = db.scalar(select(Task).where(Task.assigned_agent == AGENT).order_by(Task.created_at.desc()).limit(1))
              _, state, _, payload = records(db, task)
              value = json.loads(state.content)
          print('TASK', task.id, task.status.value, 'stage', value.get('stage'), 'failed', value.get('failed_stage'),
                'error', value.get('error'), 'diag', json.dumps(value.get('diagnostic')), 'calls', value.get('calls'),
                'resumes', value.get('resumes'))
          source = job_directory(settings.products_root, task.product_id, task.id) / 'stages'
          manifest = json.loads((source / 'manifest.json').read_text())
          print('STAGES', {k: v.get('status') for k, v in manifest['stages'].items()})
          work = Path(tempfile.mkdtemp())
          shutil.copytree(source, work / 'stages')
          store = CheckpointStore(work / 'stages', payload.request, models=payload.models.model_dump(),
                                  visual_review=payload.visual_review,
                                  image_provider='claudehub' if payload.image_provider == 'claudehub' else None)
          class Forbidden:
              def __getattr__(self, name):
                  async def call(*a, **k):
                      raise PermissionError('provider call blocked in diagnostics: ' + name)
                  return call
          pipeline = WhiteboardPipeline(storyboard=Forbidden(), images=Forbidden(), speech=Forbidden(),
              regions=Forbidden(), renderer=MarkerSweepRenderer(), sanitizer=PrivacyGateway(), checkpoints=store,
              critic=Forbidden(), visual_author=Forbidden(), visual_review=payload.visual_review,
              max_api_calls=payload.max_api_calls)
          pipeline.revision_images = Forbidden()
          (work / 'out').mkdir()
          try:
              out = asyncio.run(pipeline.produce(payload.request, work / 'out' / 'video.mp4', approval_verified=True))
              print('RENDER OK duration', out.duration_seconds)
          except BaseException as exc:
              print('RENDER FAILED', type(exc).__name__, clean(exc))
              for frame in traceback.extract_tb(exc.__traceback__)[-10:]:
                  print('  at', frame.filename.replace('/app/', ''), frame.lineno, frame.name)
              cause = exc.__cause__ or exc.__context__
              if cause:
                  print('  cause', type(cause).__name__, clean(cause))
          finally:
              shutil.rmtree(work, ignore_errors=True)
          PY
