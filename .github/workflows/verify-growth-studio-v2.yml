name: Verify Growth Studio v2 production

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-growth-studio-v2.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      EXPECTED_RELEASE: 7ff917ee5e54c30104615be5cb675c095d805e13
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Wait for exact release and verify Studio
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "EXPECTED_RELEASE='$EXPECTED_RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          for n in $(seq 1 36); do
            current="$(basename "$(readlink /opt/ai_growth_os/current)")"
            echo "release[$n]=$current"
            if [ "$current" = "$EXPECTED_RELEASE" ]; then break; fi
            sleep 10
          done
          current="$(basename "$(readlink /opt/ai_growth_os/current)")"
          test "$current" = "$EXPECTED_RELEASE"

          html="$(curl -fsS http://127.0.0.1:8091/studio -L)"
          css="$(curl -fsS http://127.0.0.1:8091/studio/assets/studio.css)"
          js="$(curl -fsS http://127.0.0.1:8091/studio/assets/studio.js)"

          printf '%s' "$html" | grep -q 'Growth Studio'
          printf '%s' "$html" | grep -q 'Контент-календарь'
          printf '%s' "$html" | grep -q 'Подготовленные материалы'
          printf '%s' "$html" | grep -q 'mobile-nav'
          printf '%s' "$css" | grep -q -- '--sg-blue:#0b7cff'
          printf '%s' "$css" | grep -q '.package-card'
          printf '%s' "$css" | grep -q '.mobile-nav'
          printf '%s' "$js" | grep -q 'data-open-dialog'

          echo "== public edge without credentials =="
          code="$(curl -ksS -o /dev/null -w '%{http_code}' https://growth.servgo.ru/studio)"
          echo "$code"
          test "$code" = "401"

          echo "Growth Studio v2 production verification OK"
          REMOTE
