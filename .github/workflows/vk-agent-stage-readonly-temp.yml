name: Verify agent stage progress (temporary read-only)
on:
  push:
    branches: [ops/inspect-busy-growth-tasks-20261120]
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'paramiko>=3.4,<4'
      - name: Read aggregate statuses without task content or secrets
        env:
          HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
          SERVER_SSH_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import os, socket, hashlib, base64, shlex, paramiko
          secret=os.environ.get("SERVER_SSH_PASSWORD")
          if not secret: raise RuntimeError("SSH secret unavailable")
          sock=socket.create_connection((os.environ["HOST"],22),timeout=20)
          t=paramiko.Transport(sock)
          try:
              t.start_client(timeout=20)
              fp=base64.b64encode(hashlib.sha256(t.get_remote_server_key().asbytes()).digest()).decode().rstrip("=")
              if fp!="uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU": raise RuntimeError("Host key mismatch")
              t.auth_password("root",secret)
              if not t.is_authenticated(): raise RuntimeError("Auth failed")
              ch=t.open_session(timeout=20)
              ch.exec_command("docker exec ai-growth-os-api-1 python -c "+shlex.quote("from datetime import datetime, timezone\nfrom sqlalchemy import select, func\nfrom app.db.session import SessionLocal\nfrom app.models.domain import Task, TaskStatus, AgentRun\nnow = datetime.now(timezone.utc)\nwith SessionLocal() as db:\n    tasks = db.scalars(select(Task).where(Task.status == TaskStatus.RUNNING)).all()\n    print(\"running_task_count=\"+str(len(tasks)))\n    for t in tasks[:5]:\n        age = lambda stamp: int((now - (stamp.replace(tzinfo=timezone.utc) if stamp and stamp.tzinfo is None else stamp)).total_seconds() / 60) if stamp else None\n        rows=db.scalars(select(AgentRun).where(AgentRun.task_id==t.id).order_by(AgentRun.started_at.desc().nullslast())).all()\n        grouped=dict(db.execute(select(AgentRun.status,func.count()).where(AgentRun.task_id==t.id).group_by(AgentRun.status)).all())\n        running_ages=[age(r.started_at) for r in rows if r.status==\"running\"]\n        print(\"task_agent=%s task_age_m=%s stages=%s active_stage_ages_m=%s\" % (t.assigned_agent,age(t.updated_at),grouped,running_ages[:5]))\n"))
              print(ch.makefile("r",-1).read(12000).decode("utf-8","replace").strip())
              if ch.recv_exit_status()!=0: raise RuntimeError("Query failed")
          finally:
              t.close()
          PY
