name: One-shot ServGo SEO plan stage diagnosis
on:
  push:
    branches: [audit/seo-servgo-readonly-20261103]
    paths: [.github/workflows/seo-servgo-plan-stage-diag.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
      HOST_FP: uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU
    steps:
      - name: Read stage, worker model failover markers and state
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > /tmp/keys
          while IFS= read -r line; do
            printf '%s\n' "$line" > /tmp/key
            ssh-keygen -lf /tmp/key 2>/dev/null | grep -q "SHA256:$HOST_FP " && printf '%s\n' "$line" >> ~/.ssh/known_hosts
          done < /tmp/keys
          test -s ~/.ssh/known_hosts
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== FILTERED WORKER STAGE AND FAILOVER EVENTS (no prompts) ==='
          docker logs --since 15m ai-growth-os-worker-1 2>&1 |
            grep -E 'llm_fallback from_model=|seo_factory_stage task=|seo_factory_failed task=|SEO factory failed:|suggest_budget_exhausted' | tail -n 40 || true
          echo '=== CURRENT SERVGO SEO PLAN JOB ==='
          docker exec -i ai-growth-os-api-1 python - <<'PY'
          import json
          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models.domain import Product,Task,Artifact,AgentRun
          from app.api.seo_run_view import seo_runs
          with SessionLocal() as db:
              p=db.scalar(select(Product).where(Product.slug=='servgo'))
              row=seo_runs(db,p.id,limit=1)[0]
              job=db.get(Task,row["id"])
              stage_tasks=list(db.scalars(select(Task).where(Task.product_id==p.id,
                  Task.assigned_agent=="seo_editor").order_by(Task.created_at.desc()).limit(4)))
              info=dict(status=row["status"],stage=row.get("current_stage"),
                  attempts=row["attempts"],core=row["semantic_ready"],plan=row["plan_ready"],
                  articles_queued=row["articles_queued"],
                  error_type=row.get("last_error") if row["status"]=="failed" else None,
                  error_code=row.get("last_error_code") if row["status"]=="failed" else None,
                  editor_tasks=[dict(status=t.status.value,created_at=str(t.created_at),
                         updated_at=str(t.updated_at)) for t in stage_tasks])
              print("PLAN_STATUS="+json.dumps(info,ensure_ascii=False))
          PY
          REMOTE
