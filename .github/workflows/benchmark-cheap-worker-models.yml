name: Validate Gemini distribution repair

on:
  push:
    branches:
      - ops/benchmark-cheap-models

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      XAI_API_KEY: ${{ secrets.API }}
      XAI_BASE_URL: https://api.claudehub.fun/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: First pass then one repair
        run: |
          python - <<'PY'
          import asyncio, json, os
          from pydantic import ValidationError
          from app.llm.schemas import LLMMessage, LLMRequest
          from app.llm.xai import XAIProvider
          from app.workflows.team_contracts import DistributionPlan

          async def generate(provider, system, message):
              return await provider.generate(LLMRequest(
                  system_prompt=system,
                  messages=[LLMMessage(role="user", content=message)],
                  model="gemini-flash-3.8",
                  max_tokens=2200,
                  response_schema=DistributionPlan.model_json_schema(),
                  metadata={"reasoning_effort":"low"},
              ))

          async def main():
              provider=XAIProvider(
                  api_key=os.environ["XAI_API_KEY"],
                  model="gemini-flash-3.8",
                  base_url=os.environ["XAI_BASE_URL"],
                  reasoning_effort="low",
                  timeout_seconds=90,
              )
              first=await generate(
                  provider,
                  "Return ONLY JSON matching the supplied schema. Do not invent evidence. Schema: "
                  + json.dumps(DistributionPlan.model_json_schema()),
                  "Create a minimal organic distribution plan with one candidate for a hypothetical appointment-booking SaaS. Use hypotheses only.",
              )
              try:
                  parsed=DistributionPlan.model_validate_json(first.content)
                  print("DISTRIBUTION_FIRST_PASS=PASS")
                  print(parsed.model_dump_json())
                  return
              except ValidationError as exc:
                  print("DISTRIBUTION_FIRST_PASS=NEEDS_REPAIR")
                  repair=await generate(
                      provider,
                      "Repair the previous JSON so it validates exactly against the required schema. "
                      "Return ONLY corrected JSON. Do not add facts or evidence. Validation errors: "
                      + json.dumps(exc.errors(include_input=False))
                      + " Schema: "
                      + json.dumps(DistributionPlan.model_json_schema()),
                      json.dumps({"previous_response":first.content}),
                  )
                  parsed=DistributionPlan.model_validate_json(repair.content)
                  print("DISTRIBUTION_REPAIR=PASS")
                  print(parsed.model_dump_json())

          asyncio.run(main())
          PY
