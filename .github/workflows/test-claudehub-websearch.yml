name: Test ClaudeHub Grok structured output

on:
  push:
    branches:
      - ops-test-claudehub-websearch

permissions:
  contents: read

jobs:
  test-structured-output:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUB_API_KEY: ${{ secrets.API }}

    steps:
      - name: Guard key
        run: |
          [ -n "$HUB_API_KEY" ] || { echo "::error::Missing API"; exit 1; }
      - name: Test chat completions JSON schema
        run: |
          set -euo pipefail
          BODY=$(mktemp)
          STATUS=$(curl -sS -o "$BODY" -w "%{http_code}"             https://api.claudehub.fun/v1/chat/completions             -H "Authorization: Bearer $HUB_API_KEY"             -H "Content-Type: application/json"             -d '{"model":"grok-4.7","messages":[{"role":"user","content":"Return a status and count."}],"max_completion_tokens":128,"reasoning_effort":"low","response_format":{"type":"json_schema","json_schema":{"name":"probe","strict":true,"schema":{"type":"object","properties":{"status":{"type":"string"},"count":{"type":"integer"}},"required":["status","count"],"additionalProperties":false}}}}')
          echo "HTTP_STATUS=$STATUS"
          python - "$BODY" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding="utf-8"))
          if "error" in data:
              print(json.dumps(data["error"], ensure_ascii=False))
          else:
              msg=data["choices"][0]["message"]["content"]
              print("CONTENT="+msg)
              parsed=json.loads(msg)
              assert set(parsed)=={"status","count"}
          PY
