name: Test ClaudeHub Grok web search

on:
  push:
    branches:
      - ops-test-claudehub-websearch

permissions:
  contents: read

jobs:
  test-web-search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUB_API_KEY: ${{ secrets.API }}

    steps:
      - name: Guard key
        run: |
          [ -n "$HUB_API_KEY" ] || { echo "::error::Missing API"; exit 1; }

      - name: Test responses web_search
        run: |
          set -euo pipefail
          BODY=$(mktemp)
          STATUS=$(curl -sS -o "$BODY" -w "%{http_code}"             https://api.claudehub.fun/v1/responses             -H "Authorization: Bearer $HUB_API_KEY"             -H "Content-Type: application/json"             -d '{"model":"grok-4.7","input":"Find one current public source about online appointment booking software. Reply with only the source title and URL.","tools":[{"type":"web_search"}],"max_output_tokens":300}')
          echo "HTTP_STATUS=$STATUS"
          python - "$BODY" <<'PY'
          import json, sys
          path=sys.argv[1]
          raw=open(path, encoding="utf-8").read()
          try:
              data=json.loads(raw)
          except Exception:
              print("NON_JSON_RESPONSE")
              print(raw[:1000])
              raise SystemExit(0)
          safe={}
          for key in ("id","object","model","status","error","output_text"):
              if key in data:
                  safe[key]=data[key]
          if "output" in data:
              safe["output_types"]=[item.get("type") for item in data.get("output",[]) if isinstance(item,dict)]
          print(json.dumps(safe, ensure_ascii=False)[:4000])
          PY
