name: ServGo SEO recovery post-check (read-only)
on:
  push:
    branches: [ops/seo-plan-recovery-20261108]
    paths: [.github/workflows/seo-recovery-status-readonly-20261108.yml]
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
      HOST_FP: uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU
    steps:
      - uses: actions/checkout@v4
      - name: Verify current production tasks (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ops/seo_recovery_status_20261108.py
          [ -n "$SSHPASS" ] || { echo "::error::SERVER_SSH_PASSWORD unavailable"; exit 1; }
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > /tmp/keys
          while read -r line; do
            printf '%s\n' "$line" > /tmp/key
            ssh-keygen -lf /tmp/key 2>/dev/null | grep -q "SHA256:$HOST_FP " && printf '%s\n' "$line" >> ~/.ssh/known_hosts
          done < /tmp/keys
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Pinned host key mismatch"; exit 1; }
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" \
            'docker exec -i ai-growth-os-api-1 python -' < scripts/ops/seo_recovery_status_20261108.py
