name: Growth env restore (guarded)

# Разовое восстановление /opt/ai_growth_os/.env: добавляет только ОТСУТСТВУЮЩИЕ
# переменные, на которые ссылается docker-compose.prod.yml, из прежней рабочей
# конфигурации (compose.origin.json работающего релиза). Значения не печатаются —
# только имена и проверки да/нет. Бэкап .env, пересоздание api/worker/telegram,
# проверка здоровья, откат .env при сбое. Удалить после запуска.

on:
  push:
    branches: [ccr-545c5158-rcd05z]
    paths: ['.github/workflows/growth-env-restore.yml']

permissions:
  contents: read

concurrency:
  group: growth-production
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Restore and recreate
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@155.212.162.47 'bash -s' <<'REMOTE' 2>&1 | grep -vE '(sk-|AAG|:AA[A-Za-z0-9_-]{20})'
          set -euo pipefail
          ENV=/opt/ai_growth_os/.env
          API=ai-growth-os-api-1
          CWD=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' $API)
          FILES=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project.config_files"}}' $API)
          ORIGIN=$(echo "$FILES" | tr ',' '\n' | grep 'compose.origin.json' | head -1)
          test -f "$ORIGIN"
          BK=/root/growth-env-backup-$(date +%Y%m%d-%H%M%S); install -m 600 "$ENV" "$BK"
          echo "backup: $BK"
          python3 - "$ENV" "$ORIGIN" "$CWD/docker-compose.prod.yml" <<'PY'
          import json, re, sys
          env_path, origin_path, compose_path = sys.argv[1:]
          current = {}
          lines = open(env_path).read().splitlines()
          for line in lines:
              m = re.match(r'^([A-Z_][A-Z0-9_]*)=(.*)$', line)
              if m: current[m.group(1)] = m.group(2)
          origin = json.load(open(origin_path))['services']['api']['environment']
          referenced = set(re.findall(r'\$\{([A-Z_][A-Z0-9_]*)', open(compose_path).read()))
          skip = {'DATABASE_URL', 'PATH', 'LANG', 'GPG_KEY', 'PYTHON_VERSION', 'PYTHON_SHA256', 'RELEASE_SHA'}
          added = []
          for key in sorted(referenced - set(current) - skip):
              value = origin.get(key)
              if value not in (None, '') and '\n' not in str(value):
                  lines.append(f'{key}={value}'); added.append(key)
          with open(env_path, 'w') as f:
              f.write('\n'.join(lines) + '\n')
          print('added (names only):', ' '.join(added) or 'nothing')
          PY
          chmod 600 "$ENV"
          ARGS=""; for f in $(echo "$FILES" | tr ',' ' '); do ARGS="$ARGS -f $f"; done
          cd "$CWD"
          dc() { docker compose --project-name ai-growth-os --env-file "$ENV" $ARGS "$@"; }
          if ! dc config --quiet || ! dc up -d --no-deps --no-build api worker telegram; then
            echo "compose failed — restoring .env"; install -m 600 "$BK" "$ENV"; dc up -d --no-deps --no-build api worker telegram || true; exit 1
          fi
          ok=0; for i in $(seq 1 40); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8091/health)" = 200 ] && ok=1 && break; sleep 3; done
          if [ $ok != 1 ]; then echo "health failed — restoring .env"; install -m 600 "$BK" "$ENV"; dc up -d --no-deps --no-build api worker telegram || true; exit 1; fi
          echo "health 200"
          for c in ai-growth-os-api-1 ai-growth-os-worker-1 ai-growth-os-telegram-1; do
            e=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' $c)
            o=$(echo "$e" | grep -c '^OPENROUTER_API_KEY=.' || true); w=$(echo "$e" | grep -c '^WHITEBOARD_IMAGE_MODEL=.' || true)
            echo "$c: openrouter_key_present=$o whiteboard_models_present=$w $(docker inspect -f '{{.State.Status}}' $c)"
          done
          REMOTE
