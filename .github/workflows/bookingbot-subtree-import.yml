name: Import BookingBot main as isolated ServGo subtree (staging only)
on:
  push:
    branches: [integrate/bookingbot-source-20261105]
    paths: [.github/workflows/bookingbot-subtree-import.yml]
permissions:
  contents: write
concurrency:
  group: servgo-bookingbot-subtree-import
  cancel-in-progress: false
jobs:
  import:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Import pinned audited source with full history
        shell: bash
        env:
          SOURCE_SHA: f1529d1bf4960b5e0ad282f05eb9f651faf1cb36
          TARGET_BRANCH: integrate/bookingbot-source-20261105
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "$TARGET_BRANCH"
          test -z "$(git status --porcelain)"
          test ! -e services/booking_bot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/grunvald91/booking_bot.git refs/heads/main
          fetched=$(git rev-parse FETCH_HEAD)
          echo "BookingBot audited source SHA: $SOURCE_SHA"
          test "$fetched" = "$SOURCE_SHA" || { echo '::error::BookingBot main moved since audited source; import aborted'; exit 1; }
          git subtree add --prefix=services/booking_bot "$SOURCE_SHA" -m 'import: BookingBot production source as ServGo subtree (preserve history)'
          git ls-tree -r --name-only "$SOURCE_SHA" | LC_ALL=C sort > /tmp/booking-source-files
          git ls-tree -r --name-only HEAD:services/booking_bot | LC_ALL=C sort > /tmp/booking-import-files
          diff -u /tmp/booking-source-files /tmp/booking-import-files
          git ls-tree -r "$SOURCE_SHA" | LC_ALL=C sort > /tmp/booking-source-blobs
          git ls-tree -r HEAD:services/booking_bot | LC_ALL=C sort > /tmp/booking-import-blobs
          diff -u /tmp/booking-source-blobs /tmp/booking-import-blobs
          printf '%s\n' '# BookingBot source import — staging only' ''
          'Source: https://github.com/grunvald91/booking_bot'
          'Source ref: main at `f1529d1bf4960b5e0ad282f05eb9f651faf1cb36`.'
          'Target: `services/booking_bot/` on the integration branch.'
          ''
          'This is an exact tracked Git source import, not a production deploy or database migration.'
          'The original BookingBot repository and deployed service remain authoritative for production.'
          'No existing runtime path, workflow, DNS, database, or SSH configuration is switched by this import.'
          ''
          'Read-only production parity audit: https://github.com/grunvald91/booking_bot/actions/runs/42034462917'
          'Classification: https://github.com/grunvald91/booking_bot/actions/runs/42037871076'
          ''
          'Of the six differences between server source and main, five are exact earlier historical Git revisions.'
          '`web/api/routes/studio_sso.py` on the server has a moved-function layout and comments.'
          'An untracked server-only file `webapp/promo_standalone.py` exists and is not included here.'
          ''
          'Before any future merge to Growth main, check CI impact, separate deployment paths, database permissions, and the server-only file.'
          'Do not change booking_bot main or production until the server-only file and current UI/backend differences are reconciled.'
          > docs/architecture/bookingbot-source-import.md
          git add docs/architecture/bookingbot-source-import.md
          git commit -m 'docs: record audited BookingBot subtree source and production parity caveats'
          echo "SUBTREE_FILES_MATCHED=$(wc -l < /tmp/booking-import-files)"
          echo "BOOKINGBOT_SOURCE_SHA=$SOURCE_SHA"
          echo "INTEGRATION_SHA=$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
