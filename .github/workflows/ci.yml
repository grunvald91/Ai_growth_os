name: CI

on:
  push:
    branches: [main, "deploy/**"]
  pull_request:

permissions:
  contents: read

# A feature branch with an open PR is validated by pull_request only.
# This avoids spending Actions minutes twice for the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate monorepo change classifier
        run: python3 scripts/ci/monorepo_scope.py --self-test
      - name: Detect Growth-relevant changes
        id: scope
        run: python3 scripts/ci/monorepo_scope.py --base HEAD^ --head HEAD
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.growth_changed == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install media tools
        if: steps.scope.outputs.growth_changed == 'true'
        # The GitHub mirror sometimes stalls for the whole job; give each try 4 minutes and retry.
        run: |
          for attempt in 1 2 3; do
            sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
              && sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq \
                ffmpeg fonts-dejavu-core poppler-utils tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng && exit 0
            echo "apt attempt $attempt failed"
          done
          exit 1
      - name: Install
        if: steps.scope.outputs.growth_changed == 'true'
        run: python -m pip install -e '.[test]'
      - name: Tests
        if: steps.scope.outputs.growth_changed == 'true'
        run: python -m pytest -q
      - name: Whitespace check
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            # Import retains upstream BookingBot source bytes, including legacy whitespace.
            # Its future changes are checked separately by bookingbot-module-ci.yml.
            git diff --check HEAD^ HEAD -- . ':(exclude)services/booking_bot/**'
          else
            git diff --check
          fi
