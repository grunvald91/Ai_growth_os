name: CI

on:
  push:
    branches: [main, "deploy/**"]
  pull_request:

permissions:
  contents: read

# A feature branch with an open PR is validated by pull_request only.
# This avoids spending Actions minutes twice for the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate monorepo change classifier
        run: python3 scripts/ci/monorepo_scope.py --self-test
      - name: Detect Growth-relevant changes
        id: scope
        run: python3 scripts/ci/monorepo_scope.py --base HEAD^ --head HEAD
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.growth_changed == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install media tools
        if: steps.scope.outputs.growth_changed == 'true'
        # Runner images may already have these. Avoid the unreliable apt
        # mirror unless a required package is genuinely absent; bounded retries
        # fail closed if dependencies cannot be installed.
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for package in ffmpeg fonts-dejavu-core poppler-utils tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed'; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Required media packages already installed"
            exit 0
          fi
          for attempt in 1 2; do
            if sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y -qq "${missing[@]}"; then
              exit 0
            fi
            echo "Media package install attempt $attempt failed; refresh package indexes"
            sudo timeout 90 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -qq || true
          done
          echo "::error::Media dependencies are unavailable after bounded attempts"
          exit 1
      - name: Install
        if: steps.scope.outputs.growth_changed == 'true'
        run: python -m pip install -e '.[test]'
      - name: Tests
        if: steps.scope.outputs.growth_changed == 'true'
        run: python -m pytest -q
      - name: Check AI Chat JavaScript syntax
        if: steps.scope.outputs.growth_changed == 'true'
        run: node --check app/api/ai_chat_assets/ai-chat.js
      - name: Whitespace check
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            # Import retains upstream BookingBot source bytes, including legacy whitespace.
            # Its future changes are checked separately by bookingbot-module-ci.yml.
            git diff --check HEAD^ HEAD -- . ':(exclude)services/booking_bot/**'
          else
            git diff --check
          fi
