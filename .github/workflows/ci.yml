name: CI

on:
  push:
    branches: [main, "deploy/**"]
  pull_request:

permissions:
  contents: read

# A feature branch with an open PR is validated by pull_request only.
# This avoids spending Actions minutes twice for the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04  # temporary compatibility pin while Ubuntu 24.04 apt mirrors are degraded; never use ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate monorepo change classifier
        run: python3 scripts/ci/monorepo_scope.py --self-test
      - name: Detect Growth-relevant changes
        id: scope
        run: python3 scripts/ci/monorepo_scope.py --base HEAD^ --head HEAD
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.growth_changed == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install media tools
        if: steps.scope.outputs.growth_changed == 'true'
        # Prefer installed packages. Attempt apt for missing optional language
        # packs, but still run the full test suite if required tools exist;
        # missing actual media executables fail closed.
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for package in ffmpeg fonts-dejavu-core poppler-utils tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed'; then
              missing+=("$package")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Required media packages already installed"
            exit 0
          fi
          # GitHub-hosted Ubuntu's Azure apt mirror can stall indefinitely.
          # Prefer the other official Ubuntu mirrors in this ephemeral runner.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          # Ubuntu 22.04 hosted runners may use sources.list rather than
          # apt-mirrors.txt; replace the stalled Azure host there as well.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'azure\.archive\.ubuntu\.com' "$source"; then
              sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' "$source"
            fi
          done
          # Run the full suite only with the required media executables. Give
          # package downloads time to finish instead of failing after 70 seconds.
          if sudo timeout 65 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 update -qq \
              && sudo timeout 160 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 install -y -qq "${missing[@]}"; then
            exit 0
          fi
          for binary in ffmpeg pdftoppm tesseract; do
            command -v "$binary" >/dev/null 2>&1 || {
              echo "::error::Required media executable unavailable: $binary"
              exit 1
            }
          done
          echo "::warning::apt mirror unavailable; runner has required executables. Full test suite will verify behavior."
          tesseract --list-langs 2>/dev/null | grep -qx rus || echo "::warning::Russian OCR language pack missing on runner."
      - name: Install
        if: steps.scope.outputs.growth_changed == 'true'
        run: python -m pip install -e '.[test]'
      - name: Tests
        if: steps.scope.outputs.growth_changed == 'true'
        run: python -m pytest -q
      - name: Check AI Chat JavaScript syntax
        if: steps.scope.outputs.growth_changed == 'true'
        run: node --check app/api/ai_chat_assets/ai-chat.js
      - name: Whitespace check
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            # Import retains upstream BookingBot source bytes, including legacy whitespace.
            # Its future changes are checked separately by bookingbot-module-ci.yml.
            git diff --check HEAD^ HEAD -- . ':(exclude)services/booking_bot/**'
          else
            git diff --check
          fi
