name: Enable Exa and verify ServGo Mail on production
on:
  pull_request:
    paths: ['.github/workflows/servgo-mail-exa-release.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/servgo-mail-exa-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-server
  cancel-in-progress: false
jobs:
  exa:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest 'paramiko==3.5.1'
      - name: Validate provisioning scripts
        run: |
          python -m py_compile deploy/ops/provision_mail_exa.py services/booking_bot/scripts/release_yandex_mail.py
          python -m pytest --noconftest -q tests/test_mail_exa_provisioner.py
      - name: Apply the reviewed provisioner and exercise the deployed application
        env:
          APPLY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import runpy
          import shlex
          from pathlib import Path

          launch = '''
          import os, sys
          os.environ["EXA_API_KEY"] = sys.stdin.read()
          sys.argv = ["provision_mail_exa.py", "--apply"]
          exec(compile(SOURCE, "provision_mail_exa.py", "exec"),
               {"__name__": "__main__"})
          '''
          smoke_env = '''
          import os, subprocess, sys, tempfile
          from pathlib import Path

          root = "/opt/booking_bot"
          pid = int(subprocess.check_output(
              ["systemctl", "show", "booking-web-api.service", "-p", "MainPID", "--value"], text=True
          ))
          if pid <= 0:
              raise SystemExit("MAIL_API_PID_UNAVAILABLE")
          entries = Path(f"/proc/{pid}/environ").read_bytes().split(b"\\0")
          env = dict(entry.split(b"=", 1) for entry in entries if b"=" in entry)
          with tempfile.TemporaryDirectory(prefix="servgo-mail-smoke-") as workdir:
              env[b"SERVGO_MAIL_DATA_DIR"] = os.fsencode(workdir)
              env[b"SERVGO_MAIL_AI_TIMEOUT"] = b"55"
              proc = subprocess.run(
                  [root + "/venv/bin/python", "-c", SOURCE], cwd=root, env=env,
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True, timeout=400
              )
              for line in proc.stdout.splitlines():
                  if line.startswith(("MAIL_EXA_SMOKE_", "MAIL_CRITIC_SMOKE_")):
                      print(line)
              raise SystemExit(proc.returncode)
          '''
          smoke = '''
          import asyncio
          from web.api.routes import mail_campaign_research as research, mail_company_search as search
          from web.api.routes.mail_campaign_api import (
              CampaignInput, RecipientInput, RecipientList, add_recipients, create_campaign,
          )
          from web.api.routes.mail_campaign_review import prepare
          from web.api.routes.owner_mail import db_open

          async def verify_exa():
              with db_open() as db:
                  search.initialize(db)
                  now = search.utcnow()
                  db.execute(
                      "INSERT INTO search_job(id,niche,city,want,provider,status,created_at,updated_at) "
                      "VALUES(?,?,?,1,'exa','running',?,?)",
                      ("smoke", "ремонт электроинструмента", "Сочи", now, now),
                  )
              async def skip_grading(*args, **kwargs):
                  return None, "Smoke test"
              search.judge = skip_grading
              await asyncio.wait_for(search.run_exa_job("smoke", "ремонт электроинструмента", "Сочи", 1), 100)
              with db_open() as db:
                  status = db.execute("SELECT status FROM search_job WHERE id='smoke'").fetchone()["status"]
                  count = db.execute("SELECT count(*) FROM search_hit WHERE job_id='smoke' AND source='Exa'").fetchone()[0]
              print(f"MAIL_EXA_SMOKE_{'OK' if status == 'done' and count else 'FAILED'} count={count}", flush=True)
              return status == "done" and count > 0

          async def verify_critic():
              if not hasattr(research, "CriticBlocked"):
                  print("MAIL_CRITIC_SMOKE_RELEASE_MISSING", flush=True)
                  return False
              campaign = create_campaign(CampaignInput(name="ServGo Mail smoke"), None)["id"]
              add_recipients(campaign, RecipientList(recipients=[
                  RecipientInput(email="mail-smoke@example.invalid", company="ServGo", website="https://servgo.ru"),
              ]), None)
              if prepare(campaign, None)["queued"] != 1:
                  raise RuntimeError("smoke recipient was not queued")
              await asyncio.wait_for(research.prepare_one(), 250)
              with db_open() as db:
                  row = db.execute("SELECT status,subject,body FROM campaign_recipient WHERE campaign_id=?", (campaign,)).fetchone()
              ok = row["status"] == "review" and bool(row["subject"] and row["body"])
              print("MAIL_CRITIC_SMOKE_" + ("OK" if ok else "FAILED"), flush=True)
              return ok

          async def main():
              checks = await asyncio.gather(verify_exa(), verify_critic(), return_exceptions=True)
              for prefix, result in zip(("MAIL_EXA_SMOKE_", "MAIL_CRITIC_SMOKE_"), checks):
                  if isinstance(result, BaseException):
                      print(prefix + "ERROR_" + type(result).__name__, flush=True)
              return all(result is True for result in checks)

          raise SystemExit(0 if asyncio.run(main()) else 1)
          '''

          source = Path("deploy/ops/provision_mail_exa.py").read_text()
          for name, script in (("launch", launch), ("smoke_env", smoke_env), ("smoke", smoke)):
              compile(script, name, "exec")
          if os.environ["APPLY"] != "true":
              raise SystemExit(0)
          key = os.environ.get("EXA_API_KEY", "").strip()
          if not key:
              raise SystemExit("EXA_API_KEY unavailable")
          release = runpy.run_path("services/booking_bot/scripts/release_yandex_mail.py")
          ssh = release["connect"]()
          try:
              def remote(script, source, payload="", timeout=180):
                  command = "python3 -c " + shlex.quote("SOURCE = " + repr(source) + "\n" + script)
                  stdin, stdout, _ = ssh.exec_command(command, timeout=timeout)
                  stdin.write(payload)
                  stdin.flush()
                  stdin.channel.shutdown_write()
                  output = stdout.read().decode(errors="replace").splitlines()
                  return stdout.channel.recv_exit_status(), output

              code, output = remote(launch, source, key)
              accepted = {"EXA_ACTIVE_API_HEALTHY", "EXA_ALREADY_ACTIVE"}
              markers = [line for line in output if line.startswith(("EXA_", "MAIL_API_", "ROOT_REQUIRED")) and line.replace("_", "").isalnum()]
              for marker in markers:
                  print(marker, flush=True)
              if code or not accepted.intersection(markers):
                  raise SystemExit("Exa provisioning did not verify active API configuration")
              code, output = remote(smoke_env, smoke, timeout=430)
              for line in output:
                  if line.startswith(("MAIL_EXA_SMOKE_", "MAIL_CRITIC_SMOKE_")):
                      print(line)
              if code:
                  raise SystemExit("Production Mail smoke did not pass all checks")
          finally:
              ssh.close()
          PY
