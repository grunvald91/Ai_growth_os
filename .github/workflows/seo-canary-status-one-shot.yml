name: SEO #241 one-shot production status (read-only)
on:
  push:
    branches: [seo-canary-readonly-20261104]
    paths: [.github/workflows/seo-canary-status-one-shot.yml]

permissions:
  contents: read

concurrency:
  group: seo-241-production-readonly-one-shot
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'grunvald91/Ai_growth_os'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
      HOST_FP: uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU
    steps:
      - name: Read-only SQL and HTTP snapshot (no article generation)
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$SSHPASS" ] || { echo "::error::SERVER_SSH_PASSWORD unavailable"; exit 1; }
          sudo apt-get install -qq -y sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > /tmp/seo-host-keys
          while read -r line; do
            printf '%s\n' "$line" > /tmp/seo-host-key
            ssh-keygen -lf /tmp/seo-host-key 2>/dev/null | grep -q "SHA256:$HOST_FP " && printf '%s\n' "$line" >> ~/.ssh/known_hosts
          done < /tmp/seo-host-keys
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Pinned server host key mismatch"; exit 1; }
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== SEO #241 runtime snapshot'
          docker exec -i ai-growth-os-api-1 python - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from sqlalchemy import func, select
          from app.core.config import get_settings
          from app.db.session import SessionLocal
          from app.models.domain import Product, Task, Artifact, AgentRun, Publication
          from app.seo.activation import is_enabled
          from app.seo.queue import SEO_TASK_PREFIX

          settings = get_settings()
          print("app_release_sha=", str(settings.release_sha)[:12])
          print("global_autorun=", bool(settings.seo_autorun_enabled))
          print("servgo_autorun=", bool(settings.seo_servgo_autorun_enabled))
          print("utc_now=", datetime.now(timezone.utc).isoformat())
          with SessionLocal() as db:
              product = db.scalar(select(Product).where(Product.slug == "servgo"))
              print("servgo_profile_exists=", product is not None)
              if product is None:
                  raise SystemExit(2)
              print("servgo_seo_enabled=", bool(is_enabled(db, product.id)))
              jobs = list(db.scalars(select(Task).where(
                  Task.product_id == product.id, Task.assigned_agent == "content_factory",
                  Task.title.like(f"{SEO_TASK_PREFIX}%")
              ).order_by(Task.created_at.desc(), Task.id.desc()).limit(25)))
              print("recent_seo_tasks_count=", len(jobs))
              for task in jobs:
                  raw = db.scalar(select(Artifact.content).where(
                      Artifact.product_id == product.id, Artifact.task_id == task.id,
                      Artifact.kind == "content_request").limit(1))
                  brief = (json.loads(raw).get("seo_brief") or {}) if raw else {}
                  query = re.sub(r"[\n\r\t]+", " ", str(brief.get("primary_query") or ""))[:120]
                  runs = list(db.scalars(select(AgentRun).where(
                      AgentRun.task_id == task.id).order_by(AgentRun.created_at.desc()).limit(3)))
                  articles = list(db.scalars(select(Artifact).where(
                      Artifact.task_id == task.id, Artifact.kind == "article")))
                  publications = list(db.scalars(select(Publication).join(
                      Artifact, Publication.artifact_id == Artifact.id
                  ).where(Artifact.task_id == task.id)))
                  critic = db.scalar(select(func.count()).select_from(Artifact).where(
                      Artifact.task_id == task.id, Artifact.kind == "seo_final_review"))
                  error_type = "none"
                  if runs and runs[0].error:
                      m = re.search(r"(?i)(JSONDecodeError|ValidationError|TimeoutError|HTTPError|RateLimitError|ParseError)", runs[0].error)
                      error_type = m.group(1) if m else "other_error"
                  print(json.dumps({
                      "task_id_prefix": str(task.id)[:8], "query": query,
                      "status": task.status.value if hasattr(task.status, "value") else str(task.status),
                      "due_at": task.due_at.isoformat() if task.due_at else None,
                      "run_status": [r.status for r in runs],
                      "last_error_class": error_type, "article_count": len(articles),
                      "critic_review_count": critic,
                      "publications": [{"status": p.status, "ref": (p.external_reference or "")[:120]} for p in publications]
                  }, ensure_ascii=False))
              print("DONE_READ_ONLY")
          PY
          echo '=== Public HTTPS status (no requests with user data)'
          for path in /blog /blog/sitemap.xml /robots.txt; do
            curl --max-time 15 -sS --resolve servgo.ru:443:127.0.0.1 -o /dev/null \
              -w "servgo.ru$path %{http_code} %{content_type}\n" "https://servgo.ru$path" || true
          done
          REMOTE
