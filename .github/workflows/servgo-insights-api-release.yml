name: ServGo booking analytics API release (guarded)

# Manual by default. An explicit ONE-TIME main-branch signal may also request this guarded release.
on:
  push:
    branches: [main]
    paths:
      - '.github/release-signals/insights-api-20261102-v1.txt'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Deploy four reviewed API routes (false = read-only preflight)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          ((github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
           (github.event_name == 'push' && github.repository == 'grunvald91/booking_bot' &&
            github.event.head_commit.message == 'servgo: one-time insights API release 20261102-v1')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
      APPLY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SSH library and tests
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1' 'pytest>=8,<9' 'PyYAML>=6,<7'
      - name: Verify one-time release signal
        if: github.event_name == 'push'
        run: |
          test "$(cat .github/release-signals/insights-api-20261102-v1.txt)" = 'SERVGO_INSIGHTS_API_RELEASE_ONCE_20261102_V1'
      - name: Offline guard tests
        run: python -m pytest -q tests/test_servgo_insights_api_release.py
      - name: Read-only server preflight (always)
        run: python -m scripts.servgo_insights_api_release

  deploy:
    if: >-
      ${{ needs.preflight.result == 'success' && github.ref == 'refs/heads/main' &&
          ((github.event_name == 'workflow_dispatch' && inputs.apply == true && github.actor == github.repository_owner) ||
           (github.event_name == 'push' && github.repository == 'grunvald91/booking_bot' &&
            github.event.head_commit.message == 'servgo: one-time insights API release 20261102-v1')) }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
      APPLY: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SSH library
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Revalidate live file hashes, deploy four API files and verify health
        run: python -m scripts.servgo_insights_api_release
