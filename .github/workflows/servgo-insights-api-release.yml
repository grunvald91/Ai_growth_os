name: ServGo booking analytics API release (guarded)

# Manual-only protected production release.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Deploy three reviewed API routes (preserve live SSO) (false = read-only preflight)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
      APPLY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SSH library and tests
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1' 'pytest>=8,<9' 'PyYAML>=6,<7'
      - name: Offline guard tests
        run: python -m pytest -q tests/test_servgo_insights_api_release.py
      - name: Read-only server preflight (always)
        run: python -m scripts.servgo_insights_api_release

  deploy:
    if: needs.preflight.result == 'success' && inputs.apply == true && github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
      APPLY: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SSH library
        run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Revalidate live file hashes, deploy three API files and verify health
        run: python -m scripts.servgo_insights_api_release
