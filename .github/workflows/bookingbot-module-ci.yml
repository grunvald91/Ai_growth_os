name: BookingBot module checks (monorepo)
on:
  pull_request:
    paths:
      - 'services/booking_bot/**'
      - '.github/workflows/bookingbot-module-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/booking_bot/**'
      - '.github/workflows/bookingbot-module-ci.yml'

permissions:
  contents: read
concurrency:
  group: booking-module-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python syntax and deterministic BookingBot regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 9
    defaults:
      run:
        working-directory: services/booking_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile modules and all web entrypoints
        run: python -m compileall -q bot database web webapp scripts create_deploy_archive.py
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run pre-existing deterministic BookingBot tests
        env:
          PYTHONPATH: ${{ github.workspace }}/services/booking_bot
        run: python -m pytest -q tests/test_rental_logic.py tests/test_create_deploy_archive.py test_booking_utils.py test_schedule_business_guard.py
  frontend:
    name: Frontend install and production build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: services/booking_bot/web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/booking_bot/web/frontend/package-lock.json
      - name: Install npm dependencies from imported lockfile
        run: npm ci --legacy-peer-deps
      - name: Typecheck and build frontend
        run: npm run build
