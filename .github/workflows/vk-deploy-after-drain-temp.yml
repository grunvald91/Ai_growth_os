name: Resume VK deployment when Growth jobs drain (one-shot)
on:
  push:
    branches: [ops/vk-release-after-drain-20261120]
permissions:
  contents: read
  actions: write
jobs:
  wait-and-retry:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 38
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'paramiko>=3.4,<4'
      - name: Poll read-only task count and rerun CI-tested deploy only when idle
        env:
          HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
          SERVER_SSH_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
          GH_ACTIONS_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, shlex, socket, time, urllib.request
          import paramiko
          password = os.environ.get("SERVER_SSH_PASSWORD")
          token = os.environ.get("GH_ACTIONS_TOKEN")
          if not password or not token: raise RuntimeError("Required authorization not configured")
          sock = socket.create_connection((os.environ["HOST"],22),timeout=20)
          transport = paramiko.Transport(sock)
          try:
              transport.start_client(timeout=20)
              keyhash=base64.b64encode(hashlib.sha256(transport.get_remote_server_key().asbytes()).digest()).decode().rstrip("=")
              if keyhash != "uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU": raise RuntimeError("Remote host key mismatch")
              transport.auth_password("root",password)
              if not transport.is_authenticated(): raise RuntimeError("SSH authorization failed")
              transport.set_keepalive(20)
              command = "docker exec ai-growth-os-api-1 python -c " + shlex.quote("import json\nfrom sqlalchemy import select, func\nfrom app.db.session import SessionLocal\nfrom app.models.domain import Task, TaskStatus, AgentRun\nwith SessionLocal() as db:\n    task_ids=select(Task.id).where(Task.status == TaskStatus.RUNNING)\n    busy=db.scalar(select(func.count()).select_from(Task).where(Task.status == TaskStatus.RUNNING))\n    counts=dict(db.execute(select(AgentRun.status, func.count()).where(AgentRun.task_id.in_(task_ids)).group_by(AgentRun.status)).all())\n    print(json.dumps({\"busy\":int(busy or 0),\"agent_run_status_counts\":counts}, sort_keys=True))")
              for attempt in range(39):
                  ch = transport.open_session(timeout=20)
                  ch.settimeout(30)
                  ch.exec_command(command)
                  output = ch.makefile("r",-1).read(8000).decode("utf-8","replace").strip()
                  code=ch.recv_exit_status()
                  if code: raise RuntimeError("Read-only task check failed")
                  report=json.loads(output)
                  busy=report["busy"]
                  if attempt == 0 or attempt % 5 == 0 or busy == 0:
                      print("poll=%s busy_tasks=%s stage_counts=%s"%(attempt,busy,json.dumps(report["agent_run_status_counts"],sort_keys=True)),flush=True)
                  if busy == 0:
                      # This just retries the existing, previously CI-tested deployment.
                      # The deployment script independently repeats its own busy guard.
                      url="https://api.github.com/repos/grunvald91/Ai_growth_os/actions/runs/44695725116/rerun-failed-jobs"
                      req=urllib.request.Request(url,data=b"",method="POST",headers={
                          "Authorization":"Bearer "+token,
                          "Accept":"application/vnd.github+json",
                          "X-GitHub-Api-Version":"2022-11-28"
                      })
                      with urllib.request.urlopen(req,timeout=25) as resp:
                          if resp.status not in (201,202,204): raise RuntimeError("GitHub rejected deploy retry")
                          print("redeploy_requested_via_actions=true status="+str(resp.status),flush=True)
                      break
                  time.sleep(45)
              else:
                  raise RuntimeError("Still active after 29 minutes; no services or task statuses modified")
          finally:
              transport.close()
          PY
