name: Run ServGo AI team cycle

on:
  push:
    branches:
      - ops/run-team-cycle

permissions:
  contents: read

jobs:
  team-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}

    steps:
      - name: Guard SSH secret
        run: |
          [ -n "$SSHPASS" ] || { echo "::error::Missing SERVER_SSH_PASSWORD"; exit 1; }

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Run bounded team cycle and inspect results
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=20 -o ServerAliveCountMax=15"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          PRODUCT_ID=$(docker exec -i ai-growth-os-api-1 python - <<'PY'
          import json, urllib.request
          data=json.load(urllib.request.urlopen("http://127.0.0.1:8000/products"))
          for p in data:
              if p.get("slug")=="servgo":
                  print(p["id"])
                  break
          else:
              raise SystemExit("ServGo product not found")
          PY
          )

          echo "SERVGO_PRODUCT_ID=$PRODUCT_ID"

          docker exec -i ai-growth-os-api-1 python - "$PRODUCT_ID" <<'PY'
          import json, sys
          from uuid import UUID
          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models.domain import Artifact, Product, Task, TaskStatus

          product_id=UUID(sys.argv[1])
          title="Research Department live test — segments, channels, problems and competitor VOC"
          with SessionLocal() as db:
              existing=db.scalar(
                  select(Task)
                  .where(Task.product_id==product_id, Task.title==title)
                  .order_by(Task.created_at.desc())
                  .limit(1)
              )
              if existing is None:
                  task=Task(
                      product_id=product_id,
                      title=title,
                      description=(
                          "Research ServGo organic acquisition using separate segment, channel, "
                          "problem/PMF and competitor/VOC specialists. Use stored public review "
                          "evidence for competitor patterns. Keep claims falsifiable and grounded."
                      ),
                      assigned_agent="research_pmm",
                      status=TaskStatus.QUEUED,
                      priority=100,
                  )
                  db.add(task)
                  db.flush()
                  db.add(Artifact(
                      product_id=product_id,
                      task_id=task.id,
                      kind="task_brief",
                      title=title,
                      content=json.dumps({
                          "decision_id": None,
                          "title": title,
                          "description": task.description,
                          "assigned_agent": "research_pmm",
                          "task_type": "research",
                          "skill_name": None,
                          "priority": 100,
                          "operation": None,
                          "requires_approval": False,
                      }),
                  ))
                  db.commit()
                  print("CREATED_RESEARCH_TASK", task.id)
              else:
                  print("RESEARCH_TASK_EXISTS", existing.id, existing.status)
          PY

          echo "=== TEAM_CYCLE ==="
          curl -fsS -X POST "http://127.0.0.1:8091/products/$PRODUCT_ID/team-cycle"             -H 'Content-Type: application/json'             -d '{"max_tasks":1,"followup_cmo":true}'
          echo
          echo "=== TASKS ==="
          curl -fsS "http://127.0.0.1:8091/products/$PRODUCT_ID/tasks?limit=50"
          echo
          echo "=== ARTIFACTS ==="
          curl -fsS "http://127.0.0.1:8091/products/$PRODUCT_ID/artifacts?limit=50"
          echo
          echo "=== DECISIONS ==="
          curl -fsS "http://127.0.0.1:8091/products/$PRODUCT_ID/decisions?limit=20"
          echo
          echo "=== APPROVALS ==="
          curl -fsS "http://127.0.0.1:8091/products/$PRODUCT_ID/approvals?limit=20"
          echo
          REMOTE
