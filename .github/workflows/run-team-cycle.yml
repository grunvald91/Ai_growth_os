name: Inspect ServGo experiment article state

on:
  push:
    branches:
      - ops/run-team-cycle

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}

    steps:
      - name: Guard SSH secret
        run: |
          [ -n "$SSHPASS" ] || { echo "::error::Missing SERVER_SSH_PASSWORD"; exit 1; }

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Inspect experiment and article state
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=20 -o ServerAliveCountMax=15"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PRODUCT_ID="04392041-ea09-4853-874e-8060bee7286c"
          echo "=== HEALTH ==="
          curl -fsS "http://127.0.0.1:8091/health"
          echo
          echo "=== EXPERIMENTS ==="
          curl -fsS "http://127.0.0.1:8091/products/$PRODUCT_ID/experiments?limit=10"
          echo
          echo "=== APPROVALS ==="
          curl -fsS "http://127.0.0.1:8091/products/$PRODUCT_ID/approvals?limit=10"
          echo
          echo "=== ARTICLE TASKS/RUNS ==="
          docker exec -i ai-growth-os-api-1 python - <<'PY'
          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models.domain import Task, AgentRun, Artifact
          from uuid import UUID
          product_id=UUID("04392041-ea09-4853-874e-8060bee7286c")
          with SessionLocal() as db:
              tasks=list(db.scalars(
                  select(Task)
                  .where(Task.product_id==product_id, Task.title=="Article production")
                  .order_by(Task.created_at.desc())
                  .limit(5)
              ))
              for task in tasks:
                  print("TASK", task.id, task.status, task.created_at)
                  runs=list(db.scalars(
                      select(AgentRun).where(AgentRun.task_id==task.id).order_by(AgentRun.created_at)
                  ))
                  for run in runs:
                      print(" RUN", run.id, run.agent_name, run.status, run.error, run.started_at, run.finished_at)
                  arts=list(db.scalars(
                      select(Artifact).where(Artifact.task_id==task.id).order_by(Artifact.created_at)
                  ))
                  for art in arts:
                      print(" ART", art.id, art.kind, art.status, art.title)
          PY
          echo "=== API LOG TAIL ==="
          docker logs --tail 180 ai-growth-os-api-1 2>&1
          REMOTE
