name: Inspect ServGo article failure

on:
  push:
    branches:
      - ops/run-team-cycle

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}

    steps:
      - name: Guard SSH secret
        run: |
          [ -n "$SSHPASS" ] || { echo "::error::Missing SERVER_SSH_PASSWORD"; exit 1; }

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Inspect runtime and persisted state
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=20 -o ServerAliveCountMax=15"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PRODUCT_ID="04392041-ea09-4853-874e-8060bee7286c"
          echo "=== HEALTH ==="
          curl -sS -i "http://127.0.0.1:8091/health" | tail -n 20 || true
          echo "=== CONTAINERS ==="
          docker ps --format '{{.Names}} {{.Status}}' | grep 'ai-growth-os' || true
          echo "=== TASKS ==="
          curl -fsS "http://127.0.0.1:8091/products/$PRODUCT_ID/tasks?limit=20" || true
          echo
          echo "=== EXPERIMENTS ==="
          curl -fsS "http://127.0.0.1:8091/products/$PRODUCT_ID/experiments?limit=10" || true
          echo
          echo "=== APPROVALS ==="
          curl -fsS "http://127.0.0.1:8091/products/$PRODUCT_ID/approvals?limit=10" || true
          echo
          echo "=== ARTIFACTS ==="
          curl -fsS "http://127.0.0.1:8091/products/$PRODUCT_ID/artifacts?limit=20" || true
          echo
          echo "=== API LOG TAIL ==="
          docker logs --tail 160 ai-growth-os-api-1 2>&1 || true
          REMOTE
