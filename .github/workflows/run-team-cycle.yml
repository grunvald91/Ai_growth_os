name: Materialize ServGo experiment and article

on:
  push:
    branches:
      - ops/run-team-cycle

permissions:
  contents: read

jobs:
  experiment-article:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}

    steps:
      - name: Guard SSH secret
        run: |
          [ -n "$SSHPASS" ] || { echo "::error::Missing SERVER_SSH_PASSWORD"; exit 1; }

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Materialize experiment and prepare article approval
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=20 -o ServerAliveCountMax=30"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PRODUCT_ID="04392041-ea09-4853-874e-8060bee7286c"
          PLAN_ID="42714723-7f9a-4734-a7a4-2a74e409f193"
          DECISION_ID="dabc19ab-3620-4852-ab52-411de8a16c0f"

          EXP_FILE=$(mktemp)
          curl -fsS -X POST "http://127.0.0.1:8091/products/$PRODUCT_ID/experiments/from-content-plan"             -H 'Content-Type: application/json'             -d "{\"plan_artifact_id\":\"$PLAN_ID\",\"decision_id\":\"$DECISION_ID\"}" > "$EXP_FILE"
          echo "=== EXPERIMENT ==="
          cat "$EXP_FILE"
          echo
          EXPERIMENT_ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["experiment_id"])' "$EXP_FILE")

          ARTICLE_FILE=$(mktemp)
          curl --max-time 1200 -fsS -X POST "http://127.0.0.1:8091/products/$PRODUCT_ID/articles"             -H 'Content-Type: application/json'             -d "{\"experiment_id\":\"$EXPERIMENT_ID\",\"decision_id\":\"$DECISION_ID\",\"channel\":\"own_site\",\"topic\":\"Онлайн-запись для небольшой массажной студии: как устроить путь клиента от выбора услуги до подтверждения\",\"audience\":\"Владелец или управляющий небольшой массажной студии\",\"problem\":\"Проверить гипотезу, что владельцам полезно структурировать путь онлайн-записи и подтверждения без неподтвержденных сравнений с конкурентами.\",\"request_publication\":true}" > "$ARTICLE_FILE"
          echo "=== ARTICLE_RESULT ==="
          cat "$ARTICLE_FILE"
          echo
          echo "=== EXPERIMENTS ==="
          curl -fsS "http://127.0.0.1:8091/products/$PRODUCT_ID/experiments?limit=10"
          echo
          echo "=== APPROVALS ==="
          curl -fsS "http://127.0.0.1:8091/products/$PRODUCT_ID/approvals?limit=10"
          echo
          echo "=== ARTIFACTS ==="
          curl -fsS "http://127.0.0.1:8091/products/$PRODUCT_ID/artifacts?limit=20"
          echo
          REMOTE
