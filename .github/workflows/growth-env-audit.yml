name: Growth env audit (read-only)

# Разовая проверка только на чтение: какие переменные есть в текущем .env и
# где на сервере лежат прежние копии с настройками whiteboard. Печатаются
# только ИМЕНА переменных, пути и даты — никаких значений. Удалить после запуска.

on:
  push:
    branches: [ccr-545c5158-rcd05z]
    paths: ['.github/workflows/growth-env-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Audit
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@155.212.162.47 'bash -s' <<'REMOTE'
          for c in ai-growth-os-api-1 ai-growth-os-worker-1; do
            echo "== $c: non-empty settings (names only)"
            docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$c" | grep -E '^(OPENROUTER|WHITEBOARD|STUDIO|JEFF|CONTENT_|AGENT_|TELEGRAM_PROXY|COMMENT_|INTELLIGENCE|LLM_)[A-Z_]*=.+' | cut -d= -f1 | sort | tr '\n' ' '; echo
            echo "-- compose files: $(docker inspect -f '{{index .Config.Labels "com.docker.compose.project.config_files"}}' $c)"
          done
          F=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project.config_files"}}' ai-growth-os-api-1 | tr ',' ' ')
          for f in $F; do echo "== $f: env_file / openrouter / whiteboard lines (values hidden)"; grep -nE 'env_file|OPENROUTER|WHITEBOARD|^\s{2}[a-z-]+:$' "$f" | sed -E 's/(=|: ).*\$\{/\1${/; s/(KEY|PASSWORD|TOKEN)=[^$].*/\1=***/'; done
          echo "== deploy.json keys"; python3 -c "import json; d=json.load(open('/opt/ai_growth_os/deploy/deploy.json')); print({k:(sorted(v) if isinstance(v,dict) else v) for k,v in d.items()})" 2>&1 | head -5
          echo "== files under /opt/ai_growth_os with OPENROUTER (names only)"; grep -rlsI --exclude-dir=releases --exclude-dir=whiteboard-releases --exclude-dir=_whiteboard -e 'OPENROUTER_API_KEY' /opt/ai_growth_os /opt/servgo-releases 2>/dev/null | grep -v '\.py$\|\.md$' | head
          REMOTE
