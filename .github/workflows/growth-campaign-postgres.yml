name: Growth campaign PostgreSQL locks

on:
  pull_request:
    paths:
      - 'app/services/campaign_lifecycle.py'
      - 'app/services/campaign_readiness.py'
      - 'app/services/experiment_launch.py'
      - 'app/communications/outreach.py'
      - 'app/content/telegram_publishing.py'
      - 'app/workflows/team_cycle.py'
      - 'app/workflows/research_department.py'
      - 'tests/test_campaign_postgres.py'
      - '.github/workflows/growth-campaign-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growth-campaign-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  locks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campaign_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: campaign_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campaign_test -d campaign_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CAMPAIGN_PG_TEST_URL: postgresql+psycopg://campaign_test:local_test_only@127.0.0.1:5432/campaign_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e '.[test]'
      - name: Test real PostgreSQL transaction locks
        run: python -m pytest -q tests/test_campaign_postgres.py
