name: Studio reusable task/material resource widgets

on:
  pull_request:
    paths:
      - "app/api/studio_resource_widgets.py"
      - "app/dispatcher/decision.py"
      - "app/dispatcher/service.py"
      - "app/dispatcher/blocks.py"
      - "app/dispatcher/workflows.py"
      - "app/dispatcher/models.py"
      - "alembic/versions/0017_dispatcher_durable_workflows.py"
      - "app/api/content_studio.py"
      - "app/api/content_studio_ui.py"
      - "app/content/review.py"
      - "app/content/review_dashboard.py"
      - "app/seo/diagnostics.py"
      - "app/dispatcher/home_summary.py"
      - "app/api/assets/growth-daily.js"
      - "app/dispatcher/materials.py"
      - "app/api/content_studio_activity.py"
      - "app/api/growth_v4.py"
      - "app/api/dispatcher.py"
      - "app/api/dispatcher_assets/**"
      - "studio_ui_sdk/resource-widgets-smoke.mjs"
      - "studio_ui_sdk/workflow-smoke.mjs"
      - "studio_ui_sdk/durable-workflow-smoke.mjs"
      - "tests/test_content_studio.py"
      - "tests/test_studio_review_history.py"
      - "tests/test_seo_diagnostics.py"
      - "tests/test_content_studio_v5.py"
      - "tests/test_dispatcher_workflows.py"
      - "tests/test_dispatcher_api.py"
      - "tests/test_dispatcher.py"
      - "tests/test_studio_resource_widgets.py"
      - ".github/workflows/studio-resource-widgets-ui-sdk.yml"
  push:
    branches: [feature/studio-resource-widgets-ui-sdk-20261117]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-resource-widgets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-widgets:
    if: github.repository == 'grunvald91/Ai_growth_os'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: python -m pip install -e '.[test]'
      - name: Compile and test Studio resources and dispatcher
        run: |
          python -m compileall -q app/content/review.py app/content/review_dashboard.py app/seo/diagnostics.py app/dispatcher/home_summary.py app/api/studio_resource_widgets.py app/api/content_studio.py app/api/content_studio_ui.py app/api/content_studio_activity.py app/api/growth_v4.py app/api/dispatcher.py
          python -m pytest -q tests/test_studio_resource_widgets.py tests/test_content_studio.py tests/test_studio_review_history.py tests/test_seo_diagnostics.py tests/test_content_studio_v5.py tests/test_studio_ui_sdk_pilot.py tests/test_dispatcher.py tests/test_dispatcher_workflows.py tests/test_dispatcher_api.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser code syntax
        run: |
          node --check app/api/assets/growth-daily.js
          node --check app/api/dispatcher_assets/dispatcher.js
          node --check app/api/dispatcher_assets/resource-widgets.js
          node --check studio_ui_sdk/resource-widgets-smoke.mjs
          node --check studio_ui_sdk/workflow-smoke.mjs
          node --check studio_ui_sdk/durable-workflow-smoke.mjs
      - name: Install pinned UI SDK
        working-directory: studio_ui_sdk
        run: npm ci --no-audit --no-fund
      - name: Rebuild and check unchanged vendor bundle
        run: |
          cd studio_ui_sdk && npm run build && cd ..
          git diff --exit-code -- app/api/dispatcher_assets/ui-sdk-pilot.bundle.js
      - name: Browser smoke 390px and 1280px
        working-directory: studio_ui_sdk
        run: |
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          SERVGO_CHROME_PATH="$(command -v google-chrome)" node resource-widgets-smoke.mjs
          SERVGO_CHROME_PATH="$(command -v google-chrome)" node workflow-smoke.mjs
          SERVGO_CHROME_PATH="$(command -v google-chrome)" node durable-workflow-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-resource-widgets
          path: studio-resource-widgets-*.png
          retention-days: 7
          if-no-files-found: ignore
