name: Studio dispatcher plan change UI SDK

on:
  pull_request:
    paths:
      - "app/dispatcher/**"
      - "app/content/plan_edit.py"
      - "app/api/dispatcher.py"
      - "app/api/dispatcher_assets/**"
      - "studio_ui_sdk/**"
      - "tests/test_dispatcher_plan_changes.py"
      - ".github/workflows/studio-plan-chat-ui-sdk.yml"
  push:
    branches: [feature/studio-chat-plan-edit-20261116]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-plan-chat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-chat:
    if: github.repository == 'grunvald91/Ai_growth_os'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: python -m pip install -e '.[test]'
      - name: Check Python syntax
        run: python -m compileall -q app/dispatcher app/content/plan_edit.py tests/test_dispatcher_plan_changes.py
      - name: Dispatcher and calendar tests
        run: python -m pytest -q tests/test_dispatcher_plan_changes.py tests/test_dispatcher.py tests/test_content_calendar.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify dispatcher script syntax
        run: |
          node --check app/api/dispatcher_assets/dispatcher.js
          node --check studio_ui_sdk/plan-change-smoke.mjs
      - name: Install locked UI SDK
        working-directory: studio_ui_sdk
        run: npm ci --no-audit --no-fund
      - name: Rebuild and verify pinned bundle is unchanged
        run: |
          cd studio_ui_sdk && npm run build && cd ..
          git diff --exit-code -- app/api/dispatcher_assets/ui-sdk-pilot.bundle.js
      - name: Browser smoke mobile and desktop
        working-directory: studio_ui_sdk
        run: |
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          SERVGO_CHROME_PATH="$(command -v google-chrome)" node plan-change-smoke.mjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-plan-chat
          path: studio-plan-chat-*.png
          if-no-files-found: ignore
          retention-days: 7
