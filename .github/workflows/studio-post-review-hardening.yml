name: Studio post-review UI SDK hardening

on:
  push:
    branches: [fix/studio-post-review-v4-version-20261115]
  pull_request:
    paths:
      - 'studio_ui_sdk/**'
      - 'app/api/dispatcher_assets/**'
      - 'app/api/dispatcher.py'
      - 'app/api/growth_v4.py'
      - 'app/dispatcher/**'
      - 'tests/test_dispatcher_materials.py'
      - 'tests/test_growth_live.py'
      - 'tests/test_studio_ui_sdk_pilot.py'
      - '.github/workflows/studio-post-review-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-post-review-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.repository == 'grunvald91/Ai_growth_os'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ github.event_name == 'push' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned UI SDK
        working-directory: studio_ui_sdk
        run: npm ci --no-audit --no-fund
      - name: Build self-hosted UI SDK module
        working-directory: studio_ui_sdk
        run: npm run build
      - name: Check browser JS and module
        run: |
          node --check app/api/dispatcher_assets/dispatcher.js
          node --check app/api/dispatcher_assets/ui-sdk-pilot.bundle.js
          if grep -Eq 'https?://ui-sdk.dev|https?://cdn\.' app/api/dispatcher_assets/ui-sdk-pilot.bundle.js; then
            exit 1
          fi
      - name: Smoke-test native Chrome interaction
        working-directory: studio_ui_sdk
        run: |
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          SERVGO_CHROME_PATH="$(command -v google-chrome)" node browser-smoke.mjs
      - name: Attach UI review screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-post-review-hardening
          path: studio-ui-sdk-mobile-smoke.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify dispatcher material version and backend API
        run: python -m pytest -q tests/test_dispatcher_materials.py tests/test_dispatcher_api.py tests/test_studio_ui_sdk_pilot.py tests/test_growth_live.py
      - name: Vendor reproducible bundle only on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/studio-post-review-v4-version-20261115'
        run: |
          git add app/api/dispatcher_assets/ui-sdk-pilot.bundle.js
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'build(studio): vendor reviewed Collapsible SDK'
            git push origin HEAD:fix/studio-post-review-v4-version-20261115
          fi
      - name: Ensure generated bundle matches repository
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- app/api/dispatcher_assets/ui-sdk-pilot.bundle.js
