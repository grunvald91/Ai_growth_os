name: E2E ServGo content package

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/e2e-servgo-content.yml'

permissions:
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      EXPECTED_RELEASE: c5979176ecf57936ac0b457afafd3bcb51cd834d

    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Queue one durable ServGo content package without publication
        run: |
          set -euo pipefail
          [ -n "$SSHPASS" ]
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=20"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "EXPECTED_RELEASE='$EXPECTED_RELEASE' bash -s" <<'REMOTE'
          set -euo pipefail
          CURRENT="$(basename "$(readlink /opt/ai_growth_os/current)")"
          echo "Current release: $CURRENT"
          [ "$CURRENT" = "$EXPECTED_RELEASE" ] || { echo "Expected deployed release $EXPECTED_RELEASE; refusing E2E queue."; exit 42; }
          cd /opt/ai_growth_os/current
          docker compose --env-file /opt/ai_growth_os/.env -p ai-growth-os -f docker-compose.prod.yml exec -T api python - <<'PY'
          import json
          from sqlalchemy import select

          from app.content.service import queue_content
          from app.db.session import SessionLocal
          from app.models.domain import Artifact, Product

          PACKAGE_KEY = "pkg_booking_path"

          with SessionLocal() as db:
              product = db.scalar(select(Product).where(Product.slug == "servgo"))
              if product is None:
                  raise SystemExit("ServGo not found")
              plan_row = db.scalar(
                  select(Artifact)
                  .where(Artifact.product_id == product.id, Artifact.kind == "editorial_plan")
                  .order_by(Artifact.created_at.desc(), Artifact.id.desc())
                  .limit(1)
              )
              if plan_row is None:
                  raise SystemExit("No editorial plan")
              plan = json.loads(plan_row.content)
              slots = [s for s in (plan.get("slots") or []) if s.get("package_key") == PACKAGE_KEY]
              if not slots:
                  raise SystemExit("Package not found in latest plan")

              topic = slots[0]["topic"]
              audience = slots[0].get("audience")
              objective = slots[0].get("objective") or ""
              channels = ", ".join(sorted({s.get("platform", "") for s in slots if s.get("platform")}))
              brief = (
                  f"Безопасный E2E-прогон по свежему редакционному плану. "
                  f"Цель пакета: {objective}\nПлощадки: {channels}\n"
                  "Подготовить готовые черновики материалов и production-ready брифы Shorts/Reels. "
                  "Ничего не публиковать и не отправлять наружу."
              )
              dedupe_key = f"e2e-safe-v2:{plan_row.id}:{PACKAGE_KEY}"
              task = queue_content(
                  db, product.id, topic,
                  commit=False,
                  dedupe_key=dedupe_key,
                  audience=audience,
                  editorial_brief=brief,
              )
              request = db.scalar(
                  select(Artifact)
                  .where(Artifact.task_id == task.id, Artifact.kind == "content_request")
                  .order_by(Artifact.created_at.desc(), Artifact.id.desc())
                  .limit(1)
              )
              if request is None:
                  raise SystemExit("Content request missing")
              payload = json.loads(request.content)
              payload["request_publication"] = False
              payload["produce_ready_assets"] = True
              request.content = json.dumps(payload, ensure_ascii=False)
              db.commit()
              print("SAFE_E2E_TASK_ID=" + str(task.id))
              print("SAFE_E2E_PLAN_ID=" + str(plan_row.id))
              print("SAFE_E2E_PACKAGE=" + PACKAGE_KEY)
              print("SAFE_E2E_TOPIC=" + topic)
          PY
          REMOTE
