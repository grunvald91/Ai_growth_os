name: VK postrelease runtime verification (one-shot read-only)
on:
  push:
    branches: [ops/vk-release-readonly-verify-20261120]
permissions:
  contents: read
jobs:
  verify:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'paramiko>=3.4,<4'
      - name: Verify live API/worker release and VK setup authorization
        env:
          HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
          SERVER_SSH_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, os, shlex, socket, paramiko
          host=os.environ["HOST"]
          secret=os.environ.get("SERVER_SSH_PASSWORD")
          if not secret: raise RuntimeError("Missing SSH authorization")
          sock=socket.create_connection((host,22),timeout=20)
          t=paramiko.Transport(sock)
          try:
              t.start_client(timeout=20)
              fingerprint=base64.b64encode(hashlib.sha256(t.get_remote_server_key().asbytes()).digest()).decode().rstrip("=")
              if fingerprint != "uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU":
                  raise RuntimeError("Pinned SSH host fingerprint mismatch")
              t.auth_password("root",secret)
              if not t.is_authenticated(): raise RuntimeError("SSH authorization denied")
              commands=[
                  "docker exec ai-growth-os-api-1 python -c "+shlex.quote("import os\nfrom app.core.config import get_settings\nfrom app.vk_service import group_app_credentials, group_app_verified, platform_service_token\nfrom app.social_vk import GROUP_OAUTH_PATH, begin_community_oauth\nsettings=get_settings()\nprint(\"api_release=\"+str(settings.release_sha))\nprint(\"api_vk_autopost_enabled=\"+str(settings.content_vk_autopost_enabled).lower())\nprint(\"vk_oauth_app_configured=\"+str(bool(group_app_credentials(settings))).lower())\nprint(\"vk_oauth_app_verified=\"+str(group_app_verified(settings)).lower())\nprint(\"vk_comments_service_key_present=\"+str(bool(platform_service_token(settings))).lower())\nprint(\"vk_oauth_handler_present=\"+str(callable(begin_community_oauth) and GROUP_OAUTH_PATH.endswith(\"/group-callback\")).lower())"),
                  "docker exec ai-growth-os-worker-1 python -c "+shlex.quote("from app.core.config import get_settings\ns=get_settings()\nprint(\"worker_release=\"+str(s.release_sha))\nprint(\"worker_vk_autopost_enabled=\"+str(s.content_vk_autopost_enabled).lower())"),
                  "curl -sS -o /dev/null -w 'vk_setup_unauth_http=%{http_code}\\n' --max-time 12 http://127.0.0.1:8091/studio/tune/vk",
                  "curl -sS -o /dev/null -w 'api_health_http=%{http_code}\\n' --max-time 12 http://127.0.0.1:8091/health",
              ]
              for command in commands:
                  ch=t.open_session(timeout=20)
                  ch.exec_command(command)
                  out=ch.makefile("r",-1).read(5000).decode("utf-8","replace").strip()
                  print(out)
                  if ch.recv_exit_status()!=0: raise RuntimeError("Read-only health check failed")
          finally:
              t.close()
          PY
