name: ProResultat planner status (read-only)

on:
  push:
    branches: [ops/proresultat-status-20261113]
    paths:
      - .github/workflows/proresultat-status-20261113.yml

permissions:
  contents: read

concurrency:
  group: proresultat-planner-readonly
  cancel-in-progress: false

jobs:
  status:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
      HOST_FP: uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU
    steps:
      - name: Read production task, attempts, draft status (no business content)
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$SSHPASS" ] || { echo "::error::Server SSH credential not available"; exit 1; }
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > /tmp/scanned
          while read -r line; do
            printf '%s\n' "$line" > /tmp/one
            ssh-keygen -lf /tmp/one 2>/dev/null | grep -q "SHA256:$HOST_FP " && printf '%s\n' "$line" >> ~/.ssh/known_hosts
          done < /tmp/scanned
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Server host key mismatch or SSH offline"; exit 1; }
          cat > /tmp/inspect.py <<'PY'
          import hashlib
          import json
          from collections import Counter
          from sqlalchemy import select, func, or_
          from app.db.session import SessionLocal
          from app.models.domain import Product, Task, AgentRun, Artifact, TaskStatus, Publication, ArtifactStatus
          
          TARGET_HASH = 'cacb3ec7f0e8edfbf9f73c3040498872391547147f2545cd0d82fb183e04263b'
          try:
              with SessionLocal() as db:
                  candidate_count = db.scalar(select(func.count()).select_from(Product).where(
                      or_(func.lower(Product.name).like('%result%'),
                          func.lower(Product.slug).like('%result%'),
                          func.lower(Product.name).like('%результат%'),
                          func.lower(Product.slug).like('%rezultat%'))))
                  print('candidate_companies', candidate_count)
                  ids = list(db.scalars(select(Task.id).where(Task.assigned_agent == 'editorial_planner')))
                  matching = [task_id for task_id in ids if hashlib.sha256(str(task_id).encode()).hexdigest() == TARGET_HASH]
                  print('planner_total', len(ids), 'target_matches', len(matching))
                  if matching:
                      task = db.get(Task, matching[0])
                      company = db.get(Product, task.product_id)
                      print('task', 'status', task.status.value, 'agent', task.assigned_agent,
                            'created', str(task.created_at)[:19], 'updated', str(task.updated_at)[:19])
                      print('target_company_exists', bool(company))
                      from app.sso.models import StudioBusinessLink
                      from app.models.domain import Publication, ArtifactStatus
                      scoped_publications = list(db.scalars(select(Publication).join(
                          Artifact, Artifact.id == Publication.artifact_id
                      ).where(Publication.product_id == task.product_id,
                              Publication.channel == 'own_site',
                              Artifact.kind == 'article')))
                      valid_published = sum(1 for p in scoped_publications
                          if p.status == 'published' and db.get(Artifact, p.artifact_id).status == ArtifactStatus.PUBLISHED)
                      business_link = db.scalar(select(StudioBusinessLink).where(
                          StudioBusinessLink.product_id == task.product_id).limit(1))
                      all_articles = list(db.scalars(select(Artifact).where(
                          Artifact.product_id == task.product_id,
                          Artifact.kind == 'article')))
                      print('proresultat_geo_business_link_exists', bool(business_link))
                      print('proresultat_geo_article_artifact_count', len(all_articles))
                      print('proresultat_geo_published_article_count', valid_published)
                      print('proresultat_geo_own_site_publication_status_counts',
                            dict(Counter(pub.status for pub in scoped_publications)))

                      tasks = list(db.scalars(select(Task).where(
                          Task.product_id == task.product_id, Task.assigned_agent == 'editorial_planner'
                      ).order_by(Task.created_at.desc(), Task.id.desc()).limit(8)))
                      for i, other in enumerate(tasks):
                          print('other_task', i, 'same_as_target', other.id == task.id,
                                'status', other.status.value, 'created', str(other.created_at)[:19])
                      runs = list(db.scalars(select(AgentRun).where(AgentRun.task_id == task.id)
                          .order_by(AgentRun.started_at.desc(), AgentRun.id.desc()).limit(8)))
                      print('target_runs', len(runs))
                      for run in runs:
                          err = (run.error or '').split(':')
                          family = err[0] if err else 'none'
                          stage = err[1] if len(err) > 1 else 'none'
                          if not family.replace('_','').isalnum(): family = 'unclassified'
                          if not stage.replace('_','').isalnum(): stage = 'unclassified'
                          print('validation_signature', [''.join(c for c in part if c.isascii() and (c.isalnum() or c in '._-'))[:70] for part in err[2:5]])
                          print('run', run.status, 'model', run.model, 'error_family', family[:35],
                                'error_stage', stage[:35], 'started', str(run.started_at)[:19],
                                'finished', str(run.finished_at)[:19])
                      plans = list(db.scalars(select(Artifact).where(
                          Artifact.product_id == task.product_id, Artifact.kind == 'editorial_plan'
                      ).order_by(Artifact.created_at.desc(), Artifact.id.desc()).limit(6)))
                      print('editorial_plans', len(plans))
                      for row in plans:
                          try:
                              data = json.loads(row.content)
                              state = data.get('approval_state', 'unknown')
                              slots = len(data.get('slots') or [])
                          except (TypeError, ValueError, AttributeError):
                              state, slots = 'invalid_json', -1
                          print('plan', 'from_target', row.task_id == task.id, 'state', state,
                                'slots', slots, 'artifact_status', row.status.value,
                                'created', str(row.created_at)[:19])
                  # GEO P0: aggregate public-publishing eligibility without tenant payloads.
                  from app.sso.models import StudioBusinessLink
                  public_products = set(db.scalars(
                      select(Publication.product_id).join(Artifact, Artifact.id == Publication.artifact_id)
                      .where(Publication.channel == 'own_site', Publication.status == 'published',
                             Artifact.status == ArtifactStatus.PUBLISHED, Artifact.kind == 'article')
                      .distinct()))
                  linked_products = set(db.scalars(select(StudioBusinessLink.product_id).distinct()))
                  linked_public = public_products & linked_products
                  print('geo_public_article_product_count', len(public_products),
                        'geo_linked_public_business_count', len(linked_public),
                        'geo_studio_business_links_count', len(linked_products))
                  servgo = db.scalar(select(Product).where(Product.slug == 'servgo').limit(1))
                  print('servgo_seo_company_exists', bool(servgo))
                  if servgo:
                      factory_tasks = list(db.scalars(select(Task).where(
                          Task.product_id == servgo.id, Task.assigned_agent == 'seo_factory'
                      ).order_by(Task.created_at.desc()).limit(4)))
                      for index, task in enumerate(factory_tasks):
                          print('seo_factory_task', index, task.status.value, 'created', str(task.created_at)[:19])
                      article_tasks = list(db.scalars(select(Task).where(
                          Task.product_id == servgo.id, Task.assigned_agent == 'content_factory',
                          Task.title.like('SEO-ARTICLE:%')
                      ).order_by(Task.created_at.desc()).limit(12)))
                      from collections import Counter
                      print('seo_articles_status_counts', dict(Counter(t.status.value for t in article_tasks)))

                      all_failed_seo = list(db.scalars(select(Task).where(
                          Task.product_id == servgo.id, Task.assigned_agent == 'content_factory',
                          Task.title.like('SEO-ARTICLE:%'), Task.status == TaskStatus.FAILED,
                      ).order_by(Task.created_at.desc(), Task.id.desc())))
                      print('seo_failed_all_count', len(all_failed_seo))
                      recent_set = {t.id for t in article_tasks}
                      for row in all_failed_seo[:20]:
                          last_run = db.scalar(select(AgentRun).where(
                              AgentRun.task_id == row.id,
                          ).order_by(AgentRun.started_at.desc(), AgentRun.id.desc()).limit(1))
                          phase = (last_run.error or 'none').split(':')[0] if last_run else 'no_run'
                          print('seo_failed_record', hashlib.sha256(str(row.id).encode()).hexdigest()[:24],
                                'recent12', row.id in recent_set,
                                'created', str(row.created_at)[:19], 'updated', str(row.updated_at)[:19],
                                'error_phase', ''.join(c for c in phase if c.isascii() and
                                                    (c.isalnum() or c in '_-'))[:65])

                      from app.seo.activation import editorial_preferences
                      from app.seo.queue import articles_started_today
                      p = editorial_preferences(db, servgo.id)
                      from app.seo.activation import SeoFactoryActivation
                      override = db.get(SeoFactoryActivation, servgo.id)
                      print('seo_explicit_article_limit', override.articles_per_day if override else None)
                      from app.core.config import get_settings
                      print('seo_config_articles_per_day', get_settings().seo_articles_per_day)

                      import inspect
                      from app.content import worker as seo_worker
                      from app.seo import publishing as seo_publishing
                      worker_source = inspect.getsource(seo_worker.run_content_once)
                      publishing_source = inspect.getsource(seo_publishing.publish_if_clear)
                      print('seo_prepare_ahead_code_deployed', 'last_transient_retry' in worker_source)
                      print('seo_publish_schedule_guard_deployed', 'scheduled_for_later' in publishing_source)
                      import os
                      print('seo_config_override_in_env', 'SEO_ARTICLES_PER_DAY' in os.environ)
                      print('seo_explicit_publication_limit', override.publications_per_day if override else None)
                      print('seo_daily_limit', p.articles_per_day,
                            'local_tz', p.timezone_name,
                            'started_today', articles_started_today(db, product_id=servgo.id))
                      for t in article_tasks:
                          if t.status == TaskStatus.QUEUED:
                              print('seo_queued_due', str(t.due_at)[:19])
                      from app.models.domain import Publication
                      pub_statuses = list(db.scalars(select(Publication.status).where(
                          Publication.product_id == servgo.id, Publication.channel == 'own_site'
                      )))
                      print('seo_site_publication_status_counts', dict(Counter(pub_statuses)))

                      for index, task in enumerate(article_tasks[:8]):
                          print('seo_article_task', index, task.status.value, 'updated', str(task.updated_at)[:19])
                          if task.status == TaskStatus.FAILED:
                              runs = list(db.scalars(select(AgentRun).where(
                                  AgentRun.task_id == task.id
                              ).order_by(AgentRun.started_at.desc(), AgentRun.id.desc()).limit(6)))
                              print('seo_failed_runs', index, len(runs))
                              from app.models.domain import CostRecord
                              cost_rows = list(db.scalars(select(CostRecord).where(
                                  CostRecord.agent_run_id.in_([run.id for run in runs])
                              ).limit(250)))
                              print('seo_failed_cost_stage_counts', index,
                                    dict(Counter(str((row.details or {}).get('llm_stage', 'none'))
                                                 for row in cost_rows)))
                              for run in runs:
                                  parts = (run.error or '').split(':')
                                  safe_codes = [''.join(c for c in value if c.isascii() and (c.isalnum() or c in '._-'))[:65] for value in parts[:4]]
                                  print('seo_failed_run', index, run.agent_name, run.status, 'error_parts', safe_codes,
                                        'model', run.model, 'finished', str(run.finished_at)[:19])
                  print('queued_editorial_total', db.scalar(select(func.count()).select_from(Task).where(
                      Task.assigned_agent == 'editorial_planner', Task.status == TaskStatus.QUEUED)))
                  print('running_editorial_total', db.scalar(select(func.count()).select_from(Task).where(
                      Task.assigned_agent == 'editorial_planner', Task.status == TaskStatus.RUNNING)))
          except Exception as exc:
              print('diagnostic_failed_type', type(exc).__name__)
              raise SystemExit(2)
          PY
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" "docker exec -i ai-growth-os-api-1 python -" < /tmp/inspect.py

