name: ProResultat planner status (read-only)

on:
  push:
    branches: [ops/proresultat-status-20261113]
    paths:
      - .github/workflows/proresultat-status-20261113.yml

permissions:
  contents: read

concurrency:
  group: proresultat-planner-readonly
  cancel-in-progress: false

jobs:
  status:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
      HOST_FP: uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU
    steps:
      - name: Read production task, attempts, draft status (no business content)
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$SSHPASS" ] || { echo "::error::Server SSH credential not available"; exit 1; }
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > /tmp/scanned
          while read -r line; do
            printf '%s\n' "$line" > /tmp/one
            ssh-keygen -lf /tmp/one 2>/dev/null | grep -q "SHA256:$HOST_FP " && printf '%s\n' "$line" >> ~/.ssh/known_hosts
          done < /tmp/scanned
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Server host key mismatch or SSH offline"; exit 1; }
          cat > /tmp/inspect.py <<'PY'
          import hashlib
          import json
          from sqlalchemy import select, func, or_
          from app.db.session import SessionLocal
          from app.models.domain import Product, Task, AgentRun, Artifact, TaskStatus
          
          TARGET_HASH = 'cacb3ec7f0e8edfbf9f73c3040498872391547147f2545cd0d82fb183e04263b'
          try:
              with SessionLocal() as db:
                  candidate_count = db.scalar(select(func.count()).select_from(Product).where(
                      or_(func.lower(Product.name).like('%result%'),
                          func.lower(Product.slug).like('%result%'),
                          func.lower(Product.name).like('%результат%'),
                          func.lower(Product.slug).like('%rezultat%'))))
                  print('candidate_companies', candidate_count)
                  ids = list(db.scalars(select(Task.id).where(Task.assigned_agent == 'editorial_planner')))
                  matching = [task_id for task_id in ids if hashlib.sha256(str(task_id).encode()).hexdigest() == TARGET_HASH]
                  print('planner_total', len(ids), 'target_matches', len(matching))
                  if matching:
                      task = db.get(Task, matching[0])
                      company = db.get(Product, task.product_id)
                      print('task', 'status', task.status.value, 'agent', task.assigned_agent,
                            'created', str(task.created_at)[:19], 'updated', str(task.updated_at)[:19])
                      print('target_company_exists', bool(company))
                      tasks = list(db.scalars(select(Task).where(
                          Task.product_id == task.product_id, Task.assigned_agent == 'editorial_planner'
                      ).order_by(Task.created_at.desc(), Task.id.desc()).limit(8)))
                      for i, other in enumerate(tasks):
                          print('other_task', i, 'same_as_target', other.id == task.id,
                                'status', other.status.value, 'created', str(other.created_at)[:19])
                      runs = list(db.scalars(select(AgentRun).where(AgentRun.task_id == task.id)
                          .order_by(AgentRun.started_at.desc(), AgentRun.id.desc()).limit(8)))
                      print('target_runs', len(runs))
                      for run in runs:
                          err = (run.error or '').split(':')
                          family = err[0] if err else 'none'
                          stage = err[1] if len(err) > 1 else 'none'
                          if not family.replace('_','').isalnum(): family = 'unclassified'
                          if not stage.replace('_','').isalnum(): stage = 'unclassified'
                          print('validation_signature', [''.join(c for c in part if c.isascii() and (c.isalnum() or c in '._-'))[:70] for part in err[2:5]])
                          print('run', run.status, 'model', run.model, 'error_family', family[:35],
                                'error_stage', stage[:35], 'started', str(run.started_at)[:19],
                                'finished', str(run.finished_at)[:19])
                      plans = list(db.scalars(select(Artifact).where(
                          Artifact.product_id == task.product_id, Artifact.kind == 'editorial_plan'
                      ).order_by(Artifact.created_at.desc(), Artifact.id.desc()).limit(6)))
                      print('editorial_plans', len(plans))
                      for row in plans:
                          try:
                              data = json.loads(row.content)
                              state = data.get('approval_state', 'unknown')
                              slots = len(data.get('slots') or [])
                          except (TypeError, ValueError, AttributeError):
                              state, slots = 'invalid_json', -1
                          print('plan', 'from_target', row.task_id == task.id, 'state', state,
                                'slots', slots, 'artifact_status', row.status.value,
                                'created', str(row.created_at)[:19])
                  servgo = db.scalar(select(Product).where(Product.slug == 'servgo').limit(1))
                  print('servgo_seo_company_exists', bool(servgo))
                  if servgo:
                      factory_tasks = list(db.scalars(select(Task).where(
                          Task.product_id == servgo.id, Task.assigned_agent == 'seo_factory'
                      ).order_by(Task.created_at.desc()).limit(4)))
                      for index, task in enumerate(factory_tasks):
                          print('seo_factory_task', index, task.status.value, 'created', str(task.created_at)[:19])
                      article_tasks = list(db.scalars(select(Task).where(
                          Task.product_id == servgo.id, Task.assigned_agent == 'content_factory',
                          Task.title.like('SEO-ARTICLE:%')
                      ).order_by(Task.created_at.desc()).limit(12)))
                      from collections import Counter
                      print('seo_articles_status_counts', dict(Counter(t.status.value for t in article_tasks)))
                      for index, task in enumerate(article_tasks[:8]):
                          print('seo_article_task', index, task.status.value, 'updated', str(task.updated_at)[:19])
                          if task.status == TaskStatus.FAILED:
                              runs = list(db.scalars(select(AgentRun).where(
                                  AgentRun.task_id == task.id
                              ).order_by(AgentRun.started_at.desc(), AgentRun.id.desc()).limit(6)))
                              print('seo_failed_runs', index, len(runs))
                              for run in runs:
                                  parts = (run.error or '').split(':')
                                  safe_codes = [''.join(c for c in value if c.isascii() and (c.isalnum() or c in '._-'))[:65] for value in parts[:4]]
                                  print('seo_failed_run', index, run.agent_name, run.status, 'error_parts', safe_codes,
                                        'model', run.model, 'finished', str(run.finished_at)[:19])
                  print('queued_editorial_total', db.scalar(select(func.count()).select_from(Task).where(
                      Task.assigned_agent == 'editorial_planner', Task.status == TaskStatus.QUEUED)))
                  print('running_editorial_total', db.scalar(select(func.count()).select_from(Task).where(
                      Task.assigned_agent == 'editorial_planner', Task.status == TaskStatus.RUNNING)))
          except Exception as exc:
              print('diagnostic_failed_type', type(exc).__name__)
              raise SystemExit(2)
          PY
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" "docker exec -i ai-growth-os-api-1 python -" < /tmp/inspect.py

# Read-only status refresh after guarded retry 2026-11-13

# Read-only status refresh after active writer verification, attempt 2
