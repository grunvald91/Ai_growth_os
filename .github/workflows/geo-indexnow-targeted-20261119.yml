name: GEO IndexNow scoped regression (no media tools)

on:
  push:
    branches: [ops/geo-indexnow-targeted-20261119]
    paths: [.github/workflows/geo-indexnow-targeted-20261119.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python test dependencies (no network during tests)
        run: python -m pip install -e '.[test]'
      - name: Run IndexNow and SEO publication regression
        run: python -m pytest -q tests/test_geo_indexnow.py tests/test_seo_publishing.py
