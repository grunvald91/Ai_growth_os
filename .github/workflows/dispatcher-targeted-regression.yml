name: Dispatcher targeted regression
on:
  push:
    branches:
      - fix/dispatcher-latency-recommendations-videos-20261031
    paths:
      - .github/workflows/dispatcher-targeted-regression.yml
      - app/dispatcher/fast_routes.py
      - app/dispatcher/owner_views.py
      - app/dispatcher/service.py
      - app/api/dispatcher_assets/dispatcher.js
      - tests/test_dispatcher_fast_owner.py
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate dispatcher owner actions and API
        run: python -m pytest -q tests/test_dispatcher_fast_owner.py tests/test_dispatcher.py tests/test_dispatcher_api.py tests/test_growth_voice_recency.py
      - name: Syntax checks
        run: |
          python -m py_compile app/dispatcher/fast_routes.py app/dispatcher/owner_views.py app/dispatcher/service.py
          node --check app/api/dispatcher_assets/dispatcher.js
