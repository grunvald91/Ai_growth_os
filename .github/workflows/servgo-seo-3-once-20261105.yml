name: ServGo SEO 2+1 one-time publication

on:
  push:
    branches: [ops/servgo-seo-3-manual-action-20261105]
    paths: [.github/workflows/servgo-seo-3-once-20261105.yml]

permissions:
  contents: read

concurrency:
  group: servgo-seo-3-publication-once
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'grunvald91/Ai_growth_os'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 100
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
      HOST_FP: uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU
    steps:
      - name: Verify pinned server identity and access
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$SSHPASS" ] || { echo "::error::SERVER_SSH_PASSWORD is unavailable"; exit 1; }
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > /tmp/host-keys
          while read -r line; do
            printf '%s\n' "$line" > /tmp/host-key
            if ssh-keygen -lf /tmp/host-key 2>/dev/null | grep -q "SHA256:$HOST_FP "; then
              printf '%s\n' "$line" >> ~/.ssh/known_hosts
            fi
          done < /tmp/host-keys
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Pinned host fingerprint mismatch"; exit 1; }
      - name: Inspect exact three article release (read-only)
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" \
            'docker exec ai-growth-os-api-1 python -m app.seo.servgo_three_article_release'
      - name: Revise two owner articles and generate one new with independent critic
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=100 \
            -o ConnectTimeout=20 "root@$HOST" \
            'docker exec ai-growth-os-api-1 python -u -m app.seo.servgo_three_article_release --apply' \
            | tee /tmp/servgo-seo-3-release.log
      - name: Summarize exact result without exposing credentials
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/servgo-seo-3-release.log ]; then
            grep '^SERVGO_THREE_ARTICLES=' /tmp/servgo-seo-3-release.log >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "Release not executed; inspect prior steps." >> "$GITHUB_STEP_SUMMARY"
          fi
