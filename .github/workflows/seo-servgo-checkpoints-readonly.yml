name: One-shot ServGo SEO checkpoints (read-only)
on:
  push:
    branches: [audit/seo-servgo-readonly-20261103]
    paths: [.github/workflows/seo-servgo-checkpoints-readonly.yml]
permissions:
  contents: read
jobs:
  checkpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
      HOST_FP: uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU
    steps:
      - name: Inspect stages, model availability flags and search counts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > /tmp/keys
          while read -r line; do
            echo "$line" > /tmp/key
            ssh-keygen -lf /tmp/key 2>/dev/null | grep -q "SHA256:$HOST_FP " && echo "$line" >> ~/.ssh/known_hosts
          done < /tmp/keys
          test -s ~/.ssh/known_hosts
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" 'docker exec -i ai-growth-os-api-1 python -' <<'PY'
          import json
          from sqlalchemy import select
          from app.core.config import get_settings
          from app.db.session import SessionLocal
          from app.models.domain import Product, Task, Artifact
          c=get_settings()
          print('CONFIG='+json.dumps(dict(model=c.llm_model, fallback=c.llm_fallback_models,
               provider=c.llm_provider, critic=c.agent_critic_enabled,
               primary_key_set=bool(c.xai_api_key), autorun=c.seo_servgo_autorun_enabled)))
          with SessionLocal() as db:
              product=db.scalar(select(Product).where(Product.slug=='servgo'))
              tasks=list(db.scalars(select(Task).where(Task.product_id==product.id,
                  Task.assigned_agent=='seo_factory').order_by(Task.created_at.desc()).limit(3)))
              for task in tasks:
                  arts=list(db.scalars(select(Artifact).where(Artifact.product_id==product.id,
                      Artifact.task_id==task.id).order_by(Artifact.created_at)))
                  stages=[]
                  for a in arts:
                      row=dict(kind=a.kind, time=str(a.created_at))
                      if a.kind=='seo_suggest_checkpoint':
                          try:
                              d=json.loads(a.content)
                              row['seeds_count']=len(d.get('seeds',[]))
                              row['engines']={n:dict(requests=v.get('requests'),failed=v.get('failed'),
                                  queries=len(v.get('queries',[])),completed=len(v.get('completed',[])))
                                  for n,v in d.get('results',{}).items()}
                          except Exception:
                              row['checkpoint_parse_error']=True
                      if a.kind=='seo_factory_report':
                          try:
                              d=json.loads(a.content)
                              row['error_type']=d.get('error')
                          except Exception:
                              row['report_parse_error']=True
                      stages.append(row)
                  print('STAGES='+json.dumps(dict(job_id=str(task.id),status=task.status.value,stages=stages)))
          PY
