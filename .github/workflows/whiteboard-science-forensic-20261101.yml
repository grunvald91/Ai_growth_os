name: Whiteboard science forensic (read-only, one-shot)

# Branch-scoped one-shot forensic. No deployment, no database writes, no model calls.
on:
  push:
    branches:
      - diagnostics/whiteboard-science-20261101

permissions:
  contents: read

concurrency:
  group: forensic-whiteboard-science-once
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'grunvald91/Ai_growth_os' && github.actor == github.repository_owner
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
      HOST_FP: uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU
    steps:
      - name: Inspect existing storyboard job without modifying production
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$SSHPASS" ] || { echo "::error::Read-only SSH password is unavailable"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > /tmp/scanned
          while read -r line; do
            printf '%s\n' "$line" > /tmp/one
            ssh-keygen -lf /tmp/one 2>/dev/null | grep -q "SHA256:$HOST_FP " && printf '%s\n' "$line" >> ~/.ssh/known_hosts
          done < /tmp/scanned
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Pinned SSH host key mismatch"; exit 1; }
          # This reads metadata, storyboards and stage provenance; it prints only bounded
          # structured codes/model IDs/hashes, never client text or full model responses.
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" \
            "docker exec -i ai-growth-os-api-1 python -" <<'PY'
          import hashlib, json, re
          from pathlib import Path
          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models.domain import Task, AgentRun, Artifact
          from app.core.config import get_settings
          from app.content.whiteboard.jobs import job_directory

          def emit(**data):
              print(json.dumps(data, ensure_ascii=False, sort_keys=True, default=str), flush=True)

          def sha(raw):
              return hashlib.sha256(raw).hexdigest()[:20]

          def valid_model(value):
              if isinstance(value, str) and re.fullmatch(r"[a-zA-Z0-9][a-zA-Z0-9._:/-]{0,119}", value):
                  return value
              return "unavailable"

          def traces(text):
              s = " ".join(str(text).lower().replace("ё", "е").split())
              result = []
              # These are diagnostic signals, not a substitute for semantic fact review.
              rules = {
                  "mass_equal_wording": r"(массы? (?:остае[тю]ся |практически |почти )?одинаков|(?:весят|вес) одинаков|равн\w+ масс)",
                  "mass_unchanged_wording": r"(масса .{0,32}не (?:измен|меня|увелич)|не (?:измен|меня|увелич).{0,30}масса)",
                  "mass_increases_wording": r"(масса .{0,40}(?:увелич|раст|становится больш)|(?:тяжелее|массивнее).{0,50}(?:нагрет|горяч|тепл))",
                  "relative_equivalence": r"(e\s*=\s*mc|эйнштейн|энерги.{0,35}масс|масс.{0,35}энерги|c\s*\^\s*2)",
                  "measurement_limit": r"(не (?:замет|улов|измер|фиксир)|слишком мал|практически невозможно|обычны.{0,15}вес)",
                  "mass_does_not_equal_weight": r"(выталкивающ|конвекц|плотност|весах)",
              }
              for key, pattern in rules.items():
                  if re.search(pattern,s):
                      result.append(key)
              return result

          with SessionLocal() as db:
              items = list(db.scalars(select(Task).where(Task.assigned_agent == "whiteboard_renderer")
                        .order_by(Task.created_at.desc()).limit(120)))
              scored = []
              for task in items:
                  req = db.scalar(select(Artifact).where(
                      Artifact.task_id == task.id, Artifact.kind == "whiteboard_request"))
                  if req is None:
                      continue
                  try:
                      payload = json.loads(req.content)
                      topic = payload.get("request",{}).get("topic","")
                  except (TypeError,ValueError):
                      continue
                  low = str(topic).lower().replace("ё","е")
                  score = 3*bool(re.search("горяч|нагрет", low)) + 3*bool("холод" in low)
                  score += 2*bool(re.search("тяжел|масс", low))
                  if score:
                      scored.append((score,task,req,payload))
              scored.sort(key=lambda entry:(entry[0],entry[1].created_at),reverse=True)
              emit(section="candidate_search",recent_jobs=len(items),matches=len(scored))
              for score,task,req,payload in scored[:4]:
                  state = db.scalar(select(Artifact).where(
                      Artifact.task_id==task.id, Artifact.kind=="whiteboard_job_state"))
                  stat = json.loads(state.content) if state else {}
                  models = payload.get("models", {})
                  runs = list(db.scalars(select(AgentRun).where(AgentRun.task_id==task.id)
                          .order_by(AgentRun.started_at)))
                  directory=job_directory(get_settings().products_root,task.product_id,task.id)
                  stage_dir = directory / "stages"
                  emit(section="job",score=score,task_id=str(task.id),
                       created_at=str(task.created_at),job_status=str(task.status),
                       current_stage=stat.get("stage"),calls=stat.get("calls"),
                       visual_review_requested=payload.get("visual_review",False),
                       assigned_storyboard_model=valid_model(models.get("storyboard")),
                       request_digest=sha(req.content.encode()))
                  for run in runs[:45]:
                      emit(section="agent_run",task_id=str(task.id),role=run.agent_name,
                           model=valid_model(run.model),status=str(run.status),started_at=str(run.started_at),
                           finished_at=str(run.finished_at),error_class=(str(run.error).split(":")[-1][:45] if run.error else None))
                  if not stage_dir.is_dir() or stage_dir.is_symlink():
                      emit(section="checkpoint",task_id=str(task.id),state="not_present")
                      continue
                  manifest=stage_dir/"manifest.json"
                  if manifest.is_file() and not manifest.is_symlink():
                      meta=json.loads(manifest.read_text(encoding="utf-8"))
                      emit(section="stage_manifest",task_id=str(task.id),
                           stages={k:v.get("status") for k,v in meta.get("stages",{}).items()
                                   if k in {"storyboard","visual-review","visual-decision"}})
                  frame=stage_dir/"storyboard.data"
                  if frame.is_file() and not frame.is_symlink() and frame.stat().st_size<=64000:
                      raw=frame.read_bytes()
                      board=json.loads(raw)
                      beats=[(si,bi,b.get("narration","")) for si,s in enumerate(board.get("scenes",[]))
                              for bi,b in enumerate(s.get("beats",[]))]
                      emit(section="storyboard",task_id=str(task.id),
                           fingerprint=sha(raw),scenes=len(board.get("scenes",[])),beats=len(beats),
                           signals=[{"scene":si+1,"beat":bi+1,"flags":traces(s)}
                                    for si,bi,s in beats if traces(s)])
                  else:
                      emit(section="storyboard",task_id=str(task.id),state="not_cached")
                  # Actual response model can differ from the configured model after fallback.
                  responses=sorted(stage_dir.glob("storyboard-response-*.json"))
                  for file in responses[:8]:
                      if file.is_symlink() or file.stat().st_size>110000:
                          continue
                      try:
                          response=json.loads(file.read_text(encoding="utf-8"))
                          body=json.loads(response.get("body","{}"))
                          choice=(body.get("choices") or [{}])[0]
                          original=(choice.get("message") or {}).get("content") or ""
                          emit(section="provider_response",task_id=str(task.id),
                               http_status=response.get("http_status"),
                               actual_model=valid_model(body.get("model")),
                               finish_reason=str(choice.get("finish_reason"))[:30],
                               output_hash=sha(original.encode()),
                               provider_signal_count=len(traces(original)))
                      except (ValueError,KeyError,TypeError):
                          emit(section="provider_response",task_id=str(task.id),state="invalid_structure")
                  review=stage_dir/"visual-review.data"
                  if review.is_file() and not review.is_symlink() and review.stat().st_size<=64000:
                      data=json.loads(review.read_text(encoding="utf-8"))
                      emit(section="visual_review",task_id=str(task.id),
                           issues_by_category={cat:sum(i.get("category")==cat for i in data.get("issues",[]))
                           for cat in sorted({i.get("category") for i in data.get("issues",[])})})
                  emit(section="no_mutation",task_id=str(task.id),writes=0,api_model_calls=0)
          PY

# Read-only audit requested by repository owner; no deploy and no paid model calls.
