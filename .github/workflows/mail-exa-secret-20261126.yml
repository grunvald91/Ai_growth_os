name: Provision optional Mail Exa API key
on:
  pull_request:
    paths: ['.github/workflows/mail-exa-secret-20261126.yml']
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/mail-exa-secret-20261126.yml']
permissions:
  contents: read
concurrency:
  group: deploy-server
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - name: Compile both Python scripts without executing them
        run: |
          python - <<'PY'
          import ast, yaml
          from pathlib import Path
          workflow = yaml.safe_load(Path('.github/workflows/mail-exa-secret-20261126.yml').read_text())
          step = workflow['jobs']['provision']['steps'][-1]['run']
          code = step.split("python - <<'PY'\\n",1)[1].rsplit('\\nPY',1)[0]
          tree = ast.parse(code)
          remote = next(n.value.value for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='remote' for t in n.targets))
          compile(code,'provision-local','exec')
          compile(remote,'provision-remote','exec')
          PY
  provision:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SERVGO_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check 'paramiko==3.5.1'
      - name: Provision optional credential through pinned SSH; never print key
        run: |
          python - <<'PY'
          import importlib.util, os, re, shlex
          key = os.environ.get("EXA_API_KEY", "")
          if not key:
              print("EXA_NOT_CONFIGURED; no production changes; other sources unchanged")
              raise SystemExit(0)
          if not re.fullmatch(r"[A-Za-z0-9_.-]{12,512}", key):
              raise SystemExit("EXA_KEY_FORMAT_INVALID; no changes")
          spec = importlib.util.spec_from_file_location("release", "services/booking_bot/scripts/release_yandex_mail.py")
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          remote = r'''
          import json, os, re, stat, subprocess, sys, tempfile, time, urllib.error, urllib.request
          from pathlib import Path
          key = sys.stdin.read()
          if not re.fullmatch(r"[A-Za-z0-9_.-]{12,512}", key):
              raise SystemExit(2)
          service = "booking-web-api.service"
          config_dir = Path("/etc/servgo")
          drop_dir = Path("/etc/systemd/system") / (service + ".d")
          envfile = config_dir / "mail-exa.env"
          drop = drop_dir / "90-servgo-mail-exa.conf"
          def system(*args):
              return subprocess.check_output(["systemctl", *args], stderr=subprocess.DEVNULL, text=True).strip()
          def healthy():
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3) as r:
                      return r.status == 200
              except Exception:
                  return False
          def runtime_has_key():
              try:
                  pid = int(system("show", service, "-p", "MainPID", "--value"))
                  if pid <= 0:
                      return False
                  return ("EXA_API_KEY="+key).encode() in Path(f"/proc/{pid}/environ").read_bytes().split(b"\0")
              except Exception:
                  return False
          def atomic(path, data, mode):
              fd, name = tempfile.mkstemp(dir=path.parent, prefix=".exa-")
              try:
                  with os.fdopen(fd,"wb") as f:
                      os.fchmod(f.fileno(),mode)
                      f.write(data)
                      f.flush()
                      os.fsync(f.fileno())
                  os.replace(name,path)
              finally:
                  if os.path.exists(name): os.unlink(name)
          def snapshot(path):
              if path.is_symlink(): raise RuntimeError()
              if not path.exists(): return None
              st = path.stat()
              if not stat.S_ISREG(st.st_mode) or st.st_uid != 0: raise RuntimeError()
              return (path.read_bytes(), stat.S_IMODE(st.st_mode))
          def restore(path, old):
              if old is None: path.unlink(missing_ok=True)
              else: atomic(path,*old)
          if system("is-active",service) != "active" or not healthy():
              print("API_NOT_HEALTHY; no changes")
              raise SystemExit(3)
          # Validate with one synthetic query before changing service configuration.
          req = urllib.request.Request("https://api.exa.ai/search", data=json.dumps({
              "query":"Exa official search API documentation","type":"auto","numResults":1
          }).encode(), headers={"x-api-key":key,"Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=25) as resp:
                  payload = json.load(resp)
                  if not isinstance(payload.get("results"),list): raise ValueError()
          except urllib.error.HTTPError as e:
              print("EXA_VALIDATION_HTTP_"+str(e.code)+"; no changes")
              raise SystemExit(4)
          except Exception:
              print("EXA_VALIDATION_FAILED; no changes")
              raise SystemExit(4)
          if runtime_has_key():
              print("EXA_RUNTIME_VERIFIED; no restart")
              raise SystemExit(0)
          for directory in (config_dir,drop_dir):
              if directory.is_symlink(): raise SystemExit(5)
              directory.mkdir(mode=0o755,exist_ok=True)
              st = directory.stat()
              if st.st_uid != 0 or st.st_mode & 0o022: raise SystemExit(5)
          old_env, old_drop = snapshot(envfile), snapshot(drop)
          try:
              atomic(envfile,("EXA_API_KEY="+key+"\n").encode(),0o600)
              atomic(drop,("[Service]\nEnvironmentFile="+str(envfile)+"\n").encode(),0o644)
              system("daemon-reload")
              system("restart",service)
              for _ in range(30):
                  if healthy() and runtime_has_key(): break
                  time.sleep(2)
              else: raise RuntimeError()
          except Exception:
              restore(envfile,old_env)
              restore(drop,old_drop)
              system("daemon-reload")
              system("restart",service)
              print("EXA_PROVISION_FAILED; previous configuration restored")
              raise SystemExit(6)
          print("EXA_RUNTIME_VERIFIED; API_HEALTHY; single Exa search accepted")
          '''
          ssh = release.connect()
          try:
              stdin, stdout, stderr = ssh.exec_command("python3 -c "+shlex.quote(remote), timeout=150)
              stdin.write(key)
              stdin.flush()
              stdin.channel.shutdown_write()
              result = stdout.read().decode(errors="replace").strip()
              code = stdout.channel.recv_exit_status()
              # Output is only a fixed marker or a numeric provider status.
              if re.fullmatch(r"(?:EXA_[A-Z_0-9]+(?:; [A-Za-z_ ]+)*|API_NOT_HEALTHY; no changes)",result):
                  print(result)
              if code: raise SystemExit("Provision failed; check safe status marker")
          finally:
              ssh.close()
          PY
