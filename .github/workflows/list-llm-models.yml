name: List configured LLM models

on:
  push:
    branches:
      - ops/list-llm-models

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      REMOTE_ROOT: /opt/ai_growth_os
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: List model ids
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "REMOTE_ROOT='$REMOTE_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_ROOT/current"
          docker compose --env-file "$REMOTE_ROOT/.env" -p ai-growth-os -f docker-compose.prod.yml exec -T api python - <<'PY'
          import os
          import httpx

          base=os.environ["XAI_BASE_URL"].rstrip("/")
          key=os.environ["XAI_API_KEY"]
          r=httpx.get(
              base + "/models",
              headers={"Authorization": f"Bearer {key}"},
              timeout=30,
          )
          r.raise_for_status()
          payload=r.json()
          ids=sorted(
              item.get("id","")
              for item in payload.get("data",[])
              if isinstance(item,dict) and item.get("id")
          )
          print("model_count=", len(ids))
          for model_id in ids:
              low=model_id.lower()
              if any(token in low for token in ("grok","claude","gpt")):
                  print("model", model_id)
          PY
          REMOTE
