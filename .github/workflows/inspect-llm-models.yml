name: Smoke cheap LLM models

on:
  push:
    branches:
      - cost/cheap-model-policy

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      REMOTE_ROOT: /opt/ai_growth_os
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Smoke cheap candidates
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "REMOTE_ROOT='$REMOTE_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_ROOT/current"
          docker compose --env-file "$REMOTE_ROOT/.env" -p ai-growth-os -f docker-compose.prod.yml exec -T api python - <<'PY'
          import asyncio, os, httpx

          BASE=os.environ["XAI_BASE_URL"].rstrip("/")
          KEY=os.environ["XAI_API_KEY"]
          MODELS=["deepseek-v4.1-flash","deepseek-v4-flash","gemini-flash-3.8"]

          async def call(model, structured):
              payload={
                  "model": model,
                  "messages":[{"role":"user","content":'Return JSON with key "ok" and boolean true.'}],
                  "max_completion_tokens":128,
              }
              if structured:
                  payload["response_format"]={
                      "type":"json_schema",
                      "json_schema":{
                          "name":"structured_response",
                          "strict":True,
                          "schema":{
                              "type":"object",
                              "properties":{"ok":{"type":"boolean"}},
                              "required":["ok"],
                              "additionalProperties":False,
                          },
                      },
                  }
              async with httpx.AsyncClient(timeout=60) as client:
                  r=await client.post(
                      BASE+"/chat/completions",
                      headers={"Authorization":f"Bearer {KEY}","Content-Type":"application/json"},
                      json=payload,
                  )
              body=(r.text or "")[:500].replace("\n"," ")
              print(model, "schema" if structured else "plain", r.status_code, body)

          async def main():
              for model in MODELS:
                  await call(model, False)
                  await call(model, True)

          asyncio.run(main())
          PY
          REMOTE
