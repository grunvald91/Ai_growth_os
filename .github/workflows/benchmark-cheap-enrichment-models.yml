name: Benchmark cheap enrichment models

on:
  push:
    branches:
      - ops/benchmark-cheap-enrichment-models

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      REMOTE_ROOT: /opt/ai_growth_os
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Benchmark structured enrichment decisions
        run: |
          set -euo pipefail
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "REMOTE_ROOT='$REMOTE_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_ROOT/current"
          docker compose --env-file "$REMOTE_ROOT/.env" -p ai-growth-os -f docker-compose.prod.yml exec -T api python - <<'PY'
          import asyncio, json, os
          import httpx

          BASE=os.environ["XAI_BASE_URL"].rstrip("/")
          KEY=os.environ["XAI_API_KEY"]
          MODELS=[
            "deepseek-v4.1-flash",
            "gemini-flash-3.8",
            "kimi-2.7",
            "grok-4.7",
            "gpt-6-luna",
            "glm-5.3-flash",
            "Qwen-3.8-Max",
          ]

          CASES=[
            {"id":"official_email","evidence":"Official website matches the lead. Email hello@example.com is published.","status":"direct","channel":"email","needs_review":False},
            {"id":"verified_whatsapp","evidence":"Owner-verified listing matches identity. WhatsApp button resolves to +70000000002. No email.","status":"direct","channel":"whatsapp","needs_review":False},
            {"id":"telegram_only","evidence":"Official business page matches identity and links public Telegram @example_admin. No email or WhatsApp.","status":"direct","channel":"telegram","needs_review":False},
            {"id":"website_chat","evidence":"Owner-confirmed booking page matches identity and has built-in chat. No public email, WhatsApp or Telegram.","status":"website_or_chat","channel":"website","needs_review":False},
            {"id":"phone_only","evidence":"Current profile matches identity and public phone +70000000005. Repeated checks found no website, email, WhatsApp or Telegram.","status":"phone_only","channel":"phone","needs_review":False},
            {"id":"stale_conflict","evidence":"Original lead says Barhat, Lenin 1/1, +70000000006. Current sources for Barhat show different addresses and phones, with no source connecting them to the original lead.","status":"stale","channel":"none","needs_review":True},
          ]
          EXPECTED=[{k:c[k] for k in ("id","status","channel","needs_review")} for c in CASES]

          ITEM={
            "type":"object",
            "properties":{
              "id":{"type":"string"},
              "status":{"type":"string","enum":["direct","website_or_chat","phone_only","stale"]},
              "channel":{"type":"string","enum":["email","whatsapp","telegram","website","phone","none"]},
              "needs_review":{"type":"boolean"},
            },
            "required":["id","status","channel","needs_review"],
            "additionalProperties":False,
          }
          SCHEMA={
            "type":"object",
            "properties":{"results":{"type":"array","items":ITEM,"minItems":6,"maxItems":6}},
            "required":["results"],
            "additionalProperties":False,
          }
          SYSTEM="""Classify supplied already-collected business contact evidence. Never invent contacts.
          Rules: direct if verified email/WhatsApp/Telegram exists; prefer email then WhatsApp then Telegram.
          website_or_chat if no direct channel but verified website/booking/chat exists.
          phone_only if only verified phone remains after checks.
          stale if current evidence conflicts with lead identity and continuity is unsafe.
          stale => channel none, needs_review true. Otherwise needs_review false.
          Preserve each case id exactly. Return only schema JSON."""

          async def evaluate(model):
              payload={
                "model":model,
                "messages":[
                  {"role":"system","content":SYSTEM},
                  {"role":"user","content":json.dumps(CASES,ensure_ascii=False)},
                ],
                "max_completion_tokens":700,
                "reasoning_effort":"low",
                "response_format":{"type":"json_schema","json_schema":{"name":"batch_enrichment","strict":True,"schema":SCHEMA}},
              }
              async with httpx.AsyncClient(timeout=150) as client:
                r=await client.post(
                  BASE+"/chat/completions",
                  headers={"Authorization":f"Bearer {KEY}","Content-Type":"application/json"},
                  json=payload,
                )
              r.raise_for_status()
              body=r.json()["choices"][0]["message"]["content"]
              parsed=json.loads(body)
              results=parsed.get("results")
              exact=results==EXPECTED
              per_case=[]
              if isinstance(results,list):
                for expected in EXPECTED:
                  got=next((x for x in results if x.get("id")==expected["id"]),None)
                  per_case.append({"id":expected["id"],"ok":got==expected,"got":got})
              return {"exact":exact,"passed":sum(x["ok"] for x in per_case),"total":6,"per_case":per_case}

          async def main():
              overall={}
              for model in MODELS:
                try:
                  overall[model]=await evaluate(model)
                except Exception as exc:
                  overall[model]={"exact":False,"passed":0,"total":6,"error":type(exc).__name__+":"+str(exc)[:300]}
              print("BENCHMARK_RESULT="+json.dumps(overall,ensure_ascii=False,sort_keys=True))
          asyncio.run(main())
          PY
          REMOTE
