# Recheck after adjusting a test that required exactly one optional hint.
# Integrated recheck: retain main reverse-proxy CSRF fix and verify forwarded HTTPS setup.
name: Growth dispatcher video review cards — targeted guarded release
on:
  push:
    branches: [fix/dispatcher-review-material-card-20261101]
    paths: ['.github/workflows/growth-dispatcher-review-cards-once.yml']
permissions:
  contents: read
concurrency:
  group: growth-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Guard tested source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing Growth test dependencies
        run: python -m pip install -q --disable-pip-version-check -e '.[test]'
      - name: Run targeted dispatcher review, activity, SSO and theme regressions
        run: |
          python -m compileall -q app/api/studio_sso.py app/api/content_studio_activity.py app/api/growth_v4.py app/dispatcher/blocks.py app/dispatcher/executors.py
          node --check app/api/dispatcher_assets/dispatcher.js
          python -m pytest -q tests/test_dispatcher.py tests/test_dispatcher_materials.py tests/test_dispatcher_fast_owner.py tests/test_content_studio_activity.py tests/test_growth_servgo_air_theme.py tests/test_growth_live.py tests/test_studio_sso.py tests/test_servgo_same_origin_gateway.py
      - name: Confirm consent and CSS contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app/api/studio_sso.py').read_text()
          css=Path('app/api/assets/growth-servgo-air.css').read_text()
          assert 'SETUP_COOKIE = "sg_growth_setup"' in s
          assert 'request.url.netloc.casefold() == "servgo.ru"' in s
          assert 'path=SETUP_PATH' in s and 'httponly=True' in s
          assert 'response.delete_cookie(SETUP_COOKIE' in s
          assert '_canonical_pwa(request, settings)' in s
          assert 'x-forwarded-proto' in s
          assert 'sgNavFlow' in css and '/fonts/servgo-onest-cyrillic.woff2' in css
          assert 'is_sso = path ==' in Path('app/api/growth_live.py').read_text()
          assert 'setting_provider()' in Path('app/api/growth_live.py').read_text()
          assert '_native_error' in s
          theme = Path('app/api/assets/growth-servgo-air.css').read_text()
          assert '--sg-navy: var(--s-text);' in theme
          assert '.route-content .sg-intake-section :is(h2, h3)' in theme
          assert '.sg-intake-source span' in theme
          assert 'clip-path: polygon(0% 50%, 10% 45%, 24% 36%' in theme
          assert '.sg-choice-copy b' in theme
          assert '.dp-home .dp-msg.user' in theme
          assert '.dp-material-top' in theme and '.dp-resource-visual' in theme
          assert 'review-cards-20261101' in Path('app/api/growth_v4.py').read_text()
          assert 'type": "resource_list"' in Path('app/dispatcher/executors.py').read_text()
          assert '/studio/assets/growth-servgo-air.css?v=5' in Path('app/api/growth_v4.py').read_text()
          assert 'https://servgo.ru/mail' not in Path('app/api/content_studio.py').read_text()
          assert 'https://servgo.ru/mail' not in Path('app/api/growth_v4.py').read_text()
          print('SSO_UI_AND_CSS_CONTRACTS=PASS')
          PY
      - name: Deploy exact tested Growth source with existing rollback mechanism
        shell: bash
        env:
          SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
          HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
          HOST_FP: uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > /tmp/scanned
          while IFS= read -r line; do
            printf '%s\n' "$line" > /tmp/one
            if ssh-keygen -lf /tmp/one 2>/dev/null | grep -q "SHA256:$HOST_FP "; then
              printf '%s\n' "$line" >> ~/.ssh/known_hosts
            fi
          done < /tmp/scanned
          test -s ~/.ssh/known_hosts
          git archive --format=tar.gz "$GITHUB_SHA" app alembic/versions pyproject.toml products |
            sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" \
             "set -eu
              python3 /opt/ai_growth_os/deploy/deploy_growth.py deploy $GITHUB_SHA
              if ! (
                docker exec ai-growth-os-api-1 python -c 'from app.core.config import get_settings; assert get_settings().studio_servgo_gateway_enabled'
                test \"\$(curl -sS -o /dev/null -w '%{http_code}' --resolve servgo.ru:443:127.0.0.1 https://servgo.ru/studio)\" = 401
                test \"\$(curl -sS -o /dev/null -w '%{http_code}' --resolve growth.servgo.ru:443:127.0.0.1 https://growth.servgo.ru/studio)\" = 401
                test \"\$(curl -sS -o /dev/null -w '%{http_code}' --resolve servgo.ru:443:127.0.0.1 https://servgo.ru/workspace/growth)\" = 200
                test \"\$(curl -sS -o /dev/null -w '%{http_code}' --resolve servgo.ru:443:127.0.0.1 https://servgo.ru/fonts/servgo-onest-cyrillic.woff2)\" = 200
                test \"\$(curl -sS -o /dev/null -w '%{http_code}' --resolve mail.servgo.ru:443:127.0.0.1 https://mail.servgo.ru/api/status)\" = 401
              ); then
                echo GROWTH_SMOKE_FAILED_ROLLING_BACK
                python3 /opt/ai_growth_os/deploy/deploy_growth.py rollback
                exit 1
              fi
              echo GROWTH_DISPATCHER_REVIEW_CARDS_DEPLOY_OK"
