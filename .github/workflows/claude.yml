name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: github.actor == 'grunvald91'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.API }}
          trigger_phrase: "@claude"
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools Edit,Read,Write,Bash
