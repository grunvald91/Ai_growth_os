name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude:
    if: github.actor == 'grunvald91'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_BASE_URL: https://api.claudehub.fun

    steps:
      - name: Verify ClaudeHub API secret
        env:
          CLAUDEHUB_API_KEY: ${{ secrets.API }}
        run: |
          if [ -z "$CLAUDEHUB_API_KEY" ]; then
            echo "::error::Repository Actions secret 'API' is missing or unavailable."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.API }}
          github_token: ${{ github.token }}
          trigger_phrase: "@claude"
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools Edit,Read,Write,Bash
