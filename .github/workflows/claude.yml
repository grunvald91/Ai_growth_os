name: Grok Code

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  grok:
    if: ${{ github.actor == 'grunvald91' && contains(github.event.comment.body, '@grok') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Aider
        run: python -m pip install --disable-pip-version-check -q aider-chat

      - name: Create working branch
        run: |
          set -euo pipefail
          BRANCH="grok/issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git config user.name "grok-code[bot]"
          git config user.email "grok-code[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

      - name: Prepare bounded coding files
        run: |
          set -euo pipefail
          touch app/company_profile.py
          touch tests/test_company_profile.py

      - name: Build bounded task prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          comment = os.environ["COMMENT_BODY"].replace("@grok", "").strip()
          prompt = "\n".join([
              "Repository: grunvald91/Ai_growth_os",
              "Issue #" + os.environ["ISSUE_NUMBER"] + ": " + os.environ["ISSUE_TITLE"],
              "",
              "Implement ONLY this bounded instruction:",
              comment,
              "",
              "You may edit ONLY app/company_profile.py and tests/test_company_profile.py in this run.",
              "Be concise: do not explain your reasoning; immediately write the two files.",
              "Do not merely describe code. Write the implementation into those files.",
              "Rules:",
              "- Make the smallest correct change for this instruction.",
              "- Do not invent business facts.",
              "- Preserve backward compatibility.",
              "- Add focused tests for the requested behavior.",
              "- Do not perform external side effects.",
          ])
          Path("/tmp/grok-task.md").write_text(prompt, encoding="utf-8")
          Path("/tmp/aider-model-settings.yml").write_text(
              "- name: openai/grok-4.7\n"
              "  edit_format: diff\n"
              "  use_repo_map: false\n"
              "  use_temperature: false\n"

              encoding="utf-8",
          )
          PY

      - name: Run bounded Grok 4.7 task
        env:
          OPENAI_API_KEY: ${{ secrets.API }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          set +e
          aider \
            --model openai/grok-4.7 \
            --openai-api-base https://api.claudehub.fun/v1 \
            --model-settings-file /tmp/aider-model-settings.yml \
            --map-tokens 0 \
            --max-chat-history-tokens 3000 \
            --message-file /tmp/grok-task.md \
            --yes-always \
            --no-auto-commits \
            --no-suggest-shell-commands \
            --no-stream \
            --no-pretty \
            --no-gitignore \
            --edit-format diff \
            app/company_profile.py \
            tests/test_company_profile.py
          AIDER_STATUS=$?
          set -e
          if [ "$AIDER_STATUS" -ne 0 ]; then
            echo "::error::Grok/Aider exited with status $AIDER_STATUS"
            exit "$AIDER_STATUS"
          fi
          if [ ! -s app/company_profile.py ] || [ ! -s tests/test_company_profile.py ]; then
            echo "::error::Grok did not write the required code/test files."
            exit 1
          fi

      - name: Run focused tests
        run: |
          python -m pip install --disable-pip-version-check -q -e ".[test]"
          pytest -q tests/test_company_profile.py
          pytest -q

      - name: Commit and push
        run: |
          set -euo pipefail
          git add app/company_profile.py tests/test_company_profile.py
          git commit -m "Implement Company Profile contract with Grok 4.7"
          git push origin "$BRANCH"
