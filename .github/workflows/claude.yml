name: Grok Code

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  grok:
    if: ${{ github.actor == 'grunvald91' && contains(github.event.comment.body, '@grok') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Aider
        run: python -m pip install --disable-pip-version-check -q aider-chat

      - name: Create working branch
        run: |
          set -euo pipefail
          BRANCH="grok/issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git config user.name "grok-code[bot]"
          git config user.email "grok-code[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

      - name: Build bounded task prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          comment = os.environ["COMMENT_BODY"].replace("@grok", "").strip()
          prompt = "\n".join([
              "Repository: grunvald91/Ai_growth_os",
              "Issue #" + os.environ["ISSUE_NUMBER"] + ": " + os.environ["ISSUE_TITLE"],
              "",
              "Implement ONLY this bounded instruction:",
              comment,
              "",
              "Rules:",
              "- Make the smallest correct change for this instruction.",
              "- Do not edit .github/workflows, secrets, credentials, or deployment credentials.",
              "- Do not invent business facts.",
              "- Preserve backward compatibility.",
              "- Add focused tests when the instruction requires code behavior.",
              "- Do not perform external side effects.",
          ])
          Path("/tmp/grok-task.md").write_text(prompt, encoding="utf-8")
          Path("/tmp/aider-model-settings.yml").write_text(
              "- name: openai/grok-4.7\n"
              "  edit_format: diff\n"
              "  use_repo_map: false\n"
              "  use_temperature: false\n"
              "  extra_params:\n"
              "    max_tokens: 1200\n",
              encoding="utf-8",
          )
          PY

      - name: Run bounded Grok 4.7 task
        env:
          OPENAI_API_KEY: ${{ secrets.API }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          BEFORE="$(git status --porcelain)"
          set +e
          aider             --model openai/grok-4.7             --openai-api-base https://api.claudehub.fun/v1             --model-settings-file /tmp/aider-model-settings.yml             --map-tokens 0             --max-chat-history-tokens 3000             --message-file /tmp/grok-task.md             --yes-always             --no-auto-commits             --no-suggest-shell-commands             --no-stream             --no-pretty             --no-gitignore             --edit-format diff             pyproject.toml             app/workflows/context.py             products/servgo/.claude/product-marketing-context.md             README.md             ARCHITECTURE.md
          AIDER_STATUS=$?
          set -e
          AFTER="$(git status --porcelain)"
          if [ "$AIDER_STATUS" -ne 0 ]; then
            echo "::error::Grok/Aider exited with status $AIDER_STATUS"
            exit "$AIDER_STATUS"
          fi
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "::error::Grok completed without repository changes."
            exit 1
          fi

      - name: Run tests
        run: |
          python -m pip install --disable-pip-version-check -q -e ".[test]"
          pytest -q

      - name: Commit and push
        run: |
          set -euo pipefail
          git add -A
          git commit -m "Implement issue #${{ github.event.issue.number }} with Grok 4.7"
          git push origin "$BRANCH"
