name: Inspect busy Growth tasks (one-shot read-only)
on:
  push:
    branches: [ops/inspect-busy-growth-tasks-20261120]
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'paramiko>=3.4,<4'
      - name: Read sanitized task status and recent run age
        env:
          HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
          SERVER_SSH_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import os, socket, hashlib, base64, shlex, paramiko
          password = os.environ.get("SERVER_SSH_PASSWORD")
          if not password: raise RuntimeError("SSH secret not configured")
          sock = socket.create_connection((os.environ["HOST"], 22), timeout=20)
          transport = paramiko.Transport(sock)
          try:
              transport.start_client(timeout=20)
              digest=base64.b64encode(hashlib.sha256(transport.get_remote_server_key().asbytes()).digest()).decode().rstrip("=")
              if digest != "uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU":
                  raise RuntimeError("Pinned host key mismatch")
              transport.auth_password("root", password)
              if not transport.is_authenticated(): raise RuntimeError("Authentication failed")
              remote_code="from datetime import datetime, timezone\nfrom sqlalchemy import select\nfrom app.db.session import SessionLocal\nfrom app.models.domain import Task, TaskStatus, AgentRun\nnow = datetime.now(timezone.utc)\nwith SessionLocal() as db:\n    items = db.scalars(select(Task).where(Task.status == TaskStatus.RUNNING).order_by(Task.created_at.asc())).all()\n    print(\"running_task_count=\" + str(len(items)))\n    for t in items[:10]:\n        stamp = t.updated_at or t.created_at\n        if stamp is not None and stamp.tzinfo is None: stamp = stamp.replace(tzinfo=timezone.utc)\n        age = int((now - stamp).total_seconds()/60) if stamp is not None else -1\n        runs = db.scalars(select(AgentRun).where(AgentRun.task_id == t.id).order_by(AgentRun.started_at.desc()).limit(3)).all()\n        summary = [str(r.status) + \":\" + str(int((now - (r.started_at.replace(tzinfo=timezone.utc) if r.started_at and r.started_at.tzinfo is None else (r.started_at or now))).total_seconds()/60)) + \"m\" for r in runs]\n        print(\"running_task agent=%s updated_age_minutes=%s recent_agent_runs=%s\" % (str(t.assigned_agent), age, \",\".join(summary) or \"none\"))"
              command = "docker exec ai-growth-os-api-1 python -c " + shlex.quote(remote_code)
              ch = transport.open_session(timeout=20)
              ch.exec_command(command)
              output=ch.makefile("r",-1).read(12000).decode("utf-8","replace")
              print(output.strip())
              if ch.recv_exit_status(): raise RuntimeError("Read-only query failed")
          finally:
              transport.close()
          PY
