name: VK live postdeploy read-only verification (temporary)
on:
  push:
    branches: [ops/vk-postdeploy-readonly-20261120]
permissions:
  contents: read
jobs:
  verify:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'paramiko>=3.4,<4'
      - name: Verify running API, worker and VK operator entrypoint without keys
        env:
          HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
          SERVER_SSH_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, hashlib, os, shlex, socket
          import paramiko
          if not os.environ.get('SERVER_SSH_PASSWORD'):
              raise SystemExit('ssh_credential_unavailable')
          host = os.environ['HOST']
          sock = socket.create_connection((host, 22), timeout=20)
          t = paramiko.Transport(sock)
          try:
              t.start_client(timeout=20)
              fp = base64.b64encode(hashlib.sha256(
                  t.get_remote_server_key().asbytes()).digest()).decode().rstrip('=')
              if fp != 'uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU':
                  raise RuntimeError('pinned_host_key_mismatch')
              t.auth_password('root', os.environ['SERVER_SSH_PASSWORD'])
              if not t.is_authenticated():
                  raise RuntimeError('ssh_auth_failed')
              worker = (
                  "import os; from app.core.config import get_settings; s=get_settings(); "
                  "print('worker_release_sha='+str(os.environ.get('RELEASE_SHA','missing'))); "
                  "print('worker_vk_autopost_enabled='+str(s.content_vk_autopost_enabled).lower()); "
                  "print('worker_vk_max_lateness_minutes='+str(s.content_vk_max_lateness_minutes))"
              )
              api = (
                  "import os; from app.core.config import get_settings; "
                  "from app.vk_service import platform_service_token; "
                  "s=get_settings(); "
                  "print('api_release_sha='+str(os.environ.get('RELEASE_SHA','missing'))); "
                  "print('api_vk_autopost_enabled='+str(s.content_vk_autopost_enabled).lower()); "
                  "print('vk_service_key_present='+str(bool(platform_service_token(s))).lower()); "
                  "print('vk_operator_allowlist_present='+str(bool(s.studio_tune_usernames)).lower())"
              )
              commands = [
                  'docker exec ai-growth-os-worker-1 python -c ' + shlex.quote(worker),
                  'docker exec ai-growth-os-api-1 python -c ' + shlex.quote(api),
                  "curl --silent --output /dev/null --write-out 'vk_admin_anonymous_http=%{http_code}\\n' http://127.0.0.1:8091/studio/tune/vk",
                  "curl --silent --output /dev/null --write-out 'api_health_http=%{http_code}\\n' http://127.0.0.1:8091/health",
              ]
              for command in commands:
                  ch = t.open_session(timeout=20)
                  ch.exec_command(command)
                  output = ch.makefile('r', -1).read(4096).decode('utf-8','replace').strip()
                  print(output)
                  if ch.recv_exit_status():
                      raise RuntimeError('read_only_diagnostic_failed')
          finally:
              t.close()
          PY
