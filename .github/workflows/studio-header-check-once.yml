name: Check Studio referrer header once
on:
  push:
    branches: [diagnostics/studio-origin-20261101-1853]
permissions:
  contents: read
jobs:
  headers:
    if: github.repository == 'grunvald91/Ai_growth_os'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Public Studio response policies (anonymous, read only)
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          for label, url in [
              ("growth-video","https://growth.servgo.ru/studio/products/00000000-0000-0000-0000-000000000000/whiteboard"),
              ("growth-login","https://growth.servgo.ru/studio/login"),
              ("servgo-studio","https://servgo.ru/studio/")]:
              try:
                  request = urllib.request.Request(url, method='GET', headers={"User-Agent":"ServGo-Diagnostics/1.0"})
                  with urllib.request.urlopen(request, timeout=12) as reply:
                      print(label,reply.status,repr(reply.headers.get('Referrer-Policy')),
                            repr(reply.headers.get('Content-Security-Policy')),reply.geturl()[:80])
              except urllib.error.HTTPError as exc:
                  print(label,exc.code,repr(exc.headers.get('Referrer-Policy')),
                        repr(exc.headers.get('Content-Security-Policy')))
              except Exception as exc:
                  print(label,"ERROR",type(exc).__name__)
          PY
