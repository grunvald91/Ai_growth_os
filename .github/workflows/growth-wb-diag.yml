name: Growth whiteboard diag (read-only)

# Только чтение: структурированные строки whiteboard_* из логов worker (без ключей)
# и поле error последних запусков. Удалить после запуска.

on:
  push:
    branches: [ccr-545c5158-rcd05z]
    paths: ['.github/workflows/growth-wb-diag.yml']

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@155.212.162.47 'bash -s' <<'REMOTE' 2>&1 | grep -vE 'sk-|:AA[A-Za-z0-9_-]{20}|Bearer'
          echo "== worker whiteboard_* lines (2h)"
          docker logs --since 2h ai-growth-os-worker-1 2>&1 | grep -oE '^whiteboard_[a-z_]+ \{[^}]*\}' | tail -15
          echo "== worker exception lines (2h, class + message head)"
          docker logs --since 2h ai-growth-os-worker-1 2>&1 | grep -E '^(httpx\.|[A-Za-z_.]+(Error|Exception|Timeout)):' | cut -c1-200 | tail -10
          echo "== recent whiteboard agent runs"
          docker exec ai-growth-os-postgres-1 psql -U ai_growth -d ai_growth -At -F ' | ' -c "select started_at::timestamp(0), agent_name, provider, model, status, left(coalesce(error,''),160) from agent_runs where agent_name like 'whiteboard%' and started_at > now() - interval '3 hours' order by started_at desc limit 8"
          REMOTE
