name: Growth deploy preflight (read-only)

# Read-only look at the production server before the first deploy of the
# Growth release path: nothing is written, restarted or printed from .env.
on:
  push:
    branches: [ops/growth-preflight]

permissions:
  contents: read

jobs:
  preflight:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}
    steps:
      - name: Secret present (value never printed)
        run: |
          echo "SERVER_SSH_PASSWORD set: $([ -n "$SSHPASS" ] && echo yes || echo no)"
          [ -n "$SSHPASS" ] || { echo "::error::SERVER_SSH_PASSWORD is missing"; exit 1; }
      - name: Server fingerprint
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null | sort > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts
      - name: Read-only server state
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "root@$HOST" 'bash -s' <<'REMOTE'
          set -u
          D=/opt/ai_growth_os/deploy
          echo "--- deploy script"
          if [ -f $D/deploy_growth.py ]; then sha256sum $D/deploy_growth.py | cut -d" " -f1; else echo "missing"; fi
          echo "expected 6aedfb771590e19d425d7995f9461345d327103ad1ed2e2c951d797bfd27987c"
          echo "entry script: $([ -x $D/ssh-deploy-entry.sh ] && echo present || echo missing)"
          echo "--- deploy.json"
          if [ -f $D/deploy.json ]; then python3 -c 'import json;d=json.load(open("/opt/ai_growth_os/deploy/deploy.json"));print("base_image:",d.get("base_image"));print("overlay keys:",sorted((d.get("overlay_env") or {}).keys()))'; else echo "missing"; fi
          echo "--- restricted deploy key in authorized_keys: $(grep -c ssh-deploy-entry /root/.ssh/authorized_keys 2>/dev/null || echo 0)"
          echo "--- active release: $(readlink -f /opt/ai_growth_os/current 2>/dev/null || echo none)"
          echo "--- containers"
          docker ps --filter label=com.docker.compose.project=ai-growth-os --format '{{.Names}} {{.Image}} {{.Status}}'
          echo "--- base images"
          docker images --format '{{.Repository}}:{{.Tag}} {{.CreatedSince}}' | grep -Ei 'growth|servgo' | head -10
          echo "--- critic flag in runtime env: $(grep -c '^AGENT_CRITIC_ENABLED=true' /opt/ai_growth_os/.env 2>/dev/null || echo 0)"
          echo "--- disk"; df -h / | tail -1
          REMOTE
