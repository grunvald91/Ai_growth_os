name: ServGo SEO held article diagnostic (read only)
on:
  push:
    branches: [ops/servgo-seo-3-manual-action-20261105]
    paths: [.github/workflows/servgo-seo-new-article-readonly-20261105.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
      HOST_FP: uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU
    steps:
      - name: Check provenance, article-review and publication blockers only
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$SSHPASS" ]
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null >/tmp/seo-keys
          while read -r line; do
            printf '%s\n' "$line" >/tmp/seo-key
            if ssh-keygen -lf /tmp/seo-key 2>/dev/null | grep -q "SHA256:$HOST_FP "; then
              printf '%s\n' "$line" >>~/.ssh/known_hosts
            fi
          done </tmp/seo-keys
          [ -s ~/.ssh/known_hosts ]
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" \
            'docker exec -i ai-growth-os-api-1 python -' <<'PY'
          import json
          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models.domain import Product, Task, Artifact, Publication
          from app.seo.publishing import (critic_verdict, static_problems,
              unsupported_servgo_pricing, servgo_buyer_intent_problems,
              duplicate_page_problems, public_blog_ready)
          from app.workflows.article_contracts import ArticleArtifact
          with SessionLocal() as db:
              p=db.scalar(select(Product).where(Product.slug=="servgo"))
              tasks=list(db.scalars(select(Task).where(
                  Task.product_id==p.id,Task.assigned_agent=="content_factory")))
              matching=[]
              for task in tasks:
                  rr=db.scalar(select(Artifact).where(
                      Artifact.product_id==p.id, Artifact.task_id==task.id,
                      Artifact.kind=="content_request").limit(1))
                  if not rr: continue
                  try: body=json.loads(rr.content)
                  except (ValueError,TypeError): continue
                  if (body.get("seo_brief") or {}).get("primary_query") == "ии для продвижения бизнеса":
                      matching.append(task)
              print("MATCHING_NEW_ARTICLE_TASKS",len(matching))
              if len(matching)!=1: raise SystemExit(2)
              t=matching[0]
              a=db.scalar(select(Artifact).where(
                  Artifact.product_id==p.id,Artifact.task_id==t.id,
                  Artifact.kind=="article").limit(1))
              print("TASK_STATUS",t.status.value,"ARTICLE",bool(a),
                    "PUBLIC_BLOG_READY",public_blog_ready(db,p.id))
              if a:
                  article=ArticleArtifact.model_validate_json(a.content)
                  verdict=critic_verdict(db,t.id,article.reader_article)
                  problems=(static_problems(article)+unsupported_servgo_pricing(db,a,article)
                      +servgo_buyer_intent_problems(db,a,article)
                      +duplicate_page_problems(db,a,article))
                  publication=db.scalar(select(Publication).where(
                      Publication.artifact_id==a.id,Publication.product_id==p.id).limit(1))
                  print("ARTICLE_REVIEW",json.dumps({"critic":verdict,"problems":problems[:8],
                      "publication_status":publication.status if publication else None,
                      "due_at":str(t.due_at)},ensure_ascii=False))
          PY
