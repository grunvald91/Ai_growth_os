name: VK runtime configuration preflight (temporary)
on:
  push:
    branches:
      - fix/vk-community-simple-connect-20261120

permissions:
  contents: read

concurrency:
  group: vk-runtime-config-temp
  cancel-in-progress: true

jobs:
  inspect:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SSH verification client
        run: python -m pip install 'paramiko>=3.4,<4'
      - name: Check VK feature flags on running Growth API (no secret values)
        env:
          HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
          SERVER_SSH_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import os
          import shlex
          import socket
          import paramiko
          expected = "uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU"
          if not os.environ.get("SERVER_SSH_PASSWORD"):
              raise SystemExit("ssh_password_unavailable=true")
          host = os.environ["HOST"]
          sock = socket.create_connection((host, 22), timeout=20)
          transport = paramiko.Transport(sock)
          try:
              transport.start_client(timeout=20)
              digest = base64.b64encode(hashlib.sha256(
                  transport.get_remote_server_key().asbytes()).digest()
              ).decode().rstrip("=")
              if digest != expected:
                  raise RuntimeError("pinned_host_fingerprint_mismatch")
              transport.auth_password("root", os.environ["SERVER_SSH_PASSWORD"])
              if not transport.is_authenticated():
                  raise RuntimeError("ssh_auth_failed")
              code = (
                  "import os; from app.core.config import get_settings; "
                  "s=get_settings(); "
                  "print('vk_id_client_configured=' + str(bool(getattr(s, 'social_vk_client_id', None))).lower()); "
                  "print('vk_service_read_key_present=' + str(bool(os.environ.get('SOCIAL_VK_SERVICE_TOKEN'))).lower()); "
                  "print('vk_autopost_enabled=' + str(bool(s.content_vk_autopost_enabled)).lower()); "
                  "print('vk_redirect_origin_valid=' + str(s.social_vk_redirect_base == 'https://servgo.ru').lower())"
              )
              cmd = "docker exec ai-growth-os-api-1 python -c " + shlex.quote(code)
              channel = transport.open_session(timeout=20)
              channel.exec_command(cmd)
              output = channel.makefile("r", -1).read(4096).decode("utf-8", "replace")
              exit_code = channel.recv_exit_status()
              print(output.strip())
              print("read_only_probe_exit_code=" + str(exit_code))
              if exit_code:
                  raise RuntimeError("read_only_probe_failed")
          finally:
              transport.close()
          PY
