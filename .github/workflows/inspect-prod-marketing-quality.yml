name: Inspect production marketing quality

on:
  push:
    branches:
      - inspect/prod-marketing-quality-20261006
    paths:
      - '.github/workflows/inspect-prod-marketing-quality.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST || '155.212.162.47' }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      EXPECTED_RELEASE: 22b825b067d56823f563445408d1b13219860079
      QUALITY_RUN_KEY: quality-${{ github.run_id }}

    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Generate one safe production package and print artifacts
        run: |
          set -euo pipefail
          [ -n "$SSHPASS" ]
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=20"
          sshpass -e ssh $OPTS -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "EXPECTED_RELEASE='$EXPECTED_RELEASE' QUALITY_RUN_KEY='$QUALITY_RUN_KEY' bash -s" <<'REMOTE'
          set -euo pipefail
          CURRENT="$(basename "$(readlink /opt/ai_growth_os/current)")"
          echo "Current release: $CURRENT"
          [ "$CURRENT" = "$EXPECTED_RELEASE" ] || { echo "Expected $EXPECTED_RELEASE, got $CURRENT"; exit 42; }
          cd /opt/ai_growth_os/current

          CONTENT_TASK_ID="$(
            docker compose --env-file /opt/ai_growth_os/.env -p ai-growth-os -f docker-compose.prod.yml exec -T api               python - "$QUALITY_RUN_KEY" <<'PY'
          import json
          import sys
          from sqlalchemy import select

          from app.content.service import queue_content
          from app.db.session import SessionLocal
          from app.models.domain import Artifact, Product

          run_key = sys.argv[1]
          with SessionLocal() as db:
              product = db.scalar(select(Product).where(Product.slug == "servgo"))
              if product is None:
                  raise SystemExit("ServGo not found")

              plan_row = db.scalar(
                  select(Artifact).where(
                      Artifact.product_id == product.id,
                      Artifact.kind == "editorial_plan",
                  ).order_by(Artifact.created_at.desc(), Artifact.id.desc()).limit(1)
              )
              if plan_row is None:
                  raise SystemExit("No editorial plan available")
              plan = json.loads(plan_row.content)
              slots = plan.get("slots") or []
              if not slots:
                  raise SystemExit("Editorial plan has no slots")

              package_keys = []
              for slot in slots:
                  key = slot.get("package_key")
                  if key and key not in package_keys:
                      package_keys.append(key)

              chosen = None
              for key in package_keys:
                  group = [s for s in slots if s.get("package_key") == key]
                  topic = " ".join(str(s.get("topic") or "") for s in group).lower()
                  if "ноч" in topic or "заяв" in topic:
                      chosen = group
                      break
              if chosen is None:
                  chosen = [s for s in slots if s.get("package_key") == package_keys[0]]

              first = chosen[0]
              topic = first["topic"]
              audience = first.get("audience")
              objective = first.get("objective") or ""
              rationale = first.get("rationale") or ""
              channels = ", ".join(sorted({s.get("platform", "") for s in chosen if s.get("platform")}))
              brief = (
                  "Контроль качества новой production-маркетинговой команды ServGo Growth. "
                  f"Цель: {objective}\nПлощадки: {channels}\nОснование темы: {rationale}\n"
                  "Сделай материал живым, конкретным, продающим и полезным: узнаваемая сцена -> боль -> "
                  "цена текущего процесса -> понятный механизм -> проверенная ценность ServGo -> один CTA. "
                  "Соблюдай принципы «Пиши, сокращай». Добавь уместный ситуационный юмор. "
                  "Не использовать старые цены. Не публиковать и не отправлять наружу."
              )
              task = queue_content(
                  db,
                  product.id,
                  topic,
                  commit=False,
                  dedupe_key=f"{run_key}:{plan_row.id}:{first.get('package_key')}",
                  audience=audience,
                  editorial_brief=brief,
              )
              request = db.scalar(select(Artifact).where(
                  Artifact.task_id == task.id,
                  Artifact.kind == "content_request"
              ).order_by(Artifact.created_at.desc()).limit(1))
              payload = json.loads(request.content)
              payload["request_publication"] = False
              payload["produce_ready_assets"] = True
              request.content = json.dumps(payload, ensure_ascii=False)
              db.commit()
              print(task.id)
          PY
          )"
          CONTENT_TASK_ID="$(echo "$CONTENT_TASK_ID" | tr -d '\r' | tail -n1)"
          [ -n "$CONTENT_TASK_ID" ] || { echo "Content task id missing"; exit 43; }
          echo "CONTENT_TASK_ID=$CONTENT_TASK_ID"

          STATE=""
          for i in $(seq 1 180); do
            STATE="$(
              docker compose --env-file /opt/ai_growth_os/.env -p ai-growth-os -f docker-compose.prod.yml exec -T api                 python - "$CONTENT_TASK_ID" <<'PY'
          import sys
          from uuid import UUID
          from app.db.session import SessionLocal
          from app.models.domain import Task
          with SessionLocal() as db:
              row = db.get(Task, UUID(sys.argv[1]))
              print(row.status.value if row else "missing")
          PY
            )"
            STATE="$(echo "$STATE" | tr -d '\r' | tail -n1)"
            echo "content_status=$STATE"
            case "$STATE" in
              completed|failed|cancelled|missing) break ;;
            esac
            sleep 8
          done

          docker compose --env-file /opt/ai_growth_os/.env -p ai-growth-os -f docker-compose.prod.yml exec -T api             python - "$CONTENT_TASK_ID" <<'PY'
          import json
          import sys
          from uuid import UUID
          from sqlalchemy import select

          from app.db.session import SessionLocal
          from app.models.domain import AgentRun, Artifact, Task

          content_id = UUID(sys.argv[1])
          with SessionLocal() as db:
              task = db.get(Task, content_id)
              print("QUALITY_RESULT_START")
              print(json.dumps({"task_id": str(content_id), "status": task.status.value}, ensure_ascii=False))

              runs = list(db.scalars(select(AgentRun).where(
                  AgentRun.task_id == content_id
              ).order_by(AgentRun.started_at, AgentRun.id)))
              print(json.dumps({
                  "runs": [{
                      "agent": r.agent_name,
                      "model": r.model,
                      "status": r.status,
                      "error": r.error,
                  } for r in runs]
              }, ensure_ascii=False))

              checkpoints = list(db.scalars(select(Artifact).where(
                  Artifact.task_id == content_id,
                  Artifact.kind == "content_stage_output",
              ).order_by(Artifact.created_at, Artifact.id)))
              print(json.dumps({
                  "fallbacks": [{
                      "stage": (payload := json.loads(a.content)).get("stage"),
                      "fallback_used": payload.get("fallback_used", False),
                      "fallback_reason": payload.get("fallback_reason"),
                  } for a in checkpoints]
              }, ensure_ascii=False))

              keep = {"article", "channel_text", "video_script", "short_video_brief", "story_brief", "static_image_brief", "content_distribution"}
              arts = list(db.scalars(select(Artifact).where(
                  Artifact.task_id == content_id
              ).order_by(Artifact.created_at, Artifact.id)))
              for a in arts:
                  if a.kind not in keep:
                      continue
                  print(json.dumps({
                      "kind": a.kind,
                      "title": a.title,
                      "content": a.content,
                  }, ensure_ascii=False))
              print("QUALITY_RESULT_END")
          PY

          [ "$STATE" = "completed" ] || { echo "Content pipeline ended as $STATE"; exit 47; }
          REMOTE
