name: ServGo SEO two-item + ProResultat one-task guarded recovery
on:
  push:
    branches: [ops/seo-plan-recovery-20261108]
    paths:
      - .github/workflows/seo-plan-recovery-20261108.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seo-plan-recovery-20261108
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
      HOST_FP: uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU
      EXPECTED_IMAGE: servgo-growth:bc1a81aef013
    steps:
      - uses: actions/checkout@v4
      - name: Check recovery syntax and pinned production version
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ops/seo_plan_recovery_20261108.py
          [ -n "$SSHPASS" ] || { echo "::error::SERVER_SSH_PASSWORD unavailable"; exit 1; }
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > /tmp/seo-server-keys
          while read -r line; do
            printf '%s\n' "$line" > /tmp/one
            ssh-keygen -lf /tmp/one 2>/dev/null | grep -q "SHA256:$HOST_FP " && printf '%s\n' "$line" >> ~/.ssh/known_hosts
          done < /tmp/seo-server-keys
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Pinned host key mismatch"; exit 1; }
          actual="$(sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" \
            "docker inspect --format '{{.Config.Image}}' ai-growth-os-api-1")"
          if [ "$actual" != "$EXPECTED_IMAGE" ]; then
            echo "::error::Production release mismatch; no recovery attempted"
            exit 1
          fi
          echo "EXPECTED_PRODUCTION_RELEASE_OK"
      - name: Requeue only vetted failed tasks and one editorial planner
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" \
            'docker exec -i ai-growth-os-api-1 python -' < scripts/ops/seo_plan_recovery_20261108.py
