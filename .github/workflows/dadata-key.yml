name: Apply DaData key to production (one-off)

# Owner only. Reads the repository secret DADATA_API_KEY, stores it root-only on the server,
# recreates the app containers and checks one registry lookup. The key is never printed.
on:
  push:
    branches: [ops/login-intake-diagnose]
    paths: [.github/dadata-key/**, .github/workflows/dadata-key.yml]

permissions:
  contents: read

concurrency:
  group: growth-production
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSHPASS: ${{ secrets.SERVER_SSH_PASSWORD }}
      DADATA_API_KEY: ${{ secrets.DADATA_API_KEY }}
      HOST: ${{ vars.DEPLOY_HOST || '155.212.162.47' }}
      HOST_FP: uQJp3lT4golKb3lsDTCFozGWR1ihlu1w/Oa4cSzCdpU
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          echo "::add-mask::$DADATA_API_KEY"
          [[ "$DADATA_API_KEY" =~ ^[0-9A-Za-z]{20,80}$ ]] || { echo "::error::Secret DADATA_API_KEY is missing or has an unexpected format"; exit 1; }
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null > /tmp/scanned
          while read -r line; do
            printf '%s\n' "$line" > /tmp/one
            ssh-keygen -lf /tmp/one 2>/dev/null | grep -q "SHA256:$HOST_FP " && printf '%s\n' "$line" >> ~/.ssh/known_hosts
          done < /tmp/scanned
          [ -s ~/.ssh/known_hosts ] || { echo "::error::host key mismatch"; exit 1; }
          { printf "DK='%s'\n" "$DADATA_API_KEY"; cat .github/dadata-key/apply.sh; } \
            | sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" 'bash -s'
