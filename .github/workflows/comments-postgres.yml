name: Comment PostgreSQL concurrency

on:
  pull_request:
    paths:
      - 'app/comments/**'
      - 'app/team_worker.py'
      - 'app/core/config.py'
      - 'app/api/comments.py'
      - 'tests/test_comments_pg.py'
      - '.github/workflows/comments-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comments-pg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  comment-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: comment_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: comment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comment_test -d comment_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      COMMENT_PG_TEST_URL: postgresql+psycopg://comment_test:local_test_only@127.0.0.1:5432/comment_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify real PostgreSQL comment locks
        run: python -m pytest -q tests/test_comments_pg.py
