name: Creative Critic one-shot
on:
  push:
    branches: [experiment/creative-critic-one-shot-20261031]
    paths: ['.github/critic-full-answer-trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLAUDEHUB_API_KEY: ${{ secrets.API }}
    steps:
      - name: Validate API secret against ClaudeHub without model inference
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error, sys
          key=os.environ.get('CLAUDEHUB_API_KEY','')
          if not key:
            sys.exit('Repository secret API is empty or inaccessible')
          req=urllib.request.Request('https://api.claudehub.fun/v1/models',headers={'Authorization':'Bearer '+key})
          try:
            with urllib.request.urlopen(req,timeout=15) as r:
              print('ClaudeHub key validated, HTTP',r.status)
          except urllib.error.HTTPError as e:
            sys.exit('ClaudeHub validation failed, HTTP '+str(e.code)+'; no model request made')
          except Exception as e:
            sys.exit('ClaudeHub validation connection failed: '+type(e).__name__+'; no model request made')
          PY
      - name: One API request, save before and after
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error
          out=pathlib.Path('critic-result'); out.mkdir(exist_ok=True)
          def status(stage, detail):
            (out/'status.json').write_text(json.dumps({'stage':stage,'detail':detail},ensure_ascii=False,indent=2))
            print('STATUS:',stage,detail,flush=True)
          original={
            "goal":"Короткая объясняющая раскадровка: зачем бизнесу онлайн-запись. Не придумывать цифры и гарантии.",
            "scenes":[
              {"title":"Время клиента","beats":[{"narration":"Клиент выбирает свободное время.","visual":"Нарисованный календарь"},{"narration":"Владелец видит расписание.","visual":"Нарисованный телефон"}]},
              {"title":"Время клиента","beats":[{"narration":"Клиент выбирает свободное время.","visual":"Нарисованный календарь"},{"narration":"Владелец видит расписание.","visual":"Нарисованный телефон"}]},
              {"title":"Время клиента","beats":[{"narration":"Клиент выбирает свободное время.","visual":"Нарисованный календарь"},{"narration":"Владелец видит расписание.","visual":"Нарисованный телефон"}]}
            ]}
          (out/'before.json').write_text(json.dumps(original,ensure_ascii=False,indent=2))
          key=os.environ.get('CLAUDEHUB_API_KEY','')
          if not key:
            status('preflight_failed','CLAUDEHUB_API_KEY secret is missing or unavailable to this workflow; no API request made')
            raise SystemExit(2)
          status('preflight_ok','Secret present; preparing exactly one API request')
          system=("Ты независимый AI Creative Critic. Оцени исходный сценарий по цели: логика, повторения, "
                  "конкретность, соответствие визуала тексту. Только существенные замечания, с цитатами "
                  "и готовыми исправлениями; не выдумывай фактов. Затем ОДИН РАЗ примени только обоснованные "
                  "замечания, сохраняя исходные ограничения. Ответь строго JSON-объектом с полями "
                  "findings (массив объектов severity, evidence, problem, proposed_fix), "
                  "decisions (массив объектов finding_index, decision, reason), "
                  "after (объект с полями goal и scenes, как во входе). Никаких пояснений вне JSON.")
          payload={"model":"kimi-2.7","temperature":0.2,
                   "response_format":{"type":"json_object"},
                   "messages":[{"role":"system","content":system},{"role":"user","content":json.dumps(original,ensure_ascii=False)}]}
          req=urllib.request.Request('https://api.claudehub.fun/v1/chat/completions',
              data=json.dumps(payload,ensure_ascii=False).encode(),
              headers={"Authorization":"Bearer "+key,"Content-Type":"application/json"},
              method='POST')
          try:
            with urllib.request.urlopen(req,timeout=240) as response:
              raw=json.load(response)
          except urllib.error.HTTPError as exc:
            status('api_http_failed','ClaudeHub HTTP '+str(exc.code)+'; check API key permissions, credits, model availability and account limits')
            raise SystemExit(3)
          except Exception as exc:
            status('api_transport_failed',type(exc).__name__+'; request may have reached provider; do not rerun before checking usage')
            raise SystemExit(4)
          (out/'usage.json').write_text(json.dumps({'model':raw.get('model'),'usage':raw.get('usage')},indent=2))
          choices=raw.get('choices') or []
          choice=choices[0] if choices else {}
          msg=(choice.get('message') or {}).get('content')
          finish=choice.get('finish_reason')
          diagnostic={'finish_reason':finish,'content_type':type(msg).__name__,
                      'content_chars':len(msg) if isinstance(msg,str) else None,
                      'usage_completion_tokens':(raw.get('usage') or {}).get('completion_tokens'),
                      'max_tokens_requested':payload.get('max_tokens')}
          if isinstance(msg,str):
            # Synthetic test input only; preserve full model output for diagnosis.
            (out/'response-content.txt').write_text(msg,encoding='utf-8')
            diagnostic['content_saved_chars']=len(msg)
          (out/'diagnostic.json').write_text(json.dumps(diagnostic,ensure_ascii=False,indent=2))
          if not isinstance(msg,str):
            status('response_content_missing','No text content returned; API request completed')
            raise SystemExit(5)
          try:
            result=json.loads(msg)
          except json.JSONDecodeError as exc:
            diagnostic['json_error']={'message':exc.msg,'line':exc.lineno,'column':exc.colno,'position':exc.pos}
            (out/'diagnostic.json').write_text(json.dumps(diagnostic,ensure_ascii=False,indent=2))
            status('response_parse_failed','JSONDecodeError; inspect diagnostic.json and response-content.txt; do not automatically rerun')
            raise SystemExit(5)
          if not isinstance(result,dict):
            status('response_schema_failed','Top-level response is not an object')
            raise SystemExit(6)
          if not isinstance(result.get('findings'),list) or not isinstance(result.get('decisions'),list) or not isinstance(result.get('after'),dict):
            status('response_schema_failed','Missing findings, decisions or after; API request completed')
            raise SystemExit(6)
          (out/'review.json').write_text(json.dumps({"findings":result['findings'],"decisions":result['decisions']},ensure_ascii=False,indent=2))
          (out/'after.json').write_text(json.dumps(result['after'],ensure_ascii=False,indent=2))
          status('completed','One request completed; before/review/after/usage saved')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-critic-one-shot
          path: critic-result/
