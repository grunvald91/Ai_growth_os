# DRAFT only: place INSIDE the existing servgo.ru:443 server block after
# verifying the active nginx config. DO NOT load automatically.
# Reuses the existing /api/ location and its upstream (BookingBot 127.0.0.1:8000).
# No additional proxy, external domain, or login changes.
#
# IMPORTANT: check there is no "location ^~ /business/" swallowing these
# regex matches; use nginx -t and isolated curl -I checks before production.

location = /business-blog-sitemap.xml {
    rewrite ^ /api/seo-pages/sitemap.xml last;
}

location ~ ^/business/[0-9]+/blog/sitemap\.xml/?$ {
    rewrite ^/business/([0-9]+)/blog/sitemap\.xml/?$ /api/seo-pages/business/$1/blog/sitemap.xml last;
}

location ~ ^/business/[0-9]+/blog/[^/]+/?$ {
    rewrite ^/business/([0-9]+)/blog/([^/]+)/?$ /api/seo-pages/business/$1/blog/$2 last;
}

location ~ ^/business/[0-9]+/blog/?$ {
    rewrite ^/business/([0-9]+)/blog/?$ /api/seo-pages/business/$1/blog last;
}
