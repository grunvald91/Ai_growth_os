<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Рекламный ролик — шаблон</title>
<style>
  /* Весь кадр вычисляется из времени: window.seek(t). Ни CSS-переходов, ни таймеров. */
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0e2a21;
           font-family: 'Inter', 'DejaVu Sans', sans-serif; color: var(--cream); }
  .beat { position: absolute; inset: 0; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; will-change: transform; }
  .headline { position: absolute; left: 90px; width: 900px; font-weight: 800; line-height: 1.04; letter-spacing: -0.02em; }
  .word { display: inline-block; margin-right: 0.26em; white-space: nowrap; }
  .label { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 700; letter-spacing: 0.32em;
           font-size: 38px; color: var(--accent); }
  .card { position: absolute; left: 90px; width: 900px; height: 150px; border-radius: 40px; background: var(--cream);
          color: var(--ink); display: flex; align-items: center; font-weight: 700; font-size: 58px; }
  .num { width: 92px; height: 92px; border-radius: 50%; background: var(--accent); color: var(--ink); margin-left: 34px;
         margin-right: 34px; display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 800; }
  .cap { position: absolute; left: 90px; top: 1260px; width: 900px; box-sizing: border-box; padding: 26px 36px;
         border-radius: 36px; background: rgba(0,0,0,.38); text-align: center; font-weight: 700; font-size: 54px; line-height: 1.22; }
  .cap .w { display: inline-block; margin: 0 .13em; }
  .day { position: absolute; width: 112px; height: 112px; border-radius: 50%; box-sizing: border-box; display: flex;
         align-items: center; justify-content: center; font-weight: 800; font-size: 38px; }
  .btn { position: absolute; left: 90px; top: 960px; width: 900px; height: 190px; border-radius: 95px; background: var(--accent);
         color: var(--ink); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 74px; }
  .big { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 800; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const W = 1080, H = 1920;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOutCubic = x => 1 - Math.pow(1 - clamp(x), 3);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
// Пружина с лёгким перелётом: готовая формула от времени, без состояния между кадрами.
function spring(t, t0, w = 15, z = 0.72) {
  const dt = t - t0; if (dt <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + (z * w / wd) * Math.sin(wd * dt));
}
const el = (cls, parent, html = '') => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; parent.appendChild(d); return d; };
const put = (e, { x = 0, y = 0, s = 1, r = 0, o = 1 } = {}) => {
  e.style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`; e.style.opacity = o;
};

let TL, DATA, beats = [];

function headline(root, tl, top, size, color2) {
  const h = el('headline chk', root); h.style.top = top + 'px'; h.style.fontSize = size + 'px';
  const words = tl.words, lines = tl.lines || [words.length];
  let k = 0; const spans = [];
  lines.forEach(n => {
    const line = el('', h); line.style.whiteSpace = 'nowrap';
    for (let i = 0; i < n && k < words.length; i++, k++) {
      const s = document.createElement('span'); s.className = 'word'; s.textContent = words[k].text;
      if (k === words.length - 1 || words[k].accent) s.style.color = color2;
      line.appendChild(s); spans.push(s);
    }
  });
  return t => spans.forEach((s, i) => {
    const p = spring(t, tl.words[i].t0 - 0.04);
    s.style.transform = `translateY(${(1 - p) * 70}px)`; s.style.opacity = clamp(p * 1.8);
  });
}

function captions(root, tl) {
  const box = el('cap chk', root); box.style.opacity = 0;
  const spans = tl.words.map(w => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w.text; box.appendChild(s); return s; });
  return t => {
    const a = clamp((t - tl.v0) / 0.2) * (1 - clamp((t - (tl.end - 0.25)) / 0.25));
    box.style.opacity = a;
    spans.forEach((s, i) => {
      const w = tl.words[i];
      s.style.color = t < w.t0 ? 'rgba(243,239,227,.38)' : (t <= w.t1 ? DATA.brand.accent : DATA.brand.cream);
    });
  };
}

const BUILD = {
  pain(root, tl) {
    const drawHead = headline(root, tl, 270, 112, DATA.brand.accent);
    // Очередь из семи фигурок выезжает справа на слове «везде»; последняя (золотая) — это «ты».
    const figs = []; const t0 = tl.words[Math.min(3, tl.words.length - 1)].t0;
    for (let k = 0; k < 7; k++) {
      const f = el('abs', root, `<svg width="120" height="230" viewBox="0 0 120 230"><circle cx="60" cy="44" r="30" fill="${k === 6 ? DATA.brand.accent : DATA.brand.cream}"/><path d="M14 218 C14 130 34 100 60 100 C86 100 106 130 106 218 Z" fill="${k === 6 ? DATA.brand.accent : DATA.brand.cream}"/></svg>`);
      figs.push(f);
    }
    const clock = el('abs', root, `<svg width="170" height="170" viewBox="0 0 170 170"><circle cx="85" cy="85" r="74" fill="none" stroke="${DATA.brand.accent}" stroke-width="10"/><line id="hand" x1="85" y1="85" x2="85" y2="34" stroke="${DATA.brand.accent}" stroke-width="10" stroke-linecap="round"/><line x1="85" y1="85" x2="116" y2="85" stroke="${DATA.brand.cream}" stroke-width="10" stroke-linecap="round"/></svg>`);
    const hand = clock.querySelector('#hand');
    const tc = tl.words[tl.words.length - 1].t0;
    return t => {
      drawHead(t);
      figs.forEach((f, k) => {
        const ts = t0 + (6 - k) * 0.08, p = easeOutCubic((t - ts) / 0.55);
        const fx = 70 + k * 138; put(f, { x: 1200 + (fx - 1200) * p, y: 960 + (k % 2) * 8, o: clamp(p * 3) });
      });
      const pc = spring(t, tc - 0.05);
      put(clock, { x: 820, y: 770, s: pc, o: clamp(pc * 2) });
      hand.setAttribute('transform', `rotate(${Math.max(0, t - tc) * 420} 85 85)`);
    };
  },
  brand(root, tl, d) {
    const scissors = el('abs', root, `<svg width="300" height="300" viewBox="-150 -150 300 300"><g id="b1"><path d="M0 0 L120 -92" stroke="${DATA.brand.accent}" stroke-width="14" stroke-linecap="round"/><circle cx="-34" cy="-50" r="30" fill="none" stroke="${DATA.brand.accent}" stroke-width="14"/></g><g id="b2"><path d="M0 0 L120 92" stroke="${DATA.brand.cream}" stroke-width="14" stroke-linecap="round"/><circle cx="-34" cy="50" r="30" fill="none" stroke="${DATA.brand.cream}" stroke-width="14"/></g><circle r="9" fill="${DATA.brand.cream}"/></svg>`);
    const b1 = scissors.querySelector('#b1'), b2 = scissors.querySelector('#b2');
    const mark = el('big chk', root, DATA.brand.name); mark.style.top = '800px'; mark.style.fontSize = '230px'; mark.style.letterSpacing = '0.07em'; mark.style.paddingLeft = '0.07em';
    const sub = el('label', root, DATA.brand.kind); sub.style.top = '1070px'; sub.style.fontSize = '50px'; sub.style.letterSpacing = '0.5em';
    const cap = captions(root, tl);
    const tn = d.cues.name;
    return t => {
      const p = spring(t, tl.s + 0.05), open = 22 * Math.exp(-(t - tl.s) * 1.2) * Math.cos((t - tl.s) * 9) + 4;
      put(scissors, { x: 390, y: 400, s: .6 + .4 * p, r: -8 + 8 * p, o: clamp(p * 2) });
      b1.setAttribute('transform', `rotate(${-open})`); b2.setAttribute('transform', `rotate(${open})`);
      const w = easeInOut((t - (tn - 0.05)) / 0.6);
      mark.style.clipPath = `inset(0 ${(1 - w) * 100}% 0 0)`; mark.style.opacity = w > 0 ? 1 : 0;
      put(sub, { y: (1 - w) * 24, o: w });
      cap(t);
    };
  },
  steps(root, tl, d) {
    const lab = el('label', root, 'КАК ЭТО РАБОТАЕТ'); lab.style.top = '250px';
    const title = el('big chk', root, d.title); title.style.top = '320px'; title.style.fontSize = '104px'; title.style.letterSpacing = '-0.02em';
    const cards = d.items.map((txt, k) => {
      const c = el('card chk', root, `<div class="num">${k + 1}</div>${txt}`); c.style.top = (560 + k * 200) + 'px'; return c;
    });
    const done = el('abs chk', root, `<div style="padding:22px 56px;border-radius:60px;background:${DATA.brand.accent};color:${DATA.brand.ink};font-weight:800;font-size:56px">✓ Готово</div>`);
    const cap = captions(root, tl);
    return t => {
      const pl = easeOutCubic((t - tl.s - 0.1) / 0.5);
      put(lab, { y: (1 - pl) * 30, o: pl }); put(title, { y: (1 - pl) * 40, o: pl });
      cards.forEach((c, k) => {
        const p = spring(t, d.cues['step' + (k + 1)] - 0.05, 16, 0.7);
        put(c, { x: (1 - p) * 260, s: .92 + .08 * p, o: clamp(p * 2.2) });
      });
      const pd = spring(t, d.cues.done - 0.03, 14, 0.62);
      put(done, { x: 300, y: 1150 + (1 - pd) * 30, s: pd, o: clamp(pd * 2) });
      cap(t);
    };
  },
  proof(root, tl, d) {
    const lab = el('label', root, 'ГРАФИК РАБОТЫ'); lab.style.top = '280px';
    const time = el('big chk', root, '00:00–00:00'); time.style.top = '470px'; time.style.fontSize = "150px"; time.style.letterSpacing = '-0.03em';
    time.style.fontVariantNumeric = 'tabular-nums';
    const every = el('big chk', root, 'каждый день'); every.style.top = '720px'; every.style.fontSize = '116px'; every.style.color = DATA.brand.accent;
    const names = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'ВС'];
    const days = names.map((n, k) => { const e = el('day', root, n); e.style.left = (78 + k * 132) + 'px'; e.style.top = '960px'; return e; });
    const cap = captions(root, tl);
    const pad = n => String(n).padStart(2, '0');
    return t => {
      const pl = easeOutCubic((t - tl.s - 0.1) / 0.5); put(lab, { y: (1 - pl) * 30, o: pl });
      const ph = easeOutCubic((t - d.cues.hours) / 0.9);
      time.textContent = `${pad(Math.round(d.open * ph))}:00–${pad(Math.round(d.close * ph))}:00`;
      const tp = spring(t, d.cues.hours - 0.05); put(time, { s: .9 + .1 * tp, o: clamp(tp * 2) });
      const pe = spring(t, d.cues.days - 0.05); put(every, { y: (1 - pe) * 50, o: clamp(pe * 2) });
      days.forEach((e, k) => {
        const lit = easeOutCubic((t - (d.cues.days + k * 0.09)) / 0.25);
        e.style.background = lit > 0.02 ? DATA.brand.accent : 'transparent';
        e.style.color = lit > 0.5 ? DATA.brand.ink : DATA.brand.cream;
        e.style.border = `5px solid ${lit > 0.02 ? DATA.brand.accent : 'rgba(243,239,227,.35)'}`;
        put(e, { s: 1 + .12 * Math.sin(Math.PI * clamp(lit)) });
      });
      cap(t);
    };
  },
  cta(root, tl, d) {
    const drawHead = headline(root, tl, 290, 124, DATA.brand.accent);
    const btn = el('btn chk', root, d.button);
    const ring = el('abs', root, ''); ring.style.cssText += `left:0;top:0;width:200px;height:200px;border-radius:50%;border:12px solid ${DATA.brand.accent};box-sizing:border-box`;
    const note = el('big chk', root, d.note); note.style.top = '1200px'; note.style.fontSize = '50px'; note.style.fontWeight = '600'; note.style.color = 'rgba(243,239,227,.75)';
    const cur = el('abs', root, `<svg width="110" height="130" viewBox="0 0 110 130"><path d="M8 6 L8 104 L36 80 L56 124 L76 114 L56 72 L92 70 Z" fill="${DATA.brand.cream}" stroke="${DATA.brand.ink}" stroke-width="7" stroke-linejoin="round"/></svg>`);
    const tc = d.cues.click, tEnd = tl.end;
    return t => {
      drawHead(t);
      const pb = spring(t, tl.s + 0.9, 14, .68);
      const press = t > tc ? spring(t, tc, 30, .5) : 0;                       // нажатие кнопки
      const pulse = t < tc ? 1 + .018 * Math.sin(t * 7) : 1;
      put(btn, { y: (1 - pb) * 80, s: pb * pulse * (1 - .06 * Math.sin(Math.PI * clamp((t - tc) / 0.28))), o: clamp(pb * 2) });
      btn.textContent = t > tc + 0.12 ? d.done : d.button;
      const pr = clamp((t - tc) / 0.7);
      put(ring, { x: 540 - 100, y: 1055 - 100, s: .3 + 4.2 * easeOutCubic(pr), o: pr > 0 ? (1 - pr) * .8 : 0 });
      put(note, { o: clamp((t - (tc + 0.4)) / 0.4) });
      // курсор подъезжает к кнопке и нажимает на слове «сейчас»
      const m = easeInOut((t - (tc - 0.95)) / 0.95);
      put(cur, { x: 930 + (640 - 930) * m, y: 1500 + (1070 - 1500) * m, s: 1 - .12 * Math.sin(Math.PI * clamp((t - tc) / 0.25)), o: clamp((t - (tc - 1.1)) / 0.2) * (1 - clamp((t - (tc + 0.9)) / 0.4)) });
    };
  },
};

const FLOOD = [null, [540, 1100], [540, 980], [900, 1060], [540, 1020]];

window.init = (data, tl) => {
  DATA = data; TL = tl;
  const root = document.getElementById('stage');
  root.style.setProperty('--cream', data.brand.cream); root.style.setProperty('--accent', data.brand.accent); root.style.setProperty('--ink', data.brand.ink);
  document.fonts && document.fonts.ready;
  tl.beats.forEach((b, i) => {
    const r = el('beat', root); r.style.background = data.brand.bg[i % data.brand.bg.length]; r.style.zIndex = i;
    const ring = el('abs', root); ring.style.zIndex = i; ring.style.width = '100px'; ring.style.height = '100px';
    ring.style.border = `14px solid ${data.brand.accent}`; ring.style.borderRadius = '50%'; ring.style.boxSizing = 'border-box'; ring.style.opacity = 0;
    beats.push({ root: r, ring, draw: BUILD[data.beats[i].type](r, b, data.beats[i]), s: b.s });
  });
};

window.seek = t => {
  beats.forEach((b, i) => {
    if (i === 0) b.root.style.clipPath = 'none';
    else {
      const p = easeInOut((t - b.s) / 0.55), R = p * 2300, [fx, fy] = FLOOD[i] || [540, 1000];
      b.root.style.clipPath = `circle(${R}px at ${fx}px ${fy}px)`; b.root.style.visibility = R > 0 ? 'visible' : 'hidden';
      put(b.ring, { x: fx - R, y: fy - R, s: 1 }); b.ring.style.width = (R * 2) + 'px'; b.ring.style.height = (R * 2) + 'px';
      const on = p > 0.02 && p < 0.98; b.ring.style.display = on ? 'block' : 'none'; b.ring.style.opacity = on ? 0.9 * (1 - p) : 0;
    }
    b.draw(t);
  });
  return true;
};

// Проверка кадра: ничего важного не вылезает за безопасную зону соцсетей (низ и верх закрывает интерфейс).
window.audit = t => {
  window.seek(t); const bad = [];
  document.querySelectorAll('.chk').forEach(e => {
    const rg = document.createRange(); rg.selectNodeContents(e); const r = rg.getBoundingClientRect();
    if (r.width === 0 || getComputedStyle(e).opacity < 0.5) return;
    const own = e.closest('.beat'), top = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
    if (!top || top.closest('.beat') !== own) return;   // закрыто следующей сценой
    if (r.left < 40 || r.right > 1040 || r.top < 200 || r.bottom > 1440) bad.push({ text: (e.textContent || '').slice(0, 24), l: Math.round(r.left), r: Math.round(r.right), t: Math.round(r.top), b: Math.round(r.bottom) });
  });
  return bad;
};
</script>
</body>
</html>
